<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>청자골 아학-교과서 어휘력 카드</title>
<style>
:root{--p:#2563eb;--p2:#1d4ed8;--bg:#f3f4f6;--fg:#111827;--mut:#6b7280;--bd:#d1d5db;--card:#ffffff;--acc:#fff7ed;--r:12px;--side:300px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100%;overflow:hidden;font-size:17px;touch-action:manipulation}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:#fff;color:var(--fg);border-radius:10px;padding:10px 14px;min-height:44px}
button.on{background:var(--p);border-color:var(--p);color:#fff}
button:active{transform:scale(.98)}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;margin:0}
.brand span{font-size:13px;color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.fg{display:flex;align-items:center;gap:6px}
.fg label{font-size:13px;color:var(--mut);min-width:30px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 12px;min-height:38px;font-size:15px}
main{flex:1 1 auto;display:flex;min-height:0}
aside{width:var(--side);flex:0 0 var(--side);background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.sideTop{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.sideTop input{flex:1;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;min-width:0}
.sideTop .cnt{font-size:13px;color:var(--mut);white-space:nowrap}
#list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#list li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:10px 10px;border-radius:10px;cursor:pointer;min-height:48px;border:1px solid transparent}
#list li+li{margin-top:2px}
#list li .no{font-size:13px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
#list li .w{font-weight:600;font-size:17px}
#list li .h{font-size:13px;color:var(--mut);letter-spacing:1px}
#list li .u{grid-column:2/4;font-size:12px;color:var(--mut)}
#list li.on{background:#eff6ff;border-color:#bfdbfe}
#list li.on .w{color:var(--p2)}
#list li.done .no::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#16a34a;margin-left:4px;vertical-align:middle}
#list .uh{padding:10px 10px 4px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.5px}
section{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
.topbar .crumb{font-size:14px;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .pos{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums}
.prog{height:4px;background:#e5e7eb;margin:8px 16px 0;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);width:0;transition:width .2s}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 16px;min-height:0}
.card{width:100%;max-width:760px;height:100%;max-height:560px;perspective:1600px;cursor:pointer;user-select:none;-webkit-user-select:none}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:1px solid var(--bd);border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 32px;overflow:auto}
.back{transform:rotateY(180deg);background:var(--acc);justify-content:flex-start}
.tag{font-size:13px;color:var(--mut);margin-bottom:10px}
.word{font-size:56px;font-weight:800;letter-spacing:2px;line-height:1.2;text-align:center;word-break:keep-all}
.hanja{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.hz{display:flex;flex-direction:column;align-items:center;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:84px;background:#fff}
.hz b{font-size:40px;font-weight:500;line-height:1.1;font-family:"Noto Serif KR","Apple Myungjo","Batang",serif}
.hz small{font-size:14px;color:#374151;margin-top:6px;white-space:nowrap}
.nohanja{color:var(--mut);font-size:15px;margin-top:22px}
.hint{position:absolute;bottom:14px;font-size:13px;color:#9ca3af}
.back .word{font-size:34px;margin-bottom:4px}
.back .hjline{font-size:17px;color:#374151;letter-spacing:2px;margin-bottom:18px}
.blk{width:100%;max-width:640px;background:#fff;border:1px solid #fed7aa;border-radius:12px;padding:14px 18px;margin-top:10px;text-align:left}
.blk h4{margin:0 0 6px;font-size:13px;color:#c2410c;font-weight:700;letter-spacing:.5px}
.blk p{margin:0;font-size:20px;line-height:1.55;word-break:keep-all}
.blk p mark{background:#fde68a;color:inherit;padding:0 2px;border-radius:3px}
.nav{display:flex;gap:10px;padding:10px 16px 12px;align-items:center;flex:0 0 auto}
.nav .big{flex:1;font-size:18px;font-weight:600;min-height:54px}
.nav .reveal{min-width:120px;min-height:54px}
.empty{color:var(--mut);text-align:center;padding:40px}
#toggleSide{display:none}
@media (max-width:900px){:root{--side:230px}.word{font-size:44px}.hz b{font-size:32px}.hz{min-width:70px}.blk p{font-size:18px}}
@media (max-width:640px){
  #toggleSide{display:inline-block}
  aside{position:absolute;left:0;top:0;bottom:0;z-index:5;transform:translateX(-100%);transition:transform .25s;box-shadow:none}
  body.sideOpen aside{transform:none}
  main{position:relative}
  .word{font-size:38px}
}

/* ===== 어휘력 퀴즈 ===== */
section{position:relative}
#list li.quizRow{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;margin-top:12px;padding:12px;min-height:60px;background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff;border:0;border-radius:14px;box-shadow:0 3px 0 #c2410c;text-align:center}
#list li.quizRow .qr1{font-weight:800;font-size:18px}
#list li.quizRow .qr2{font-size:12px;opacity:.92}
#list li.quizRow.on{background:linear-gradient(135deg,#c2410c,#9a3412);box-shadow:none;transform:translateY(2px)}
body.quizOn #list li.on:not(.quizRow){background:transparent;border-color:transparent}
body.quizOn #list li.on:not(.quizRow) .w{color:inherit}
#quiz{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:4;min-height:0}
body.quizOn #quiz{display:flex}
.qHead{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
.qHead .crumb{font-size:14px;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qHead .pos{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.qHead button{min-height:40px;padding:6px 14px;font-size:15px}
#qSide{display:none}
#qBody{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch}
#qMain{width:100%;max-width:840px;margin:auto 0}
.qCard{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:24px 28px;text-align:center}
.qCard h2{margin:6px 0 2px;font-size:30px}
.qCard .qBig{font-size:56px;line-height:1}
.qSub{color:var(--mut);font-size:15px;margin:0 0 14px}
.qInfo{list-style:none;margin:0 auto 16px;padding:0;max-width:520px;text-align:left;font-size:16px;line-height:1.7;color:#374151}
.qInfo li::before{content:"✔ ";color:#ea580c}
.qCnt{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 18px;flex-wrap:wrap}
.qCnt label{font-size:14px;color:var(--mut)}
.qCnt .seg button{min-height:46px;font-size:17px;padding:8px 18px}
.qGo{min-width:240px;min-height:60px;font-size:20px;font-weight:800;background:#ea580c;border-color:#ea580c;color:#fff}
.qBest{margin-top:14px;font-size:14px;color:#9a3412}
.qType{display:inline-block;font-size:14px;font-weight:700;color:#c2410c;background:#ffedd5;border-radius:999px;padding:5px 14px;margin-bottom:12px}
.qPrompt{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:22px 26px;text-align:center}
.qPrompt .qAsk{font-size:16px;color:var(--mut);margin:0 0 10px}
.qPrompt .qText{font-size:27px;line-height:1.6;font-weight:700;margin:0;word-break:keep-all}
.qPrompt .qWord{font-size:52px;font-weight:800;letter-spacing:2px;line-height:1.25;margin:4px 0 0;word-break:keep-all}
.qPrompt .blank{display:inline-block;min-width:96px;border-bottom:4px solid #ea580c;margin:0 4px;vertical-align:baseline;height:1em}
.qChoices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.qc{display:flex;align-items:center;gap:12px;text-align:left;min-height:76px;padding:14px 16px;font-size:20px;line-height:1.45;border:2px solid var(--bd);border-radius:16px;background:#fff;word-break:keep-all}
.qc .no{flex:0 0 34px;height:34px;border-radius:50%;background:#f3f4f6;color:#374151;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.qc.ok{background:#dcfce7;border-color:#16a34a;color:#14532d}
.qc.ok .no{background:#16a34a;color:#fff}
.qc.no{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
.qc.no .no{background:#dc2626;color:#fff}
.qc.dim{opacity:.5}
.qc:disabled{cursor:default}
.qFb{margin-top:14px;border-radius:16px;padding:14px 18px;font-size:18px;line-height:1.6;text-align:left}
.qFb.ok{background:#f0fdf4;border:1px solid #86efac}
.qFb.no{background:#fef2f2;border:1px solid #fca5a5}
.qFb .res{font-weight:800;font-size:20px;margin-bottom:4px}
.qFb mark{background:#fde68a;color:inherit;padding:0 2px;border-radius:3px}
.qFb .ex{color:#4b5563;font-size:16px;margin-top:4px}
#qNav .big{background:#ea580c;border-color:#ea580c;color:#fff}
.qScore{font-size:64px;font-weight:800;color:#ea580c;line-height:1.1;margin:6px 0}
.qScore small{font-size:26px;color:var(--mut);font-weight:600}
.qMsg{font-size:22px;font-weight:700;margin:0 0 12px}
.qWrong{text-align:left;margin:14px auto 0;max-width:640px}
.qWrong h3{font-size:15px;color:#c2410c;margin:0 0 8px}
.qWrong .it{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 14px;margin-top:8px;font-size:17px;line-height:1.5}
.qWrong .it b{font-size:19px}
.qActs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.qActs button{min-height:54px;padding:10px 22px;font-size:18px;font-weight:700}
.qActs .pri{background:#ea580c;border-color:#ea580c;color:#fff}
@media (max-width:900px){.qPrompt .qWord{font-size:44px}.qPrompt .qText{font-size:23px}.qc{font-size:18px}}
@media (max-width:640px){#qSide{display:inline-block}.qChoices{grid-template-columns:1fr}.qPrompt .qWord{font-size:38px}.qCard{padding:18px}}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ===== 학생용 추가 ===== */
html{background:var(--bg)}
.brandRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.myBtn{min-height:40px;padding:6px 14px;font-size:15px;border-radius:999px;background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8;font-weight:700;white-space:nowrap}
.pv{font-size:13px;font-weight:700;background:#fef3c7;color:#92400e;border-radius:999px;padding:4px 12px}
/* 표지 */
#cover{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#cfe8d0;overflow:hidden;transition:opacity .35s,visibility .35s}
#cover.hide{opacity:0;visibility:hidden;pointer-events:none}
#cover .bgblur{position:absolute;inset:-5%;background:var(--cv) center/cover;filter:blur(22px) saturate(1.1)}
#cover .art{position:relative;container-type:inline-size;width:min(100vw,calc(100dvh * 1.3410));aspect-ratio:1644/1226;background:var(--cv) center/100% 100% no-repeat;box-shadow:0 0 40px rgba(0,0,0,.18)}
#cover .grade{position:absolute;left:80.5%;top:42.6%;transform:translate(-50%,-50%);color:#fff;text-align:center;font-weight:800;line-height:1;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.25)}
#cover .grade b{display:block;font-size:3.6cqw}
#cover .grade small{display:block;font-size:1.8cqw;margin-top:.3cqw}
#cover .school{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);min-width:40cqw;max-width:70cqw;display:flex;flex-direction:column;align-items:center;gap:.2cqw;background:rgba(255,255,255,.94);border:.35cqw solid #fff;border-radius:3cqw;box-shadow:0 .5cqw 1.6cqw rgba(0,0,0,.2);padding:1.2cqw 3cqw;text-align:center}
#cover .school b{font-size:3.3cqw;color:#1e3a8a;letter-spacing:.05em;line-height:1.3}
#cover .school span{font-size:1.9cqw;color:#4b5563;line-height:1.3}
#coverGo{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));min-height:58px;padding:12px 28px;font-size:20px;font-weight:800;border-radius:999px;background:#ea580c;border:3px solid #fff;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.brand{cursor:pointer}
/* 승인 · 내 진도 창 */
.ovl{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.ovl.hide{display:none}
.gcard{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:26px 28px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.gcard h2{margin:0 0 6px;font-size:24px}
.gcard hr{border:0;border-top:1px solid var(--bd);margin:18px 0}
.gp{font-size:16px;line-height:1.65;color:#374151;margin:6px 0 12px}
.gl{display:block;font-size:14px;color:var(--mut);margin:10px 0 0}
.gl input{display:block;width:100%;margin-top:6px;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--bd);border-radius:12px;color:var(--fg)}
.gl input:focus{outline:none;border-color:var(--p)}
.gcode{display:block;width:100%;font:600 15px/1.55 ui-monospace,Menlo,Consolas,"Noto Sans Mono",monospace;background:#f3f4f6;border:1px dashed #9ca3af;border-radius:12px;padding:12px 14px;word-break:break-all;color:#111827;user-select:all;-webkit-user-select:all;resize:none}
.gerr{min-height:22px;margin-top:8px;font-size:15px;color:#b91c1c;font-weight:600}
.gacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.gacts button{min-height:50px;padding:10px 20px;font-size:17px;font-weight:700}
.gacts .gpri{background:#ea580c;border-color:#ea580c;color:#fff}
.gsm{font-size:14px;color:var(--mut);margin:14px 0 0}
.mrow{display:grid;grid-template-columns:84px 1fr 78px;align-items:center;gap:12px;margin:10px 0;font-size:15px}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.mbar{height:12px;background:#e5e7eb;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%;background:#16a34a;border-radius:6px}
.mbar.o i{background:#ea580c}

/* ===== 학습지 느낌 테마 (크림 바탕 · 점선 틀 · 주황 테두리) ===== */
:root{--p:#e8590c;--p2:#c2410c;--bg:#fef2e8;--ink:#011734;--line:#f9b298}
body{background:#fef2e8;color:#011734}
header{background:#fff;border-bottom:3px solid #f9b298;box-shadow:0 2px 0 #ffde59}
.brand h1{font-size:21px;font-weight:800;color:#011734;letter-spacing:-.3px;background:linear-gradient(transparent 62%,#ffde59 62%);padding:0 4px}
.seg button.on,button.pri{background:#e8590c;border-color:#e8590c;color:#fff}
aside{background:#fff8f3;border-right:2px dashed #f9b298}
.sideTop{border-bottom:2px dashed #f9b298}
.sideTop input{border:2px solid #f9b298;border-radius:12px;background:#fff}
#list li{border-radius:14px}
#list li.on{background:#fff;border:2px solid #f08a5d;box-shadow:0 2px 0 #ffde59}
#list li.on .w{color:#c2410c}
#list .uh{color:#c2410c}
section{background:
  radial-gradient(circle at 12px 12px,rgba(249,178,152,.35) 0 4px,transparent 5px) 0 0/48px 48px,
  #fef2e8}
.prog{background:#fce3da}
.prog i{background:#f08a5d}
.stage{padding:14px 18px}
.card{max-width:820px;padding:0}
.face{background:#fff;border:3px solid #f9b298;border-radius:24px;box-shadow:0 0 0 7px #fef5f2,0 0 0 9px #f9b298,0 12px 24px rgba(240,138,93,.15)}
.face::before{content:"";position:absolute;left:14px;right:14px;top:14px;bottom:14px;border:2px dotted #011734;border-radius:16px;opacity:.28;pointer-events:none}
.back{background:#fffaf6}
.tag{background:#ffde59;color:#011734;font-weight:700;border-radius:999px;padding:4px 16px;font-size:14px;border:2px solid #ffbd59}
.word{color:#011734}
.hz{border:2px dashed #a6a6a6;border-radius:8px;background:#fff}
.hz b{color:#011734}
.hz small{color:#e5352b;font-weight:700;font-size:15px}
.hint{color:#c2410c;opacity:.75}
.back .hjline{color:#011734}
.blk{border:2px solid #011734;border-radius:14px;background:#fff;box-shadow:3px 3px 0 #f9b298}
.blk h4{display:inline-block;background:#ffde59;color:#011734;border-radius:6px;padding:1px 9px;font-size:13px}
.blk p mark{background:none;color:#e5352b;font-weight:800;padding:0}
.nav .big,.nav .reveal{border:2px solid #f9b298;border-radius:14px;background:#fff;color:#011734}
.nav .reveal{background:#ffde59;border-color:#ffbd59;font-weight:800}
.nav .big:active,.nav .reveal:active{transform:translateY(1px)}

</style>

  const card=$('#card'); card.classList.remove('flip'); $('#reveal').textContent='뜻 보기';
  if(!LIST.length){ $('#front').innerHTML='<div class="empty">조건에 맞는 어휘가 없습니다.</div>'; $('#back').innerHTML=''; $('#pos').textContent=''; $('#bar').style.width='0'; $('#crumb').textContent=''; return; }
  const x=LIST[S.idx];
  const hjHtml=x.hj.length?'<div class="hanja">'+x.hj.map(h=>'<div class="hz"><b>'+esc(h.h)+'</b><small>'+esc(h.t||'')+'</small></div>').join('')+'</div>':'<div class="nohanja">고유어 · 한자 표기 없음</div>';
  $('#front').innerHTML='<div class="tag">'+x.g+'-'+x.s+' '+x.sub+' · '+esc(x.unit)+' · '+x.n+'번</div><div class="word">'+esc(x.w)+'</div>'+hjHtml+'<div class="hint">카드를 누르면 뜻이 나타납니다</div>';
  $('#back').innerHTML='<div class="tag">'+x.g+'-'+x.s+' '+x.sub+' · '+esc(x.unit)+'</div><div class="word">'+esc(x.w)+'</div><div class="hjline">'+esc(x.hj.map(h=>h.h).join(' '))+'</div>'
    +'<div class="blk"><h4>뜻</h4><p>'+esc(x.m||'—')+'</p></div>'
    +'<div class="blk"><h4>예시 표현</h4><p>'+(x.e?hl(x.e,x.w):'—')+'</p></div>';
  $('#pos').textContent=(S.idx+1)+' / '+LIST.length;
  $('#bar').style.width=((S.idx+1)/LIST.length*100)+'%';
  $('#crumb').textContent=S.g+'학년 '+S.s+'학기 · '+S.sub+' · '+(S.unit==='전체'?'전체 단원':S.unit);
  $('#prev').disabled=S.idx===0; $('#next').disabled=S.idx===LIST.length-1;
  save();
}
function flip(){
  if(!LIST.length) return; const c=$('#card'); c.classList.toggle('flip'); const on=c.classList.contains('flip');
  $('#reveal').textContent=on?'어휘 보기':'뜻 보기';
  if(on){ const x=LIST[S.idx]; if(!seenSet.has(x._i)){ seenSet.add(x._i); saveProg(); } markList(); }
}
function go(d){ if(!LIST.length) return; const n=S.idx+d; if(n<0||n>=LIST.length) return; S.idx=n; renderCard(); markList(); }
function refresh(){ closeQuiz(); renderFilters(); build(); renderList(); renderCard(); }

/* ===== 어휘력 퀴즈 (단원 1개 = 1세트, 한자 문제 없음) ===== */
let QZ=null;
const asked={};
function uKey(x){ return [x.g,x.s,x.sub,x.unit].join('|'); }
function unitWords(x){
  const seenW=new Set();
  return DATA.filter(d=>d._u===x._u&&d.m&&(seenW.has(d.w)?false:(seenW.add(d.w),true)));
}
function bestLabel(x,n){ const b=bestOf(x._u); return b?('최고 '+b.score+' / '+b.total+'점'):(n+'개 낱말 · 단원 마무리'); }
function addQuizRow(ul,x){
  const n=unitWords(x).length, li=document.createElement('li');
  li.className='quizRow'; li.dataset.qk=uKey(x); li.setAttribute('role','button');
  if(QZ&&QZ.key===uKey(x)) li.classList.add('on');
  li.innerHTML='<span class="qr1">📝 어휘력 퀴즈!</span><small class="qr2">'+esc(bestLabel(x,n))+'</small>';
  li.onclick=()=>{ openQuiz(x); document.body.classList.remove('sideOpen'); };
  ul.appendChild(li);
}
function updateQuizRows(){
  document.querySelectorAll('#list li.quizRow').forEach(r=>{
    r.classList.toggle('on',!!QZ&&r.dataset.qk===QZ.key);
    const x=DATA.find(d=>uKey(d)===r.dataset.qk); if(!x) return;
    const s=r.querySelector('.qr2'); if(s) s.textContent=bestLabel(x,unitWords(x).length);
  });
}
function openQuiz(x){
  QZ={g:x.g,s:x.s,sub:x.sub,unit:x.unit,u:x._u,key:uKey(x),words:unitWords(x),phase:'start',qs:[],i:0,score:0,wrong:[],answered:false,full:true};
  document.body.classList.add('quizOn');
  updateQuizRows(); renderQuiz();
}
function closeQuiz(){ QZ=null; document.body.classList.remove('quizOn'); updateQuizRows(); }

function candidates(x){
  const same=d=>d.g===x.g&&d.s===x.s&&d.sub===x.sub, t1=[],t2=[],t3=[],t4=[];
  for(const d of DATA){
    if(d===x||d.w===x.w||!d.m) continue;
    if(same(d)&&d.unit===x.unit) t1.push(d); else if(same(d)) t2.push(d); else if(d.sub===x.sub) t3.push(d); else t4.push(d);
  }
  return {near:[...shuffle(t1),...shuffle(t2)], far:[...shuffle(t3),...shuffle(t4)]};
}
function pickDistractors(x,field,extraOk){
  const {near,far}=candidates(x), base=field==='w'?plain(x.w):x.m;
  const similar=d=>{ const a=field==='w'?plain(d.w):d.m; return field==='w'?Math.abs(a.length-base.length)<=1:(a.length>=base.length*.5&&a.length<=base.length*2); };
  const order=[...near.filter(similar),...near.filter(d=>!similar(d)),...far.filter(similar),...far.filter(d=>!similar(d))];
  const out=[], used=new Set([base]);
  for(const d of order){
    if(out.length>=3) break;
    const v=field==='w'?plain(d.w):d.m;
    if(used.has(v)) continue;
    if(field==='w'){ if(v.includes(base)||base.includes(v)||d.m===x.m) continue; }
    if(extraOk&&!extraOk(d,v)) continue;
    used.add(v); out.push(v);
  }
  return out;
}
function blankInfo(x){
  if(!x.e) return null;
  const cs=[x.w,plain(x.w)].filter((c,i,a)=>c.length>=2&&a.indexOf(c)===i);
  for(const c of cs){ if(x.e.includes(c)) return {c,parts:x.e.split(c)}; }
  return null;
}
function maskMeaning(x){
  let m=x.m;
  [x.w,plain(x.w)].filter((c,i,a)=>c.length>=2&&a.indexOf(c)===i).forEach(c=>{ m=m.split(c).join('○○'); });
  return m;
}
function mkQ(x,type,alt){
  let b=null;
  if(type==='blank'){ b=blankInfo(x); if(!b){ type=alt; } }
  if(type==='blank'){
    const ans=b.c, ds=pickDistractors(x,'w',(d,v)=>!x.e.includes(v));
    return {x,type,label:'빈칸에 알맞은 낱말 고르기',
      html:'<p class="qAsk">빈칸에 들어갈 알맞은 낱말은 무엇일까요?</p><p class="qText">'+b.parts.map(esc).join('<span class="blank"></span>')+'</p>',
      choices:shuffle([{t:ans,ok:true},...ds.map(t=>({t,ok:false}))])};
  }
  if(type==='m2w'){
    const ds=pickDistractors(x,'w');
    return {x,type,label:'뜻을 보고 낱말 고르기',
      html:'<p class="qAsk">이 뜻에 알맞은 낱말은 무엇일까요?</p><p class="qText">'+esc(maskMeaning(x))+'</p>',
      choices:shuffle([{t:plain(x.w),ok:true},...ds.map(t=>({t,ok:false}))])};
  }
  const ds=pickDistractors(x,'m');
  return {x,type:'w2m',label:'낱말의 뜻 고르기',
    html:'<p class="qAsk">다음 낱말의 뜻으로 알맞은 것을 골라 보세요.</p><p class="qWord">'+esc(plain(x.w))+'</p>',
    choices:shuffle([{t:x.m,ok:true},...ds.map(t=>({t,ok:false}))])};
}
function pickWords(count){
  const a=asked[QZ.key]||(asked[QZ.key]=new Set()), id=w=>w._i;
  const pool=shuffle(QZ.words), fresh=pool.filter(w=>!a.has(id(w)));
  const chosen=[...fresh,...pool.filter(w=>a.has(id(w)))].slice(0,count);
  if(fresh.length<=count) a.clear();
  chosen.forEach(w=>a.add(id(w)));
  return chosen;
}
function startRun(words,full){
  const types=shuffle(['m2w','w2m','blank']);
  QZ.qs=shuffle(words).map((x,i)=>mkQ(x,types[i%3],i%2?'m2w':'w2m'));
  QZ.i=0; QZ.score=0; QZ.wrong=[]; QZ.answered=false; QZ.full=full; QZ.phase='ask';
  renderQuiz();
}
function renderQuiz(){
  if(!QZ) return;
  $('#qCrumb').textContent='어휘력 퀴즈! · '+QZ.g+'학년 '+QZ.s+'학기 · '+QZ.sub+' · '+QZ.unit;
  $('#qNav').style.display='none';
  const m=$('#qMain');
  if(QZ.phase==='start') renderQStart(m); else if(QZ.phase==='ask') renderQAsk(m); else renderQResult(m);
  $('#qBody').scrollTop=0;
}
function renderQStart(m){
  const N=QZ.words.length, opts=[...new Set([5,10,N].filter(v=>v<=N))];
  let sel=opts.filter(v=>v<=10).pop();
  $('#qPos').textContent=''; $('#qBar').style.width='0';
  const b=bestOf(QZ.u);
  m.innerHTML='<div class="qCard"><div class="qBig">📝</div><h2>어휘력 퀴즈!</h2>'
    +'<p class="qSub">'+esc(QZ.g+'학년 '+QZ.s+'학기 · '+QZ.sub+' · '+QZ.unit)+'</p>'
    +'<ul class="qInfo"><li>이 단원의 낱말 '+N+'개로 문제를 만들어요.</li><li>뜻 보고 낱말 찾기, 낱말 보고 뜻 찾기, 빈칸 채우기가 섞여 나와요.</li><li>한 문제씩 고르면 바로 정답을 알려 줘요.</li></ul>'
    +'<div class="qCnt">'+(opts.length>1?'<label>문제 수</label><div class="seg" id="qOpts"></div>':'<label>총 '+N+'문제</label>')+'</div>'
    +'<button class="qGo" id="qGo">퀴즈 시작</button>'
    +(b?'<div class="qBest">내 최고 기록: '+b.score+' / '+b.total+'점</div>':'')+'</div>';
  if(opts.length>1){
    const box=$('#qOpts');
    const draw=()=>{ box.innerHTML=''; opts.forEach(v=>{ const bt=document.createElement('button'); bt.textContent=(v===N&&v!==5&&v!==10)?'전체 '+v+'문제':v+'문제'; if(v===sel) bt.classList.add('on'); bt.onclick=()=>{ sel=v; draw(); }; box.appendChild(bt); }); };
    draw();
  }
  $('#qGo').onclick=()=>{ const c=opts.length>1?sel:N; startRun(pickWords(c),true); };
}
function renderQAsk(m){
  const q=QZ.qs[QZ.i], total=QZ.qs.length;
  $('#qPos').textContent=(QZ.i+1)+' / '+total+' · 맞힌 문제 '+QZ.score;
  $('#qBar').style.width=(QZ.i/total*100)+'%';
  QZ.answered=false;
  m.innerHTML='<div style="text-align:center"><span class="qType">문제 '+(QZ.i+1)+' · '+q.label+'</span></div>'
    +'<div class="qPrompt">'+q.html+'</div><div class="qChoices" id="qCh"></div><div id="qFb"></div>';
  const ch=$('#qCh');
  q.choices.forEach((c,k)=>{
    const bt=document.createElement('button'); bt.className='qc';
    bt.innerHTML='<span class="no">'+(k+1)+'</span><span>'+esc(c.t)+'</span>';
    bt.onclick=()=>answer(k);
    ch.appendChild(bt);
  });
}
function answer(k){
  if(!QZ||QZ.phase!=='ask'||QZ.answered) return;
  const q=QZ.qs[QZ.i]; QZ.answered=true;
  const ok=q.choices[k].ok;
  if(ok) QZ.score++; else QZ.wrong.push(q.x);
  [...$('#qCh').children].forEach((bt,j)=>{
    bt.disabled=true;
    if(q.choices[j].ok){ bt.classList.add('ok'); bt.querySelector('.no').textContent='✓'; }
    else if(j===k){ bt.classList.add('no'); bt.querySelector('.no').textContent='✕'; }
    else bt.classList.add('dim');
  });
  const x=q.x;
  $('#qFb').innerHTML='<div class="qFb '+(ok?'ok':'no')+'"><div class="res">'+(ok?'⭕ 정답이에요!':'❌ 아쉬워요. 다시 기억해 봐요!')+'</div>'
    +'<div><b>'+esc(plain(x.w))+'</b> : '+esc(x.m)+'</div>'
    +(x.e?'<div class="ex">예) '+hl(x.e,x.w)+'</div>':'')+'</div>';
  $('#qPos').textContent=(QZ.i+1)+' / '+QZ.qs.length+' · 맞힌 문제 '+QZ.score;
  $('#qBar').style.width=((QZ.i+1)/QZ.qs.length*100)+'%';
  const last=QZ.i===QZ.qs.length-1;
  $('#qNext').textContent=last?'결과 보기 ›':'다음 문제 ›';
  $('#qNav').style.display='flex';
  $('#qFb').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function recordQuiz(){
  const total=QZ.qs.length, cur=PROG.quiz[QZ.u]||[0,0,0,0,0];
  cur[2]++; cur[3]=QZ.score; cur[4]=total;
  if(QZ.full){
    const b=cur[1]?cur[0]/cur[1]:-1, p=QZ.score/total;
    if(p>b||(p===b&&total>cur[1])){ cur[0]=QZ.score; cur[1]=total; }
  }
  PROG.quiz[QZ.u]=cur;
  QZ.wrong.forEach(x=>{ PROG.wrong[x._i]=(PROG.wrong[x._i]||0)+1; });
  saveProg();
}
function nextQ(){
  if(!QZ||QZ.phase!=='ask'||!QZ.answered) return;
  if(QZ.i<QZ.qs.length-1){ QZ.i++; renderQuiz(); }
  else{ QZ.phase='result'; recordQuiz(); updateQuizRows(); renderQuiz(); }
}
function renderQResult(m){
  const total=QZ.qs.length, sc=QZ.score, pct=sc/total;
  $('#qPos').textContent='결과'; $('#qBar').style.width='100%';
  const msg=pct===1?'🎉 완벽해요! 모두 맞혔어요!':pct>=.8?'👏 아주 잘했어요!':pct>=.6?'😊 잘했어요. 조금만 더 힘내요!':'💪 카드를 다시 보고 한 번 더 도전해 봐요!';
  const wrong=QZ.wrong;
  m.innerHTML='<div class="qCard"><div class="qBig">📝</div><h2>퀴즈 결과</h2>'
    +'<div class="qScore">'+sc+'<small> / '+total+'</small></div><p class="qMsg">'+msg+'</p>'
    +(wrong.length?'<div class="qWrong"><h3>다시 확인해 볼 어휘 ('+wrong.length+'개)</h3>'+wrong.map(x=>'<div class="it"><b>'+esc(plain(x.w))+'</b> : '+esc(x.m)+'</div>').join('')+'</div>':'')
    +'<div class="qActs">'
    +(wrong.length?'<button class="pri" id="qRetryW">틀린 어휘 다시 풀기</button>':'')
    +'<button id="qAgain">'+(wrong.length?'새로 풀기':'한 번 더 풀기')+'</button>'
    +'<button id="qBack">어휘 카드 보기</button></div></div>';
  if(wrong.length) $('#qRetryW').onclick=()=>startRun(wrong.slice(),false);
  $('#qAgain').onclick=()=>{ QZ.phase='start'; renderQuiz(); };
  $('#qBack').onclick=()=>closeQuiz();
}
function quizKey(e){
  if(QZ.phase==='ask'&&/^[1-4]$/.test(e.key)){ answer(+e.key-1); }
  else if(QZ.phase==='ask'&&e.key==='ArrowRight'){ nextQ(); }
  else if(e.key==='Escape'){ closeQuiz(); }
}

/* ===== 표지 ===== */
const cover=$('#cover');
function periodText(){ return CONFIG.grade+'학년 '+CONFIG.semester+'학기 · '+CONFIG.subjects.join('·'); }
function enter(){ cover.classList.add('hide'); }

/* ===== 시작 ===== */
$('#brandSub').textContent=CONFIG.school+' · '+periodText();
$('#coverSchool').textContent=CONFIG.school;
const PUBS=CONFIG.publishers||{}, pl=CONFIG.subjects.filter(x=>PUBS[x]).map(x=>x+' '+PUBS[x]).join(' · ');
$('#coverSub').textContent=periodText();
if(pl){ const e=document.createElement('span'); e.textContent=pl; $('#coverSub').parentNode.appendChild(e); }
$('#coverGrade').textContent=CONFIG.grade;
document.title='청자골 아학-교과서 어휘력 카드 · '+CONFIG.school+' ('+CONFIG.grade+'학년 '+CONFIG.semester+'학기)';
if(PREVIEW) $('#pvChip').hidden=false;
$('#coverGo').onclick=enter;
$('.brand').onclick=()=>cover.classList.remove('hide');
$('#card').addEventListener('click',flip);
$('#reveal').onclick=flip;
$('#prev').onclick=()=>go(-1);
$('#next').onclick=()=>go(1);
$('#toggleSide').onclick=()=>document.body.classList.toggle('sideOpen');
$('#q').value=S.q||'';
$('#q').addEventListener('input',e=>{ S.q=e.target.value; S.idx=0; build(); renderList(); renderCard(); });
$('#qNext').onclick=nextQ;
$('#qExit').onclick=()=>closeQuiz();
$('#qSide').onclick=()=>document.body.classList.toggle('sideOpen');
document.addEventListener('keydown',e=>{
  const tg=e.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA') return;
  if(!cover.classList.contains('hide')) return;
  if(QZ){ quizKey(e); return; }
  if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1); else if(e.key===' '){ e.preventDefault(); flip(); }
});
let tx=null,ty=null;
const stage=document.querySelector('.stage');
stage.addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
stage.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null; if(Math.abs(dx)>60&&Math.abs(dy)<80){ go(dx<0?1:-1); } },{passive:true});
refresh();

</script>
