여 먹었다."],["빙하기","氷河期","얼음 빙|물 하|기약할 기","지구의 기온이 오랜 시간 동안 내려가 큰 얼음덩어리인 빙하가 넓은 지역을 덮었던 시기","빙하기에는 날씨가 매우 추워 넓은 지역이 얼음으로 덮여 있었다."],["신석기시대","新石器時代","새 신|돌 석|그릇 기|때 시|대신할 대","사람들이 돌을 갈고 다듬어 정교하게 만든 간석기를 사용하던 선사 시대의 한 시기","신석기 시대 사람들은 간석기를 사용하고 농사를 지으며 정착 생활을 하였다."],["토기","土器","흙 토|그릇 기","흙으로 빚은 뒤 불에 구워 만든 그릇","신석기 시대 사람들은 음식을 저장하거나 조리하기 위해 빗살무늬 토기를 만들어 사용했다."],["청동기시대","靑銅器時代","푸를 청|구리 동|그릇 기|때 시|대신할 대","사람들이 구리와 주석 등을 섞어 만든 청동으로 도구를 만들어 사용하던 시대","청동기 시대에는 청동으로 만든 도구를 사용하고 농사를 지으며 생활했다."],["청동","靑銅","푸를 청|구리 동","구리에 주석이나 납 등을 섞어서 만든 금속","청동기 시대 사람들은 청동으로 칼이나 거울과 같은 도구를 만들어 사용했다."],["망루","望樓","바랄 망|다락 루","적의 움직임이나 주변 분위기를 살피기 위해 높이 지은 다락집","청동기 시대 사람들은 마을을 지키기 위해 높은 망루를 세워 주변을 살폈다."],["지배자","支配者","지탱할 지|짝 배|사람 자","남을 지배하거나 지배적인 위치에 있는 사람","청동기 시대에는 힘과 권력을 키워 다른 사람들을 다스리는 지배자가 나타났다."],["고조선","古朝鮮","옛 고|아침 조|고울 선","단군왕검이 세운 우리 역사 최초의 나라","청동기 시대에 단군왕검은 우리 역사 속 최초의 국가인 고조선을 세웠다."],["기원","紀元","벼리 기|으뜸 원","연대를 세는 데에 기준이 되는 해. 그 이전의 시기는 기원전으로 연대를 셈","기원은 역사에서 연대를 세는 기준이 되는 해이다."],["철기문화","鐵器文化","쇠 철|그릇 기|글월 문|될 화","철로 만든 도구를 사용하며 발달한 문화","고조선은 철기 문화를 받아들여 크게 성장했다."],["철제","鐵製","쇠 철|지을 제","쇠로 만듦","철기 시대에는 날카롭고 튼튼한 철제 무기를 사용했다."],["토착","土着","흙 토|붙을 착","대대로 그 땅에서 살고 있음","압록강 유역에는 그 지역에서 대대로 살아온 토착 세력이 있었다."],["고구려","高句麗","높을 고|글귀 구|고울 려","우리나라 고대의 삼국 중 하나로 주몽이 압록강 유역 졸본 지역에 세운 나라","주몽은 여러 세력과 힘을 합쳐 고구려를 세웠다."],["부여","夫餘","지아비 부|남을 여","고조선 멸망 전후에 한반도 북쪽과 만주 지역에서 성장한 고대 국가","부여에서는 여러 부족이 힘을 모아 나라를 이끌었다."],["옥저","沃沮","기름질 옥|막을 저","고조선 멸망 전후에 한반도 북동쪽에서 성장한 나라","옥저에는 어린 여성이 남성의 집에 가서 살다가 혼인하는 풍습이 있었다."],["동예","東濊","동녘 동|종족 이름 예","고조선 멸망 전후에 한반도 동해안 지역에서 성장한 나라","동예에는 다른 마을의 영역을 함부로 침범하지 않는 풍습이 있었다."],["삼한","三韓","석 삼|나라 한","한반도 남쪽에 있던 마한·진한·변한을 함께 이르는 말","삼한에서는 농사와 관련된 제사를 지내기도 했다."],["백제","百濟","일백 백|건널 제","우리나라 삼국 시대의 세 나라 가운데 하나로, 온조가 한강 유역에 세운 나라","백제는 한강 유역을 중심으로 성장하며 세력을 넓혀 갔다."],["신라","新羅","새 신|그물 라","우리나라 삼국 시대의 세 나라 가운데 하나로, 박혁거세가 경주 지역에 세운 나라","신라는 주변의 여러 나라와 경쟁하며 세력을 넓혀 갔다."],["가야","伽倻","절 가|가야 야","한반도 남쪽의 낙동강 하류 지역에서 여러 나라가 연맹을 이루어 발전한 나라","가야는 철이 풍부하여 철기문화가 발달하였다."],["삼국통일","三國統一","석 삼|나라 국|거느릴 통|한 일","7세기 후반에, 신라가 백제와 고구려를 차례로 멸망시키고 통일 국가를 세운 일","신라는 당과의 전쟁에서 승리해 삼국 통일을 이루었다."],["발해","渤海","발해 발|바다 해","고구려 출신 대조영이 고구려 유민과 말갈 집단을 이끌고 고구려의 옛 땅에 세운 나라","발해는 고구려를 계승한 나라이다."],["청해진","淸海鎭","맑을 청|바다 해|진영 진","통일 신라 때 장보고가 지금의 완도에 설치한 해상 무역과 해상 방어의 중심지","장보고는 청해진을 설치해 당, 일본과 무역을 펼쳤다."],["해동성국","海東盛國","바다 해|동녘 동|성할 성|나라 국","크게 발전하고 번성한 발해를 당나라에서 부르던 말","당에서는 발해를 바다 동쪽에서 크게 번성한 나라라는 뜻으로 ‘해동성국’이라고 불렀다."],["골품제","骨品制","뼈 골|물건 품|절제할 제","신라 때에 혈통에 따라 나눈 신분 제도","신라에는 골품제라는 신분 제도가 있었다."],["귀족","貴族","귀할 귀|겨레 족","높은 신분으로 많은 권력과 재산을 가진 사람들","귀족은 많은 땅과 노비를 소유하고 부유하게 살았다."],["평민","平民","평평할 평|백성 민","특별히 높은 신분이 아닌 일반 백성","평민은 대부분 농민으로, 나라에 세금을 내고 나라의 큰 공사에 동원되기도 했다."],["천민","賤民","천할 천|백성 민","옛날 신분 사회에서 신분이 낮았던 사람들","천민은 대부분 노비로 관청이나 귀족에 속해 정해진 일을 하였다."],["진대법","賑貸法","구휼할 진|빌릴 대|법 법","먹을 것이 부족한 봄에 나라에서 백성에게 곡식을 빌려주고, 수확하는 가을에 갚도록 한 제도","고구려에서는 먹을 것이 부족한 봄에 곡식을 빌려주고 가을에 갚게 하는 진대법을 실시했다."],["불교","佛敎","부처 불|가르칠 교","인도의 석가모니가 가르침을 펼치면서 시작된 종교로, 고통에서 벗어나 부처가 되는 것을 이상으로 삼는 종교","삼국은 왕실과 귀족을 중심으로 불교를 받아들여 나라의 힘을 하나로 모으고자 했다."],["호족","豪族","호걸 호|겨레 족","통일 신라 말 지방에서 경제력과 군사력을 키워 성장한 세력","통일 신라 말기 지방에서는 호족이 성장했다."],["고려","高麗","높을 고|고울 려","왕건이 후삼국을 통일하고 918년에 세운 나라","왕건은 후삼국을 통일하고 고려를 세웠다."],["과거제","科擧制","과목 과|들 거|절제할 제","고려 시대와 조선 시대 때 시험을 통해 관리를 뽑던 제도","고려에서는 과거제를 실시하여 시험을 통해 관리를 뽑았다."],["문신","文臣","글월 문|신하 신","공부하고 연구하는 학자 출신의 신하","고려에서는 학문을 공부한 문신들이 높은 관직을 차지하기도 했다."],["무신","武臣","호반 무|신하 신","무예를 익혀 나라를 지키는 군인에 해당하는 신하","고려의 무신들은 무예를 익혀 나라를 지키는 일을 하였다."],["정변","政變","정사 정|변할 변","법을 따르지 않고 반란을 일으켜 정권을 바꾸는 일","고려의 무신들은 정변을 일으켜 권력을 차지하였다."],["벽란도","碧瀾渡","푸를 벽|물결 란|건널 도","고려 시대에 외국과의 무역이 활발하게 이루어졌던 국제 무역항","고려 시대에는 벽란도를 통해 송을 비롯한 여러 나라의 상인들이 물건을 사고팔았다."],["금속활자","屬活字","쇠 금|무리 속|살 활|글자 자","글을 인쇄하기 위해 금속으로 만든 낱개의 글자판","고려에서는 금속 활자를 이용하여 책을 인쇄하였다."],["상감기법","象嵌技法","코끼리 상|산골짜기 감|재주 기|법 법","도자기의 표면을 파서 무늬를 새기고, 그 자리에 다른 색의 흙을 채워 굽는 기법","고려 시대에는 청자에 무늬를 새기는 데 상감 기법을 사용하였다."]],"2단원":[["조선","朝鮮","아침 조|고울 선","고려를 이어 이성계가 세운 나라","이성계는 고려를 대신하여 새로운 왕조인 조선을 세웠다."],["성리학","性理學","성품 성|다스릴 리|배울 학","사람이 지켜야 할 바른 도리를 중요시하는 유교 가르침의 한 갈래","이성계는 성리학의 가르침을 따르는 사람들과 함께 조선을 세웠다."],["유교","儒敎","선비 유|가르칠 교","공자의 가르침을 근본으로 삼는 종교로, 사람이 지켜야 할 도리와 예절을 중요하게 여기는 가르침","조선은 유교의 가르침을 나라를 다스리는 기본 원리로 삼았다."],["임진왜란","壬辰倭亂","북방 임|별 진|왜나라 왜|어지러울 란","1592년에 일본이 조선을 침략하여 일어난 전쟁","임진왜란이 일어나자 백성들은 스스로 의병을 일으켜 일본군에 맞서 싸웠다."],["의병","義兵","옳을 의|병사 병","나라가 위급할 때 백성들이 스스로 조직한 군대","이순신이 이끄는 수군과 전국 각지에서 일어난 의병이 활약했다."],["병자호란","丙子胡亂","남녘 병|자식 자|호 오 랑 캐|어지러울 란","1636년에 청이 조선을 침략하여 일어난 전쟁","병자호란 때 청의 군대가 조선을 침략하자 조선은 이에 맞서 싸웠으나 결국 항복했다."],["천인","賤人","천할 천|사람 인","조선 시대 신분제에서 가장 낮은 신분에 속한 사람. 법적으로는 천인이라고 하나, 실제로는 천민으로 구분함","조선 시대에는 신분을 크게 양인과 천인으로 나뉘었다."],["국역","國役","나라 국|부역 역","나라의 큰 공사에 동원되거나(부역) 군대에 가는 것(군역)을 의미함","양반은 관리가 되거나 나랏일에 참여하면서 국역을 면제받았다."],["통역","通譯","통할 통|번역할 역","말이 통하지 않는 사람 사이에서 뜻이 통하도록 말을 옮겨 줌","중인은 의학, 법률, 통역 등 전문적인 일을 하기도 하였다."],["훈민정음","訓民正音","가르칠 훈|백성 민|바를 정|소리 음","백성을 가르치는 바른 소리라는 뜻으로, 1443년에 세종대왕이 창제한 우리나라 글자","세종은 백성들이 쉽게 읽고 쓸 수 있는 글자인 훈민정음을 만들어 반포했다."],["분청사기","粉靑沙器","가루 분|푸를 청|모래 사|그릇 기","청자의 그릇 표면에 흰 흙을 발라 다시 구워낸 자기","조선 시대에는 화려한 청자보다는 실용적인 분청사기와 백자를 사용했다."],["탕평","蕩平","쓸어 없앨 탕|평평할 평","어느 한쪽에 치우치지 않고 사람을 고르게 뽑아 씀","영조와 정조는 붕당 간의 대립을 줄이기 위해 탕평 정치를 펼쳤다."],["문물","文物","글월 문|물건 물","문화가 발전하면서 사람들이 만들어 낸 학문, 예술, 기술 등을 이르는 말","조선 후기에는 안경, 자명종, 천리경 등 새로운 서양 문물이 조선에 전해졌다."],["실학자","實學者","열매 실|배울 학|사람 자","조선 후기에 새로운 문물과 현실 문제 등에 관심을 두고 이를 연구한 학자","조선 후기 실학자들은 청나라의 문물을 도입하고 농업과 상공업을 발전시킬 방법을 연구하였다."],["천주교","天主敎","하늘 천|임금 주|가르칠 교","하느님을 믿고 모든 사람이 평등하다는 가르침을 따르는 종교","조선 후기에는 서양의 종교인 천주교가 서학이라는 이름으로 전해졌다."],["동학","東學","동녘 동|배울 학","조선 후기에 우리 고유의 것을 지키고 사람의 평등을 중요하게 여기며 최제우가 창시한 종교","동학은 모든 사람이 소중하고 평등하며 우리 것을 존중해야 한다는 생각을 중요하게 여겼다."],["서민문화","庶民文化","여러 서|백성 민|글월 문|될 화","조선 후기에 일반 백성들이 즐기며 발달시킨 문화","조선 후기에는 한글 소설, 판소리, 탈놀이 등이 유행하면서 서민 문화가 발달하였다."],["풍속화","風俗畫","바람 풍|풍속 속|그림 화","사람들의 생활 모습을 생생하게 그린 그림","조선 후기의 풍속화에는 사람들이 일하거나 놀이를 즐기는 모습이 담겨 있다."],["민화","民畫","백성 민|그림 화","일반 백성들이 생활 속에서 즐겨 그린 그림","사람들은 민화를 집에 걸어 가족과 마을의 행복을 빌기도 했다."],["개항","開港","열 개|항구 항","항구를 열어 외국과 교류함","조선은 개항을 하면서 항구를 열고 외국과 교류하기 시작했다."],["세도정치","勢道政治","형세 세|길 도|정사 정|다스릴 치","왕실과 혼인 관계를 맺은 집안이 권력을 휘두르는 정치","조선 말기에는 일부 집안이 권력을 차지하는 세도 정치로 여러 문제가 나타났다."],["통상","通商","통할 통|헤아릴 상","나라와 나라 사이에 물품을 사고파는 것","조선 후기에는 서양 여러 나라의 배가 조선의 해양에 나타나 통상을 요구하였다."],["조약","條約","가지 조|맺을 약","나라와 나라 사이에 반드시 지켜야 할 내용을 문서로 작성한 약속","강화도 조약은 1876년에 조선이 외국과 맺은 최초의 근대적 조약으로, 강압에 의해 맺어진 불평등 조약이었다."],["개화","開化","열 개|될 화","외국의 더 발전된 문화나 제도를 받아들이는 것","조선은 서양의 발달된 문물과 제도를 받아들이는 개화 정책을 펼쳤다."],["근대","近代","가까울 근|대신할 대","현대 사회의 특징이 나타나기 시작한 가까운 과거의 시대","개항 이후 대한 제국에는 전기와 전화, 철도 등 새로운 근대 시설과 문물이 들어왔다."]],"3단원":[["일제","日帝","날 일|임금 제","‘일본 제국’의 줄임말. 군사력을 앞세워 다른 나라를 침략했던 과거의 일본을 지칭하는 말","일제는 우리나라를 식민지로 삼아 오랫동안 지배하였다."],["을사늑약","乙巳勒約","새 을|뱀 사|굴레 늑|맺을 약","1905년 일본이 대한 제국의 외교권을 빼앗기 위해 강제적으로 맺은 조약","러일 전쟁에서 승리한 일제는 1905년 대한 제국을 강압하여 을사늑약을 맺었다."],["외교권","外交權","바깥 외|사귈 교|권세 권","다른 나라의 간섭을 받지 않고 외국과 조약이나 협정을 맺을 수 있는 권리","일제는 을사늑약을 강제로 체결하여 대한 제국의 외교권을 빼앗았다."],["국권","國權","나라 국|권세 권","국가가 행사하는 권력으로, 주권과 통치권을 말함","대한 제국은 1910년에 일제에 국권을 빼앗기고 일본의 식민지가 되었다."],["강점기","強占期","강할 강|점령할 점|기약할 기","남의 영토, 권리 등을 강제로 빼앗아 차지한 시기","우리나라는 1910년부터 1945년까지 일제의 지배를 받는 일제 강점기를 겪었다."],["조선총독부","朝鮮總督府","아 침 조|고울 선|합할 총|독 감 독 할|관청 부","일제가 한국을 통치하려고 세운 기관","일제는 조선 총독부를 세워 우리나라를 통치했다."],["검열","檢閱","검사할 검|셀 열","살펴서 조사하는 일","일제는 우리나라의 신문과 잡지를 검열해 자신들을 비판하는 내용을 싣지 못하게 하였다."],["신사","","귀신 신|토지신 사","일본 왕실의 조상, 일본에 큰 공을 세운 사람 등을 신으로 모시는 곳","일제는 우리나라에 신사를 세우고 우리나라 사람들을 강제로 참배하게 했다."],["3.1운동(삼일운동)","三一運動","석 삼|한 일|옮길 운|움직일 동","1919년 3월 1일, 일제의 지배에 저항하고 우리나라의 독립을 요구하며 전국에서 벌인 만세 운동","1919년 3월 1일, 전국의 많은 사람들이 3·1운동(삼일운동)에 참여하여 독립 만세를 외쳤다."],["선언서","宣言書","베풀 선|말씀 언|글 서","어떤 일을 널리 알리기 위해 그 내용을 적은 글","사람들은 독립 선언서를 읽으며 거리에서 독립 만세를 외쳤다."],["임시정부","臨時政府","임할 임|때 시|정사 정|관청 부","1919년 4월에 중국 상하이에서 대한민국의 광복을 위하여 임시로 조직한 정부","3·1 운동 이후 여러 임시 정부의 힘을 하나로 모아 중국 상하이에 대한민국 임시 정부를 세웠다."],["무장","武裝","호반 무|꾸밀 장","전투에 필요한 무기와 장비를 갖춤","3·1 운동 이후 만주와 연해주를 중심으로 무장 독립운동이 활발해졌다."],["대중문화","大衆文化","큰 대|무리 중|글월 문|될 화","대중이 공통으로 쉽게 접하고 즐길 수 있는 문화","일제 강점기에는 대중문화가 유행했다."],["유출","流出","흐를 유|날 출","귀한 물건이나 정보 등이 불법적으로 외부로 나가 버림","일제 강점기에 우리나라의 귀중한 문화유산이 일본 등 해외로 유출되기도 했다."],["광복","光復","빛 광|회복할 복","빼앗긴 주권을 도로 찾음","1945년 8월 15일 일본이 연합군에 항복하면서 우리나라는 광복을 맞이했다."],["제헌","制憲","절제할 제|법 헌","헌법을 만들어 정하는 일","1948년 제헌 국회는 나라 이름을 대한민국으로 정하고 제헌 헌법을 만들었다."],["정전","停戰","머무를 정|싸움 전","전쟁 중에 서로 합의하여 일시적으로 전투를 중단하는 일","1953년 정전 협정이 체결되면서 6·25 전쟁이 멈추었다."],["피란","避亂","피할 피|어지러울 란","전쟁이나 난리를 피해 다른 곳으로 옮겨 감","6·25 전쟁으로 인해 많은 사람이 피란길에 올랐다."]]},"천재교과서(박기범)":{"1단원":[["유물","遺物","남길 유|물건 물","앞선 세대의 사람들이 후세에 남긴 물건","선사 시대 사람들이 사용했던 토기와 돌로 만든 도구 같은 유물이 발견되었다."],["유적","遺跡","남길 유|발자취 적","옛사람들이 남긴 건축물이나 무덤, 역사적인 사건이 일어난 장소 등의 흔적","선사 시대 사람들이 살았던 집터와 무덤 같은 유적이 발견되었다."],["선사시대","先史時代","먼저 선|역사 사|때 시|대신할 대","인간이 문자를 발명해 기록을 남기기 이전의 시대","선사 시대에는 문자를 사용하지 않았기 때문에 당시 사람들이 남긴 유적과 유물을 통해 생활 모습을 알 수 있다."],["구석기시대","舊石器時代","옛 구|돌 석|그릇 기|때 시|대신할 대","약 70만 년 전 돌을 깨뜨리거나 떼어 만든 뗀석기를 주로 사용하던 선사 시대의 한 시기","구석기 시대 사람들은 뗀석기를 사용하여 사냥과 채집을 하며 생활했다."],["채집","採集","캘 채|모을 집","널리 찾아서 얻거나 캐거나 잡아 모으는 일","구석기 시대 사람들은 산과 들에서 열매와 식물의 뿌리를 채집하여 먹었다."],["신석기시대","新石器時代","새 신|돌 석|그릇 기|때 시|대신할 대","약 1만 년 전후, 돌을 갈아 만든 간석기를 사용하던 선사 시대의 한 시기","신석기 시대 사람들은 간석기를 사용하고 농사를 지으며 정착 생활을 하였다."],["토기","土器","흙 토|그릇 기","흙으로 빚은 뒤 불에 구워 만든 그릇","신석기 시대 사람들은 음식을 저장하거나 조리하기 위해 빗살무늬 토기를 만들어 사용했다."],["청동기","靑銅器","푸를 청|구리 동|그릇 기","구리와 주석을 섞은 금속으로 만든 도구","청동기는 주로 지배자와 제사장의 제사 도구나 장신구, 무기 등으로 사용됐다."],["청동기시대","靑銅器時代","푸를 청|구리 동|그릇 기|때 시|대신할 대","사람들이 구리와 주석 등을 섞어 만든 청동으로 도구를 만들어 사용하던 시대","청동기 시대에는 제사용 거울, 방울 등과 무기, 장신구를 만드는 데 청동을 사용했다."],["가축","家畜","집 가|짐승 축","집에서 기르는 짐승","청동기 시대 사람들은 가축을 기르고 농사를 지었다."],["고조선","古朝鮮","옛 고|아침 조|고울 선","단군왕검이 세운 우리 역사 최초의 나라","단군왕검은 우리 역사 속 최초의 국가인 고조선을 세웠다."],["연맹","聯盟","잇닿을 련(연)|맹세 맹","서로 돕고 함께 행동할 것을 약속한 집단이나 나라","청동기 시대 여러 공동체는 서로 연맹을 맺어 세력을 넓혀 갔다."],["철기문화","鐵器文化","쇠 철|그릇 기|글월 문|될 화","철로 만든 도구를 사용하던 문화","고조선이 멸망한 이후 한반도와 그 주변 지역에서는 철기 문화를 바탕으로 여러 나라들이 등장했다."],["고구려","高句麗","높을 고|글귀 구|고울 려","주몽이 졸본 지역에 세운 나라로, 삼국 시대의 삼국 가운데 하나","주몽은 여러 세력과 힘을 합쳐 고구려를 세웠다."],["부여","夫餘","지아비 부|남을 여","고구려 북쪽에 있던 나라로 부여족이 북만주 일대에 세운 나라","부여는 철기 문화를 바탕으로 성장하였다."],["백제","百濟","일백 백|건널 제","고구려 왕자였던 온조가 남쪽으로 내려와 한강 유역에 살던 세력과 힘을 합해 세운 나라","온조는 위례성을 도읍으로 정하고 백제라는 나라를 세웠다."],["신라","新羅","새 신|그물 라","박혁거세가 지금의 경주 지역을 중심으로 세운 나라","박혁거세는 왕이 되어 나라 이름을 신라라고 하였다."],["가야","伽倻","절 가|가야 야","한반도 남쪽의 낙동강 하류 지역에서 여러 나라가 연맹을 이루어 발전한 나라","가야는 질 좋은 철을 생산하여 다른 나라에 팔았다."],["세기","世紀","인간 세|벼리 기","100년을 1세기로 정해 연대를 세는 단위. 1년부터 100년까지를 1세기라고 함","백제는 4세기 근초고왕 때 전성기를 맞이했다."],["전성기","全盛期","온전할 전|성할 성|기약할 기","어떤 집단의 세력이 가장 강하고 왕성한 시기","고구려는 4~5세기 광개토 대왕과 장수왕 때 영토를 크게 확장하면서 전성기를 맞이했다."],["고분","古墳","옛 고|무덤 분","옛사람들이 만든 무덤","고구려의 고분 벽화를 보면 당시 사람들의 생활 모습을 유추할 수 있다."],["불교","佛敎","부처 불|가르칠 교","부처의 가르침에 따라 자비를 중시하는 종교","삼국은 불교를 활용하여 왕의 권위를 높이고, 백성의 마음을 하나로 모으고자 했다."],["골품제","骨品制","뼈 골|물건 품|절제할 제","신라의 신분 제도로 성골과 진골, 그 아래 6두품부터 1두품까지 등급으로 나뉨","신라에는 골품제라는 신분 제도가 있었다."],["유민","遺民","남길 유|백성 민","멸망하여 없어진 나라의 백성","신라는 고구려의 유민과 힘을 합쳐 당에 맞서 싸웠다."],["발해","渤海","발해 발|바다 해","고구려 출신 대조영이 고구려 유민과 말갈 집단을 이끌고 동모산 부근에 세운 나라","발해는 고구려를 계승한 나라이다."],["해동성국","海東盛國","바다 해|동녘 동|성할 성|나라 국","크게 발전하고 번성한 발해를 당나라에서 부르던 말","당나라는 발해를 ‘바다 동쪽의 융성한 나라’를 뜻하는 해동성국이라고 불렀다."],["호족","豪族","호걸 호|겨레 족","신라 말에 군사력과 경제력을 가지고, 각 지역을 다스린 지방 세력","신라 말에는 귀족들의 왕위 다툼으로 왕권이 약해지면서 지방에서 새로운 세력인 호족이 성장했다."],["고려","高麗","높을 고|고울 려","왕건이 후삼국을 통일하고 918년에 세운 나라","왕건은 후삼국을 통일하고 고려를 세웠다."],["벽란도","碧瀾渡","푸를 벽|물결 란|건널 도","고려 시대에 다른 나라와 무역이 활발하게 이루어졌던 대표적인 국제 무역항","고려 시대 벽란도는 여러 나라의 상인들이 드나드는 국제 무역항으로 발달하였다."],["강화","講和","강론할 강|화할 화","싸우던 두 편이 싸움을 멈추고 평화로운 상태가 되는 것","몽골과의 오랜 전쟁 끝에 고려는 몽골과 강화를 맺었다."],["공녀","貢女","바칠 공|여자 녀(여)","다른 나라에 바치기 보낸 여성","몽골과의 강화 이후 몽골은 고려 영토를 일부 빼앗았고, 공녀를 요구하였다."],["상감기법","象嵌技法","코끼리 상|산골짜기 감|재주 기|법 법","도자기의 표면을 파서 무늬를 새기고, 그 자리에 다른 색의 흙을 채워 굽는 기법","고려 시대에는 청자에 무늬를 새기는 데 상감 기법을 사용하였다."],["과거제","科擧制","과목 과|들 거|절제할 제","시험을 통해 관리를 뽑던 제도","고려에서는 과거제를 실시하여 유교를 공부한 사람을 관리로 선발했다."],["연등회","燃燈會","불탈 연|등 등|모일 회","등을 켜고 부처에게 복을 비는 불교 행사","고려에서는 등을 밝히고 부처에게 복을 비는 연등회를 크게 열었다."],["팔관회","八關會","여덟 팔|관계할 관|모일 회","불교 행사와 여러 토속신에게 제사를 지내는 행사가 결합된 고려의 대표적 국가 행사","고려에서는 불교 행사와 여러 토속 신에게 제사를 지내는 팔관회를 열었다."],["대장경","大藏經","큰 대|감출 장|날 경","부처의 가르침을 기록한 불교 경전을 모아 놓은 것","고려 사람들은 나라에 어려운 일이 생길 때 부처의 힘으로 위기를 극복하기 위해 대장경을 만들었다."]],"2단원":[["회군","回軍","돌아올 회|군사 군","군사를 돌이켜 돌아가거나 돌아옴","위화도 회군은 요동 지역으로 향하던 이성계가 위화도에서 군대를 돌려 개경으로 돌아와 권력을 잡은 사건이다."],["조선","朝鮮","아침 조|고울 선","이성계가 고려를 무너뜨리고 1392년에 세운 나라로, 유교를 바탕으로 나라를 다스린 왕조","이성계는 위화도 회군으로 권력을 잡은 뒤 정도전 등과 힘을 모아 고려를 무너뜨리고 조선을 세웠다."],["유교","儒敎","선비 유|가르칠 교","공자의 가르침을 근본으로 나라에 충성하고 부모에게 효도하는 것을 중요하게 여기는 학문과 사상","조선은 유교를 나라를 다스리는 기본 정신으로 삼았다."],["활인서","活人","살 활|사람 인|관청 서","한양에서 사람들을 치료하는 일을 하던 관아","조선은 활인서를 두어 가난한 백성을 치료하고 돌보았다."],["의금부","義禁府","옳을 의|금할 금|관청 부","임금의 명령으로 주요 죄인들의 죄를 물어 밝히던 관아","조선의 의금부에서는 왕의 명령에 따라 중요한 죄인을 조사하고 처벌하였다."],["훈민정음","訓民正音","가르칠 훈|백성 민|바를 정|소리 음","백성을 가르치는 바른 소리라는 뜻으로, 1443년에 세종이 창제한 우리나라 글자","세종은 글자를 몰라 어려움을 겪는 백성을 위해 훈민정음을 창제하였다."],["서원","書院","글 서|집 원","학문을 연구하고 학생들에게 유교를 가르치던 곳","조선 시대 유학자들은 서원을 세워 학문을 연구하고 학생들을 가르쳤다."],["향약","鄕約","시골 향|맺을 약","마을 공동체 풍속에 유교의 가르침을 더해 만든 약속이나 규칙","조선 시대에는 향약을 만들어 백성들이 유교의 가르침을 지키도록 하였다."],["국역","國役","나라 국|부역 역","군역, 조세 등 나라가 양인에게 부과한 각종 의 부담","양반은 관리가 되어 나랏일에 참여하면서 국역을 면제받았다."],["관혼상제","冠婚喪祭","갓 관|혼인할 혼|잃을 상|제사 제","관례(성인식)·혼례(혼인식)·상 례(장례식)·제례(제사)의 네 가지 전통적인 예식","조선 시대에는 백성들이 유교 예절에 따른 관혼상제를 지키도록 하였다."],["붕당","朋黨","벗 붕|무리 당","학문적 또는 정치적으로 생각을 같이하는 사람들의 모임","조선의 지배층은 학문이나 정치에 대한 생각이 비슷한 사람들끼리 붕당을 이루었다."],["탕평","蕩平","쓸어 없앨 탕|평평할 평","어느 쪽에도 치우침이 없이 공평함","영조는 붕당 간의 대립을 줄이고 한 붕당이 권력을 독차지하는 것을 견제하고자 탕평책을 실시하였다."],["규장각","奎章閣","별 규|글 장|집 각","왕실 도서관으로 학자들이 학문과 정책을 연구하던 기관","정조는 규장각을 세워 학자들이 학문을 연구하고 나라의 중요한 문제를 생각하도록 하였다."],["세도정치","勢道政治","형세 세|길 도|정사 정|다스릴 치","왕실과 혼인 관계를 맺은 몇몇 가문이 권력을 잡고 마음대로 휘두르는 정치","조선 말기에는 일부 집안이 권력을 차지하는 세도 정치로 여러 문제가 나타났다."],["봉기","蜂起","벌 봉|일어날 기","지배를 받는 사람들이 지배 권력에 맞서 벌떼처럼 세차게 일어나는 것","세도 정치로 인해 생활이 어려워진 백성들은 곳곳에서 봉기를 일으키기도 하였다."],["암행어사","暗行御史","어두울 암|다닐 행|어 거느릴|역사 사","왕의 명령을 받아 비밀리에 지방에 파견되어 백성의 어려움을 조사해 왕에게 보고하는 관리","조선의 왕은 암행어사를 파견하여 지방 관리의 잘못과 백성의 어려움을 살피도록 하였다."],["서민","庶民","여러 서|백성 민","벼슬이 없거나 신분이 높지 않은 사람","조선 후기에는 한글 소설, 판소리, 탈놀이 등이 유행하면서 서민 문화가 발달하였다."],["풍속화","風俗畫","바람 풍|풍속 속|그림 화","사람들의 생활 모습을 생생하게 그린 그림","조선 시대의 풍속화를 보면 당시 사람들의 생활 모습을 살펴볼 수 있다."],["민화","民畫","백성 민|그림 화","옛날에 이름이 알려지지 않은 화가들이 서민들의 생활이나 소망을 담은 그림","민화는 동물, 나무, 꽃, 문자 등 다양한 소재로 그려졌으며 서민들의 소망이 담겨 있다."],["통상","通商","통할 통|헤아릴 상","나라들 사이에 서로 물건을 사고파는 것 또는 그러한 관계","조선 후기에는 서양 여러 나라의 배가 조선의 해양에 자주 나타나 통상을 요구하였다."],["척화비","斥和碑","물리칠 척|화할 화|비석 비","‘서양 세력이 침범했는데 싸우지 않는 것은 곧 나라를 파는 것’이라는 내용이 새겨진 비석","고종의 아버지인 흥선 대원군은 척화비를 세우고 통상 수교를 거부하였다."],["개항","開港","열 개|항구 항","항구를 열어 외국 배가 드나들 수 있도록 출입을 허가하는 것","조선은 일본과 강화도 조약을 맺고 개항하였다."],["조약","條約","가지 조|맺을 약","나라와 나라 사이에 문서를 작성하여 합의한 약속","강화도 조약은 외국과 맺은 최초의 근대적 조약이지만 조선에 불리한 내용을 일부 담고 있었다."],["동학","東學","동녘 동|배울 학","조선 후기에 최제우가 서학(천주교)에 대응하여 만든 종교로 사람을 곧 하늘이라고 가르쳤음","전봉준과 동학 지도자들은 관리의 부정부패와 수탈에 맞서 동학 농민 운동을 일으켰다."]],"3단원":[["늑약","勒約","굴레 륵(늑)|맺을 약","억지로 맺은 조약","일제는 1905년 고종의 동의 없이 을사늑약을 맺어 대한제국의 외교권을 빼앗았다."],["특사","特使","특별할 특|부릴 사","특별한 임무를 띠고 외국에 파견되는 사람","고종은 을사늑약의 부당함을 알리기 위해 네덜란드 헤이그에 특사를 파견하였다."],["의병","義兵","옳을 의|병사 병","나라가 위험에 처했을 때 스스로 일어나 저항한 군대","을사늑약 체결에 반대한 한국인들은 전국 곳곳에서 의병을 일으켰다."],["계몽","啓蒙","열 계|어두울 몽","모르는 것을 가르쳐서 깨우치게 함","안창호 등 민족 지도자들은 민족의 실력을 키워 나라를 지키려는 애국 계몽 운동을 펼쳤다."],["일제","日帝","날 일|임금 제","‘일본 제국’을 줄인 말로 군사력을 앞세워 다른 나라들을 침략했던 과거의 일본을 가리키는 말","일제는 1910년 대한 제국의 국권을 빼앗고 우리나라를 식민지로 지배하였다."],["헌병","憲兵","법 헌|병사 병","군대 안에서 경찰의 역할을 하는 군인","일제는 헌병에게 경찰의 임무를 맡겨 한국인의 일상생활을 감시하고 독립운동을 탄압하였다."],["3·1운동(삼일운동)","三一運動","석 삼|한 일|옮길 운|움직일 동","일제의 지배에 저항하고 우리나라의 독립을 요구하며 전국에서 벌인 만세 운동","1919년 3월 1일, 학생과 시민들은 독립 만세를 외치며 3·1 운동(삼일운동)에 참여했다."],["광복","光復","빛 광|회복할 복","빛을 되찾았다는 뜻으로, 다른 나라에 빼앗긴 주권을 다시 찾은 것","1945년 8월 15일 일본이 연합군에 항복하면서 우리나라는 광복을 맞이했다."],["제헌국회","制憲國會","절제할 제|법 헌|나라 국|모일 회","헌법을 처음으로 만들어 정한 국회","제헌 국회에서는 대한민국을 나라 이름으로 정하고, 헌법을 만들어 7월 17일에 널리 알렸다."],["피란","避亂","피할 피|어지러울 란","전쟁 등의 난리를 피해 옮겨 감","6·25 전쟁으로 많은 사람이 피란을 떠났다."],["정전협정","停戰協定","머무를 정|싸움 전|협 화합할|정할 정","전쟁 중인 나라들이 일시적으로 전쟁을 멈추기로 합의하고 맺은 협정","남한과 북한은 1953년 7월 27일 정전 협정을 체결했다."],["휴전선","休戰線","쉴 휴|싸움 전|줄 선","정전 협정 당시 남한과 북한이 각각 차지하고 있 회에서 인정되어 누릴 수 있는 힘이나 자격","대통령들은 권력을 유지하려고 국민의 자유와 권리를 억압했 다."],["헌법","憲法","법 헌|법 법","국가의 기본 원리와 국민의 권리 등을 정한 가장 기본적인 법","이승만 대통령과 박정희 대 통령은 헌법을 바꿔 자신의 임기를 연장했다."],["혁명","革命","가죽 혁|목숨 명","정치나 사회의 제도와 질서를 크게 바꾸는 것","결국 이승만은 대통령 자리 에서 물러났다. 이를 4·19 혁명이라고 한다."],["항쟁","抗爭","겨룰 항|다툴 쟁","부당한 권력이나 세력에 맞서 싸우는 것","학생들과 시민들은 대통령을 국민이 직접 뽑아야 한다고 주장하며 전국 곳곳에서 시위 를 벌였다. 이를 6월 민주 항 쟁이라고 한다."],["민주주의","民主主義","백성 민|주인 주|주인 주|옳을 의","국민이 나라의 주인으로서 정치에 참여하는 제도나 원리","이에 분노한 시민들은 국민 이 주인이 되는 진정한 민주 주의를 이루고자 민주화 운동 을 벌였다."],["직선제","直選制","곧을 직|가릴 선|절제할 제","국민이 대표자를 직접 투표하여 뽑는 제도","국민이 대통령을 직접 투표 로 뽑는 직선제가 다시 실시 되었다."],["자치","自治","스스로 자|다스릴 치","자기 지역의 일을 주민이 스스로 처리하고 다스리는 것","지방 자치제가 다시 시행되었다."],["산업화","産業化","낳을 산|업 업|될 화","산업이 발달하면서 생산과 생활 모습이 산업 중심으로 바뀌는 과정","1960년대에 정부는 경제 개 발 5개년 계획을 시행하며 본격적인 산업화를 추진했다."],["경제 개발","經濟開發","지날 경|건널 제|열 개|필 발","경제를 성장시키기 위해 산업과 생산을 발전시키는 것",""],["경공업","輕工業","가벼울 경|장인 공|업 업","비교적 가벼운 물건을 만드는 공업","기업은 주로 값싼 노동력을 활용해 신발, 가발, 섬유 같은 경공업 제품을 생산해 낮은 가격에 수출했다."],["중화학 공업","重化學工業","무거울 중|될 화|배울 학|장인 공|업 업","무거운 제품이나 석유 화학 제품 등을 생산하는 공업","1970년대에 정부는 중화학 공업을 일으키는 데 힘썼다."],["경제성장","經濟成長","지날 경|건널 제|이룰 성|길 장","나라의 생산과 소득이 늘어 경제의 규모가 커지는 것","이처럼 산업화로 인한 경제 성장으로 사람들의 생활이 더 욱 풍요로워졌다."],["노동자","勞動者","일할 노(로)|움직일 동|놈 자","임금을 받고 일하는 사람","1960년대에는 초등학교나 중학교를 졸업하지도 못한 채, 돈을 벌기 위해 일하는 10대 노동자들이 많았다."],["노동 운동","勞動運動","일할 노(로)|움직일 동|옮길 운|움직일 동","노동자가 노동 조건과 권리를 개선하기 위해 벌이는 활동","또한 더 나은 노동 조건을 만들기 위해 노동 운동에 나 선 사람들도 있었다."]],"2단원":[["선거","選擧","가릴 선|들 거","공동체를 위해 일할 대표를 뽑는 과정","따라서 사람들은 자신을 대 신하여 공동체를 위해 일할 대표를 선출하는데, 이 과정 을 선거라고 한다."],["선출","選出","가릴 선|날 출","여럿 가운데서 알맞은 사람을 골라 뽑는 것",""],["대표","代表","대신할 대|겉 표","다른 사람이나 공동체를 대신하여 일을 맡는 사람","선거의 가장 기본적인 역할 은 공동체의 대표자를 선출하 는 것이다."],["투표","投票","던질 투|표 표","표를 통해 자신의 의견이나 선택을 나타내는 것","투표는 표를 통해 자신의 의 견을 표현하는 거야."],["주권","主權","주인 주|권세 권","국가의 의사를 최종적으로 결정하는 권력","선거는 국민이 직접 주권을 행사하는 대표적인 방법으로, 민주주의에서 가장 기본적이고 중요한 정치 참여 활동이다."],["정치","政治","정사 정|다스릴 치","국가나 공동체의 일을 결정하고 운영하는 활동",""],["공약","公約","공평할 공|맺을 약","후보자가 어떤 일을 하겠다고 약속하는 것","선거로 선출된 고 예산안을 심의하여 확정한다."],["행정부","行政府","다닐 행|정사 정|마을 부","대통령을 국무총리와 행정 업무를 담당하는 여러 개의 부, 처, 청, 위원회 등으로 구성된 국가 행정 기관","행정부는 국회에서 만든 법에 따라 국가를 운영한다."],["국무회의","國務會議","나라 국|힘쓸 무|모일 회|의 의논할","행정부의 주요 정책을 논의하는 최고의 심의 기관","국무회의는 대통령과 국무총리, 각부의 장관 등으로 구성된다."],["법원","法院","법 법|집 원","사법권을 행사하는 국가 기관","우리나라에서 법을 적용하여 판단하는 일을 하는 기관은 법원이다."],["재판","裁判","마를 재|판단할 판","구체적인 분쟁 사건을 해결 하기 위해 법원이 일정한 절차를 거쳐 법적 판단을 내리는 일","법원은 재판을 통해 법에 따라 옳고 그름을 따져 분쟁을 해결 하고, 사회 질서를 유지하는 역 할을 한다."],["삼심제도","三審制度","석 삼|살필 심|제 절제할|법도 도","한 사건에 대해 세 번의 심판을 받을 수 있도록 기회를 주는 제도","국민은 3심 제도(삼심제도)를 통해 한 사건에 대해 3번까지 재판을 받을 수 있다."],["문제의식","問題意識","물을 문|제목 제|뜻 의|알 식","문제점을 찾아서 그에 적 극적으로 대처하려는 태도","미디어는 사람들에게 문제의식을 심어 준다."],["허위","虛僞","빌 허|거짓 위","진실이 아닌 것을 진실인 것처럼 꾸민 것","사실이 아닌 것을 진실인 것 처럼 꾸며낸 정보는 허위 정 보이다."],["의도","意圖","뜻 의|그림 도","무엇을 하고자 하는 생각 이나 계획, 또는 무엇을 하려고 꾀함","미디어를 통해 정보를 얻을 때는 정보 속에 숨겨져 있는 의도를 파악하기 위해 비판적 인 자세를 가져야 한다."]],"3단원":[["지구본","地球本","땅 지|공 구|근본 본","둥근 지구를 일정한 비율로 줄여서 실제 지구의 모습과 비슷하게 만든 입체 모형","지구본은 지구의 모습을 본떠 만든 모형이다."],["세계지도","世界地圖","인간 세|지경 계|땅 지|그림 도","둥근 지구를 평면으로 나타낸 지도","세계지도는 세계의 모습을 한눈에 살펴볼 수 있고, 가지 고 다니기 편리하다."],["위도","緯度","씨 위|법도 도","적도를 기준으로 얼마나 떨어져 있는지를 나타내는 수치","위도는 적도를 기준으로 얼마나 떨어져 있는지를 나타낸다."],["경도","經度","지날 경|법도 도","본초자오선으로부터 얼마나 떨어져 있는지를 나타내는 수치","경도는 본초자오선을 기준으로 얼마나 떨어져 있는지를 나타낸 다."],["시차","時差","때 시|다를 차","세계 각 지역에서 생기는 시간의 차이","여러 국가나 지역 사이에는 시차가 발생한다."],["대륙","大陸","큰 대|뭍 륙","지구의 표면에서 바다로 둘러싸인 큰 땅덩어리","대륙에는 아시아, 오세아니아, 유럽, 아프리카, 북아메리카, 남 아메리카, 남극 대륙이 있다."],["대양","大洋","큰 대|바다 양","지구의 표면을 이루는 넓은 바다","대양에는 태평양, 대서양, 인도양, 북극해, 남극해가 있다."],["반도","半島","반 반|섬 도","삼면은 바다로 둘러싸여 있으며, 한 면은 육지에 이어진 땅","우리나라는 아시아 대륙의 동쪽에 있는 반도 국가이다."],["영토","領土","옷길 령(영)|흙 토","한 나라의 땅, 국가의 통치권이 미치는 구역","세계 여러 국가는 영토의 면적, 모양 등의 특징이 다양하다."]],"보완단원(독도)":[["독도","獨島","홀로 독|섬 도","우리나라의 동쪽 끝에 있는 영토로, 두 개의 큰 섬인 동도와 서도 그리고 89개의 작은 바위섬으로 이루어짐","독도는 행정구역상 경상북도 울릉군 울릉읍에 속한다."],["화산","火山","불 화|뫼 산","땅속에 있는 가스, 마그마 따위가 분출하여 지각의 터진 틈을 통해 지표로 분 출하는 지점 또는 그 결과","독도는 화산 폭발로 만들어진 섬이다."],["영역","領域","옷깃 령(영)|지경 역","한 나라의 힘이 미치는 땅, 바다 기|기후 후","연 강수량이 매우 적고, 강수량보다 증발량이 많은 기후로 낮과 밤의 기온 차이가 큼","건조 기후 지역 사람들은 뜨거운 햇볕과 모래 바람을 막기 위해서 온몸을 감싸는 옷을 입는다."],["유목","遊牧","놀 유|칠 목","물과 풀이 있는 곳을 찾아 이동하며 가축을 기르는 일","사막 주변의 초원 지역에서는 주로 유목 생활을 하며 이동식 천막집인 게르에서 생활한다."],["온대기후","溫帶氣候","따뜻할 온|띠 대|기운 기|기후 후","사계절이 나타나며, 기온이 온화하고 비가 적당히 내리는 기후","온대 기후 지역은 우리나라처럼 여름에 덥고 비가 많이 내리는 곳도 있고, 서부 유럽처럼 연중 강수량이 고른 곳도 있다."],["지중해","地中海","땅 지|가운데 중|바다 해","유럽, 아시아, 아프리카 세 대륙에 둘러싸인 바다","지중해 주변 지역에서는 올리브, 레몬, 오렌지 등을 많이 재배한다."],["냉대기후","冷帶氣候","찰 냉|띠 대|기운 기|기후 후","사계절이 나타나며, 겨울은 춥고 길며 여름은 따뜻하고 짧은 기후","냉대 기후 지역은 겨울이 여름보다 길고 몹시 추워 농사짓기가 어렵다."],["침염수림","針樹林","바늘 침|잎 엽|나무 수|수풀 림","침엽수로 이루어진 수림","냉대 기후 지역에는 대규모 침엽수림이 널리 분포해 목재나 종이 등을 생산하는 공업이 발달했다."],["한대기후","寒帶氣候","찰 한|띠 대|기운 기|기후 후","주로 고위도 지역인 북극해 주변과 남극 주변에 나타나는 기후. 일 년 내내 기온이 낮아 땅이 얼어 있는 기후","한대 기후 지역에서는 동물의 가죽과 털로 만든 옷을 입고, 고기와 생선을 먹으며 순록을 기르는 유목 생활을 한다."],["고산기후","高山氣候","높을 고|메 산|기운 기|기후 후","해발 고도가 높은 산지에서 주변 지역보다 기온이 낮게 나타나는 기후","안데스 산맥의 일부 고산 기후 지역은 일 년 내내 온화한 기후가 나타나 일찍부터 고산 도시가 발달했다."]],"2단원":[["시장","市場","저자 시|마당 장","물건이나 서비스를 사고파는 거래가 이루어지는 곳","시장에서 가격은 사람들이 필요로 하는 상품의 양과 기업이 제공하는 상품의 양에 따라 정해진다."],["시장경제","市場經濟","저자 시|마당 장|날 경|건널 제","사람들이 물건과 서비스를 자유롭게 사고팔 수 있는 시장에서 만나 다양하게 경제활동을 하는 방식","시장경제에서는 사람들이 자유롭게 이익을 추구하며 경쟁이 발생한다."],["상품","商品","장사 상|물건 품","장사로 사고파는 물품","소비자는 적은 비용으로 큰 만족감을 줄 수 있는 상품을 선택한다."],["독과점","獨寡占","홀로 독|적을 과|점령할 점","어떤 상품의 생산이나 판매를 하나 또는 소수의 기업이 독차지하는 것","일부 기업이 시장을 독과점하면 자유로운 경쟁이 어려워진다."],["규제","規制","법 규|절제할 제","규정에 따라 일정한 한도를 정하거나 이를 넘지 못하게 막음","정부는 생산자들이 가격을 마음대로 올리지 못하도록 법과 제도로 규제한다."],["가계","家計","집 가|셀 계","가정 살림을 꾸려 가는 생활 공동체","가계의 구성원은 생산 활동에 참여하며 그 대가로 얻은 소득으로 경제활동을 한다."],["기업","企業","꾀할 기|업 업","시장에서 이윤을 얻기 위한 목적으로 전문적으로 생산 활동을 하는 조직","기업은 사람들이 필요로 하는 물건이나 서비스를 생산하고 판매한다."],["이윤","利潤","이로울 리(이)|불을 윤","물건이나 서비스를 판매하여 얻은 수입에서 그것을 생산하는 데 들어가는 비용을 뺀 순수한 이익","기업은 시장에서 더 많은 이윤을 얻기 위해 자유롭게 경쟁한다."],["근로자","勤勞者","부지런할 근|일할 로|사람 자","기업이나 다른 사람에게 노동을 제공하고 그 대가로 임금을 받는 사람으로 노동자라고도 부름","근로자는 자신의 노동력을 제공하고 그 대가로 소득을 얻어 생활하는 사람이다."],["적성","適性","맞을 적|성품 성","어떤 일을 잘할 수 있는 소질이나 성격","사람들은 자신의 능력과 적성에 따라 다양하게 경제활동을 한다."],["임금","賃金","품삯 임|쇠 금","근로자가 노동력을 제공하고 받는 대가","근로자는 정당한 임금을 받을 권리가 있다."],["투자","投資","던질 투|재물 자","이익을 얻기 위하여 어떤 일에 자신이 가지고 있는 돈이나 시간 등의 자원을 쓰는 것","기업은 더 좋은 상품을 만들기 위해 기술 개발에 투자한다."],["경제성장","經濟成長","날 경|건널 제|이룰 성|길 장","어떤 지역이나 나라에서 생산하는 물건과 서비스의 양이 지속적으로 증가하여 경제의 규모가 커지는 것","우리나라는 1960년대부터 경제 개발 5개년 계획을 세우는 등 경제 성장에 힘을 모았다."],["산업","産業","낳을 산|업 업","사람들의 생활을 경제적으로 풍요롭게 하기 위하여 물건이나 서비스를 생 산 하 는 농업·목축업·공업·운수업·서 비스업 등을 말함","경제가 성장하면서 전자 제품, 반도체, 의료 서비스 등 다양한 산업이 발달하였다."],["국내총생산","國內總生産","국 나라|안 내|총 합 할|날 생|산 낳을","일정 기간에 한 나라 안에서 생산된 물건 및 서비스의 양과 가치를 돈으로 계산하여 합한 것","우리나라의 국내 총생산은 경제 성장 과정에서 꾸준히 증가하였다."],["기대수명","期待壽命","기약할 기|기다릴 대|목숨 수|목숨 명","사람이 태어났을 때 앞으로 생존할 것으로 기대되는 평균 생존 연수","의료 기술이 발달하면서 사람들의 기대 수명이 늘어나고 있다."],["격차","隔差","사이 뜰 격|다를 차","빈부, 임금, 기술 수준 등이 서로 벌어져 다른 정도","사람들 사이의 소득 격차가 커지면 여러 사회문제가 나타난다."],["빈부격차","貧富隔差","가난할 빈|부유할 부|사 이 뜰 격|다를 차","한 사회에서 가난한 사람과 부유한 사람이 지닌 재산의 차이","경제성장 과정에서 사람들 사이의 소득 격차가 커지면 빈부 격차가 나타난다."],["근로환경","勤勞環境","부지런할 근|일할 로|고리 환|지경 경","근 로자가 일하는 주변 환경","근로자들은 열악한 근로 환경을 개선하기 위해 노력한다."],["처우","處遇","곳 처|만날 우","어떤 사람이나 단체에 대한 대우","근로자들은 열악한 처우를 개선하고자 노력하였다."],["노사갈등","使葛藤","일할 노|부릴 사|칡 갈|등 등나무","노동자와 사용자 사이에 임금이나 노동 조건 등에 대한 이해관계의 차이로 인해 발생하는 갈등","근로 조건에 대한 근로자와 기업의 의견이 달라 노사 갈등이 발생하기도 한다."],["양극화","兩極化","두 양|극진할 극|될 화","서로 다른 계층이나 집단이 점점 더 달라지고 차이가 벌어지는 것","사람들 사이의 소득 차이가 커지면서 사회의 양극화가 심해지기도 한다."],["재능기부","才能寄附","재주 재|능할 능|부칠 기|보탤 부","개인의 재주와 능력을 대가 없이 내놓는 일","사람들은 자신이 가진 능력을 활용해 재능 기부 활동에 참여한다."],["타협점","妥協點","온당할 타|화합할 협|점 점","어떤 일을 서로 양보하는 마음으로 협의할 수 있는 점","갈등이 발생했을 때 근로자와 기업은 충분한 대화를 통해 타협점을 찾아야 한다."],["타결","妥結","온당할 타|맺을 결","의견이 일치하지 않는 상황에서 서로 양보하여 끝을 맺음","근로자와 기업은 서로 양보하여 노사 갈등을 해결하고 협상을 타결하였다."],["최저임금","最低賃金","가장 최|낮을 저|품삯 임|쇠 금","근로자에게 그 아래로 지급해서는 안 된다고 정한 임금의 액수","정부는 근로자를 보호하기 위해 최저임금 제도를 시행한다."],["무역","貿易","무역할 무|바꿀 역","세계 여러 나라 간에 다양한 물건과 서비스를 사고파는 것","무역은 나라 간에 물건과 서비스를 사고파는 경제활동이 이루어지는 것이다."],["수출","輸出","보낼 수|날 출","다른 나라에 물자나 서비스를 파는 것","우리나라에서 만든 자동차나 반도체 등을 다른 나라로 수출한다."],["수입","輸入","보낼 수|들 입","다른 나라에서 물건과 서비스를 사 오는 것","우리나라는 다른 나라에서 원유, 가스 등을 수입하고 있다."],["자유무역협정(FTA)","自由貿","스스로 자|말미암을 유|무역할 무","나라 간에 무역을 자유롭게 하기 위해 무역과 관련된 세금 또는 법으로 정한 제한 등을 없애거나 줄이기로 한 약속","우리나라도 세계 여러 나라와 자유 무역 협정을 맺고 있다."]],"3단원":[["산업혁명","産業革命","낳을 산|업 업|가죽 혁|목숨 명","공장에서 기계의 힘을 이용하여 물건을 대량으로 만들어 내면서 사회, 경제 등에 나타난 큰 변화","세계 인구는 산업 혁명을 거치며 빠르게 증가했다."],["인구분포","人口分布","사람 인|입 구|나눌 분|펼 포","사람들이 어느 지역에 얼마나 모여 살고 있는지를 나타낸 것","자연환경과 인문환경은 인구 분포에 영향을 미친다."],["인구밀도","人口密度","사람 인|입 구|밀 빽빽할|법도 도","일정한 넓이(1km²) 안에 사는 사람의 수로, 인구의 밀집 정도를 나타냄","세계에서 인구 밀도가 높은 나라로는 방글라데시, 르완다, 네덜란드 등이 있다."],["인구구조","人口構造","사람 인|입 구|얽을 구|지을 조","일정한 지역 안의 인구를 나이, 성별 등 여러 가지 기준으로 나타낸 것","인구 구조는 유소년층, 청장년층, 노년층으로 나타낸다."],["고령화","高齡化","높을 고|나이 령|될 화","전체 인구 중에서 노인 인구 비율이 점차로 많아지는 것","출생률이 낮아지고 노인 인구가 늘어나면서 고령화가 빠르게 진행되고 있다."],["지구촌","地球村","땅 지|공 구|마을 촌","세계 여러 나라가 서로 긴밀하게 연결되어 하나의 마을처럼 살아가는 모습","기후변화나 난민 문제와 같은 지구촌 문제는 여러 나라가 함께 해결해야 한다."],["자원","資源","재물 자|근원 원","자연 중 우리 생활에 쓸모 있고 경제활동에 이용할 수 있는 것","지구촌에서는 자원과 에너지 부족 문제가 나타나고 있다."],["난민","難民","어려울 난|백성 민","전쟁이나 재난 등의 이유로 살림살이가 어려워져 자기 나라를 떠나 있는 사람","자원, 종교, 영토 등을 둘러싼 분쟁으로 난민이 되기도 한다."],["국제기구","國際機構","나라 국|이음새 제|틀 기|얽을 구","두 개 이상의 나라가 모여 지구촌 문제를 함께 해결하려고 만든 국제 조직","국제 기구는 국제 평화와 안전을 지키거나 어려움에 처한 사람들을 돕는 활동을 한다."],["비정부기구","非政府機構","아닐 비|정사 정|마을 부|틀 기|얽을 구","한 분야에 관심 있는 개인이 모여 만든 조직으로, 국경 없는 의사회와 그린피스 등이 있음","비정부 기구는 의료 지원이나 자연 보호 등 다양한 활동을 통해 지구촌 문제 해결을 위해 노력한다."],["정책","政策","정사 정|대쪽 책","공공의 문제를 해결하기 위한 방침이나 계획","정부는 지구촌 문제를 해결하기 위해 다양한 정책을 마련한다."],["식량난","食糧難","먹을 식|양식 량|어려울 난","식량이 모자라서 생기는 어려움","기후변화로 농작물 생산이 줄어들면 식량난이 발생할 수 있다."],["세계시민","世界市民","인간 세|지경 계|저자 시|백성 민","지구촌 문제가 우리의 문제임을 알고 이를 해결하기 위해 노력하는 사람","세계시민으로서 지구촌 문제에 관심을 갖고 일상생활에서 해결 방법을 실천해야 한다."]]},"아이스크림미디어":{"1단원":[["지형","地形","땅 지|모양 형","땅의 생김새","세계에는 산지, 평야, 해안, 사막 등 다양한 지형이 있다."],["경관","景觀","볕 경|볼 관","눈에 보이는 자연이나 지역의 전체적인 모습","지형 경관은 그곳에서 살아가는 사람들의 생활 모습에 영향을 준다."],["산지","山地","메 산|땅 지","높고 낮은 산들이 모여 있는 곳","산지 지형은 해발 고도가 높고 대체로 경사가 급하다."],["해발고도","海拔高度","바다 해|뽑을 발|높을 고|법도 도","바다 표면으로부터 잰 육지의 높이","에베레스트산은 해발 고도가 8,848m로 세계에서 가장 높은 산이다."],["하천지형","河川地形","물 하|내 천|땅 지|모양 형","땅 위를 흐르는 물에 의해 생기고 변화하는 지형","세계의 하천 지형에는 계곡, 평야, 폭포 등 다양한 경관이 나타난다."],["해안지형","海岸地形","바다 해|언덕 안|땅 지|모양 형","바다와 육지가 만나는 해안에 생기는 지형","갯벌, 모래사장, 절벽, 돌기둥 등은 세계 여러 지역에서 볼 수 있는 해안 지형이다."],["양식업","養殖業","기를 양|불릴 식|업 업","물고기나 조개 등을 인공적으로 기르는 일","해안 지역의 주민들은 주로 어업이나 양식업을 한다."],["기후","氣候","기운 기|기후 후","일정한 지역에서 여러 해에 걸쳐 나타난 기온, 비, 눈, 바람 따위의 평균 상태","세계의 기후는 위도, 위치와 지형, 해발 고도에 따라 다양하게 나타난다."],["열대기후","熱帶氣候","더울 열|띠 대|기운 기|기후 후","주로 적도 주변의 저위도 지역에서 나타나며, 일 년 내내 기온이 높은 열대 지방의 기후","적도 주변의 저위도 지역에는 일 년 내내 기온이 높은 열대 기후가 나타난다."],["건기","乾期","마를 건|기약할 기","일 년 중 비가 적게 내리는 시기","열대 기후 지역에서는 건기가 되면 비가 적게 내려 땅이 메마르기도 한다."],["우기","雨期","비 우|기약할 기","일 년 중 비가 많이 내리는 시기","우기에는 비가 많이 내려 식물이 무성하게 자란다."],["화전농업","火田農業","불 화|밭 전|농사 농|업 업","나무와 풀을 태우고 남은 재를 거름 삼아 농사짓는 방식","열대 기후 지역에서는 오래전부터 이동식 화전 농업으로 농작물을 재배해 왔다."],["건조기후","乾燥氣候","마를 건|마를 조|기운 기|기후 후","저위도 지역과 중위도 지역의 강수량이 매우 적어 건조한 기후","건조 기후는 낮과 밤의 기온 차이가 크게 나타난다."],["유목","遊牧","놀 유|칠 목","물과 풀이 있는 곳을 찾아 이동하며 가축을 기르는 일","사막 지역의 사람들은 주로 유목 생활을 하며 이동식 가옥에서 생활한다."],["온대기후","溫帶氣候","따뜻할 온|띠 대|기운 기|기후 후","중위도 지역에 주로 나타나며 비교적 계절 변화가 뚜렷하고 대체로 기온이 온난한 기후","온대 기후 지역은 우리나라처럼 여름에 덥고 비가 많이 내리는 곳도 있고, 서부 유럽처럼 연중 강수량이 고른 곳도 있다."],["낙농업","酪農業","타락 락(낙)|농사 농|업 업","젖소나 염소를 길러 우유, 치즈 등을 만드는 농업","서부 유럽에서는 온화한 기후를 바탕으로 낙농업이 발달했다."],["냉대기후","冷帶氣候","찰 냉|띠 대|기운 기|기후 후","북반구의 중위도와 고위도 지역에서 널리 나타나며 사계절이 구분되는 기후. 여름이 짧고 겨울이 긺","냉대 기후 지역에는 잎이 뾰족한 침엽수림이 넓게 발달하여 목재와 펄프 생산이 활발하다."],["한대기후","寒帶氣候","찰 한|띠 대|기운 기|기후 후","남극과 북극 주변의 고위도 지역에서 주로 나타나며, 겨울이 길고 기온이 낮아 일 년 내내 눈과 얼음으로 덮여 있는 기후","한대 기후 지역 사람들은 사냥하여 얻은 생선과 고기를 주로 먹거나, 순록을 기르며 유목 생활을 하기도 한다."],["고산기후","高山氣候","높을 고|메 산|기운 기|기후 후","해발 고도가 높아 주변 지역에 비해 낮은 기온이 나타나는 기후","적도 주변의 해발 고도가 높은 일부 고산 기후 지역은 일 년 내내 서늘한 날씨가 이어진다."]],"2단원":[["시장","市場","저자 시|마당 장","물건이나 서비스의 거래가 이루어지는 곳","시장에서 가격은 사람들이 필요로 하는 상품의 양과 기업이 제공하는 상품의 양에 따라 정해진다."],["가계","家計","집 가|셀 계","시장에서 경제활동을 함께하며 살림을 꾸려 가는 생활 공동체","가계는 생산 활동에 참여해 얻은 소득으로 필요한 물건을 사거나 서비스를 이용한다."],["이윤","利潤","이로울 리(이)|불을 윤","물건이나 서비스를 판매하여 얻은 수입에서 그것을 생산하는 데 들어가는 비용을 뺀 금액","기업은 시장에서 더 많은 이윤을 얻기 위해 자유롭게 경쟁한다."],["기업","企業","꾀할 기|업 업","시장에서 이윤을 목적으로 물건이나 서비스를 생산하거나 판매하는 조직","기업은 사람들이 필요로 하는 물건이나 서비스를 생산하여 판매한다."],["시장경제","市場經濟","저자 시|마당 장|날 경|건널 제","시장에서 가계와 기업이 자유롭게 경쟁하며 경제활동을 하는 방식","우리나라의 시장경제에서는 가계와 기업이 시장에서 자유롭게 경쟁하며 경제활동을 한다."],["근로자","勤勞者","부지런할 근|일할 로|사람 자","기업이나 다른 사람에게 노동을 제공하고 그 대가로 임금을 받는 사람","근로자는 기업에 노동력을 제공하고 그 대가로 임금을 받는다."],["유급휴가","有給休暇","있을 유|줄 급|쉴 휴|틈 가","휴가 기간에도 급여가 지급되는 휴가","근로자는 임금을 받으면서 쉴 수 있는 유급 휴가를 사용할 수 있다."],["경제성장","經濟成長","날 경|건널 제|이룰 성|길 장","국가의 전체적인 생산 수준이나 국민 소득이 증가하여 경제 규모가 커지는 것","우리나라는 가계와 정부, 기업이 함께 노력하며 빠른 경제성장을 이루었다."],["빈부격차","貧富隔差","가난할 빈|부유할 부|사 이 뜰 격|다를 차","경제적으로 부유한 사람과 가난한 사람의 소득 차이가 커지는 것","경제성장으로 사람들의 소득에 차이가 생기면서 빈부격차 문제가 나타나기도 한다."],["빈곤","貧困","가난할 빈|곤할 곤","수입이나 재산이 적어서 살림살이가 넉넉하지 못하고 어려운 상태","우리나라는 경제 협력 개발기구(OECD) 국가 중 상대적 빈곤율이 높은 편이다."],["자원","資源","재물 자|근원 원","사람이 생활하거나 물건을 만드는 데 이용할 수 있는 여러 가지 재료나 에너지원","경제 성장 과정에서 자원을 함부로 사용하면 부족해질 수 있다."],["무역","貿易","무역할 무|바꿀 역","나라와 나라 사이에서도 물자나 서비스를 사고팔거나 교환하는 일","한 나라 안에서 구하기 어려운 물자나 서비스를 이용하기 위해 무역을 한다."],["물자","物資","물건 물|재물 자","어떤 활동에 필요한 물건이나 물건을 만드는 데 필요한 원료","사람들은 필요와 이익에 따라 다른 사람들과 물자나 서비스를 주고받는다."],["수입","輸入","보낼 수|들 입","사람이 생활하거나 물건을 만드는 데 이용할 수 있는 여러 가지 재료나 에너지원","우리나라는 외국에서 옷이나 과자 등을 수입한다."],["수출","輸出","보낼 수|날 출","다른 나라에 물자나 서비스를 파는 것","우리나라에서 만든 자동차, 떡볶이 제품, 반도체 등을 다른 나라에 수출한다."],["원유","原油","근원 원|기름 유","불순물을 없애지 않은 자연 상태의 석유","우리나라는 천연자원이 부족하여 원유, 천연가스, 철광석 등을 수입하고 있다."],["항로","航路","배 항|길 로","선박이 지나다니는 바다 위의 길","싱가포르는 유럽과 아시아를 잇는 항로에 자리 잡고 있다."],["항만","港灣","항구 항|물굽이 만","선박이 안전하게 머물 수 있고, 화물이나 사람이 배로부터 육지에 오르내리기에 편리한 곳","세계 여러 나라는 무역을 편리하게 하기 위해 자동화 항만 시스템을 도입하고 있다."],["관세","關稅","관계할 관|세금 세","다른 나라에서 수입하는 상품에 부과하는 세금","정부는 국내 산업을 보호하기 위해 수입 상품에 관세를 부과하기도 한다."]],"3단원":[["인구분포","人口分布","사람 인|입 구|나눌 분|펼 포","사람들이 어느 지역에 얼마나 모여 살고 있는지를 나타낸 것","세계의 인구 분포를 보면 전체 인구의 약 90%가 북반구에 살고 있다."],["인구성장률","人口成長率","사 람 인|입 구|이 룰 성|길 장|비율 률","일정한 지역 안에 사는 인구가 증가하는 비율","아프리카는 인구 성장률이 높지만, 유럽은 낮거나 인구가 감소하고 있다."],["인구밀도","人口密度","사람 인|입 구|밀 빽빽할|법도 도","일정한 지역의 넓이에 대한 인구수의 비율","세계 여러 나라는 면적과 인구수에 따라 인구 밀도가 다르게 나타난다."],["인구구조","人口構造","사람 인|입 구|얽을 구|지을 조","연령, 성별 등을 기준으로 한 인구의 짜임새","세계의 인구 구조는 유소년층의 비율이 줄고 노년층의 비율이 늘어나는 방향으로 변화하고 있다."],["지구촌","地球村","땅 지|공 구|마을 촌","세계 여러 나라가 서로 긴밀하게 연결되어 하나의 마을처럼 살아가는 모습을 나타내는 말","지구촌의 한 지역에서 발생한 문제는 다른 지역에도 영향을 미칠 수 있다."],["고갈","枯渴","마를 고|목마를 갈","돈이나 물자 등이 다하여 없어짐","산업이 발달하면서 지구의 자원과 에너지가 고갈되고 있다."],["국제기구","國際機構","나라 국|이음새 제|틀 기|얽을 구","여러 나라가 공동의 문제를 해결하고 협력하기 위해 만든 조직","국제 기구는 국제 평화와 안전을 지키거나 어려움에 처한 사람들을 돕는 활동을 한다."],["비정부기구","非政府機構","아닐 비|정사 정|마을 부|틀 기|얽을 구","개인이나 민간단체가 중심이 되어 공공의 이익을 지키려고 만든 기구","비정부 기구는 의료 지원이나 자연 보호 등 다양한 활동을 통해 지구촌 문제 해결을 위해 노력한다."],["세계시민","世界市民","인간 세|지경 계|저자 시|백성 민","지구촌의 지속가능한 미래를 위해 협력하며 책임 있게 행동하는 사람","우리는 세계시민으로서 지구촌 문제 해결을 위해 함께 노력해야 한다."]]},"천재교과서(김정인)":{"1단원":[["지형","地形","땅 지|모양 형","땅의 생김새","세계 각 지역에는 산지, 평야, 고원 등 다양한 지형이 나타난다."],["분포","分布","나눌 분|베 포","일정한 범위에 흩어져 퍼져 있음","세계의 지형 분포를 살펴보면 지역에 따라 나타나는 지형이 다르다는 것을 알 수 있다."],["산지","山地","메 산|땅 지","높고 낮은 산들이 모여 있는 곳","세계의 산지는 산맥을 이루기도 하고, 넓고 평평한 땅이 펼쳐지는 등 다양한 모습을 보인다."],["만년설","萬年雪","일만 만|해 년|눈 설","녹지 않고 쌓여있는 눈","아프리카 대륙의 킬리만자로산은 정상 부근이 만년설로 덮여 있다."],["해발고도","海拔高度","바다 해|뽑을 발|높을 고|법도 도","평균 해수면을 기준으로 하여 잰 어떤 지점의 높이","티베트고원은 평균 해발 고도가 약 4,500m 이상인 평평한 지대이다."],["경사","傾斜","기울 경|비낄 사","비스듬히 기울어진 상태","산지는 경사가 가팔라 농사를 짓기에 불리하다."],["하천지형","河川地形","물 하|내 천|땅 지|모양 형","땅 위를 흐르는 물에 의해 생기고 변화하는 지형","강의 상류에서 하류까지 폭포, 평야 등 다양한 하천 지형이 나타난다."],["비옥","肥沃","살찔 비|기름질 옥","땅이 기름짐","하천 주변에는 물이 풍부하고 비옥한 땅이 있어 농업이 발달하기에 유리하다."],["해안","海岸","바다 해|언덕 안","바다와 육지가 만나는 곳","세계의 해안에는 가파른 절벽이나 넓게 펼쳐진 모래밭 등 다양한 지형이 나타난다."],["암벽","巖壁","바위 암|벽 벽","깎아지른 듯 높이 솟은 벽 모양의 바위","노르웨이의 송네 피오르에는 빙하가 깎아 만든 가파른 암벽이 나타난다."],["빙하","氷河","얼음 빙|물 하","눈이 오랫동안 쌓여 만들어진, 육지를 덮고 있는 얼음덩어리","송네 피오르는 빙하가 땅을 깎아 만든 U자형 골짜기에 바닷물이 들어와 형성되었다."],["만","灣","물굽이 만","바다가 육지 쪽으로 들어와 있는 곳","만은 바다가 육지 쪽으로 들어와 있는 곳으로, 해안에서 볼 수 있는 지형 중 하나이다."],["기후","氣候","기운 기|기후 후","일정한 지역에서 여러 해에 걸쳐 나타난 기온, 비, 눈, 바람 따위의 평균 상태","세계의 기후는 기온과 강수량, 해발 고도 등에 따라 다양하게 나타난다."],["열대기후","熱帶氣候","더울 열|띠 대|기운 기|기후 후","주로 적도 주변의 저위도 지역에서 나타나며, 일 년 내내 기온이 높은 열대 지방의 기후","열대 기후에는 열대 우림 기후와 열대 사바나 기후가 있다."],["화전농업","火田農業","불 화|밭 전|농사 농|업 업","숲을 태운 후 남은 재를 거름 삼아 농작물을 기르는 농업 방식","열대 우림 기후 지역 주민들은 오래전부터 이동식 화전 농업으로 농작물을 재배해 왔다."],["서식","棲息","깃들일 서|쉴 식","생물이 일정한 곳에 자리를 잡고 삶","열대 사바나 기후 지역에서는 다양한 동물들이 서식하는 생태환경을 활용한 관광 산업이 발달했다."],["건조기후","乾燥氣候","마를 건|마를 조|기운 기|기후 후","강수량이 매우 적어 건조한 기후로, 낮과 밤의 기온 차이가 큼","건조 기후는 주로 위도 20~30℃ 일대와 바다에서 멀리 떨어진 지역에서 나타난다."],["유목","遊牧","놀 유|칠 목","사는 곳을 정하지 않고 물과 풀밭을 찾아 옮겨 다니면서 가축을 기르는 생활 양식","건조 기후 지역의 주민들은 주로 유목 생활을 하거나, 오아시스 주변에서 작물을 재배한다."],["관개농업","灌漑農業","물 댈 관|물 댈 개|농사 농|업 업","인공적인 방법으로 물을 끌어와 작물을 재배하는 농업","사막 지역에는 물을 끌어와 농사를 짓는 관개 농업이 발달하였다."],["온대기후","溫帶氣候","따뜻할 온|띠 대|기운 기|기후 후","중위도 지역에 주로 나타나며 비교적 사계절이 뚜렷하고 온화한 기온이 나타나는 기후","온대 기후 지역은 계절별 기온과 강수량의 특징에 따라 지중해성 기후, 서안 해양성 기후로 구분한다."],["냉대기후","冷帶氣候","찰 냉|띠 대|기운 기|기후 후","북반구의 온대와 한대 사이에 발달하는 사계절이 구분되는 기후. 여름이 짧고 겨울이 긺","냉대 기후 지역에는 추운 겨울의 영향으로 잎이 뾰족한 침엽수 숲이 넓게 발달했다."],["한대기후","寒帶氣候","찰 한|띠 대|기운 기|기후 후","주로 극지방에서 나타나며, 일 년 내내 기온이 매우 낮아 눈과 얼음으로 덮여 있는 기후","가장 따뜻한 달의 평균 기온이 10℃ 미만인 지역을 한대 기후라고 한다."],["고산기후","高山氣候","높을 고|메 산|기운 기|기후 후","해발고도가 높아 주변 지역에 비해 낮은 기온이 나타나는 기후","적도 주변의 해발 고도가 높은 일부 고산 기후 지역은 일 년 내내 날씨가 온화해 도시가 발달했다."],["경제체제","經濟體制","날 경|건널 제|몸 체|제 절제할","나라에서 기본적인 경제 문제를 해결해 나가는 방식 또는 제도","시장이 경제활동의 중심이 되는 경제 체제를 시장경제라고 한다."]],"2단원":[["시장경제","市場經濟","저자 시|마당 장|날 경|건널 제","시장이 경제활동의 중심이 되는 경제 체제","시장경제에서는 개인과 기업이 경제활동의 자유를 누리며 더 많은 이익을 얻기 위해 경쟁한다."],["이윤","利潤","이로울 리(이)|불을 윤","물건이나 서비스를 판매해 얻은 수입에서 그것을 생산하는 데 들어가는 비용을 뺀 순수한 이익","기업은 더 많은 이윤을 얻기 위해 다른 기업과 경쟁을 한다."],["가계","家計","집 가|셀 계","가정생활을 함께하며 생산 활동에 참여해 얻은 소득으로 물건을 사거나 서비스를 이용하는 경제 주체","가계는 생산 활동에 참여해 얻은 소득으로 필요한 물건을 사거나 서비스를 이용한다."],["기업","企業","꾀할 기|업 업","이윤을 얻기 위해 생활에 필요한 물건이나 서비스를 생산하여 판매하는 경제 주체","기업은 물건과 서비스를 생산하여 판매하고 사람들에게 일자리를 제공한다."],["임금","賃","품삯 임|쇠 금","기업의 생산에 필요한 노동을 제공하고, 그 대가로 받는 돈","사람들은 기업에서 일하고 그 대가로 임금을 받는다."],["주식","株式","그루 주|법 식","회사 일부를 소유할 수 있는 권리","사람들은 기업의 일부를 소유할 수 있는 주식을 사고팔기도 한다."],["근로조건","勤勞條件","부지런할 근|일할 로|가지 조|물건 건","근로자가 고용되어 일하는 데 따르는 여러 가지 조건. 임금, 근로 시간, 휴가 등이 포함됨","법에서는 임금, 근로 시간, 휴게 등 근로자가 보호받아야 할 근로 조건을 정하고 있다."],["교섭","交涉","사귈 교|건널 섭","어떤 일을 이루기 위해 서로 의논하고 절충함","노동조합은 근로 조건을 개선하기 위해 기업과 교섭할 수 있다."],["노동조합","勞動組合","일할 노|움직일 동|짤 조|합할 합","근로 조건의 개선과 근로자의 지위 향상 등을 목적으로 근로자들이 조직한 단체","노동조합은 기업과 근로 조건을 의논할 수 있다."],["파업","罷業","마칠 파|업 업","근로자들이 목적을 달성하기 위해 집단적으로 한꺼번에 작업을 중지하는 일","노동조합과 기업 간에 의견이 일치하지 않으면 노동조합은 파업을 하기도 한다."],["최저임금","最低賃金","가장 최|낮을 저|품삯 임|쇠 금","근로자에게 그 아래로 지급해서는 안 된다고 정한 임금의 액수","근로자는 법으로 정한 최저임금을 보장받는다."],["윤리","倫理","인륜 륜(윤)|다스릴 리","사람으로서 마땅히 행하거나 지켜야 할 도리","기업은 법과 윤리를 지키며 경제활동을 해야 한다."],["경제성장","經濟成長","날 경|건널 제|이룰 성|길 장","한 나라의 생산 능력이 확대되어 상품 생산량이 증가하고 경제 규모가 커지는 현상","우리나라는 짧은 시간 동안 빠르게 경제성장을 이루었다."],["국내총생산","國內總生産","국 나라|안 내|총 합 할|날 생|산 낳을","일정 기간에 한 나라 안에서 생산된 물건과 서비스의 양을 돈으로 계산해 합한 것","국내 총생산이 증가하는 것은 한 나라의 경제가 성장했다는 의미이다."],["기대수명","期待壽命","기약할 기|기다릴 대|목숨 수|목숨 명","사람이 태어났을 때 앞으로 살 것으로 예상되는 평균 기간","우리나라의 경제가 성장하며 의료 서비스의 수준이 높아져 사람들의 기대수명이 늘어났다."],["공교육","公敎育","공평할 공|가르칠 교|기를 육","국가가 시행하는 교육","경제성장으로 공교육 지출이 확대되면서 학생들은 이전보다 높은 수준의 교육을 받을 수 있게 되었다."],["노사갈등","使葛藤","일할 노|부릴 사|칡 갈|등 등나무","근로자와 기업 사이에 근로조건에 대한 의견 차이로 발생하는 갈등","경제성장 과정에서 근로자와 경영자 사이에 노사갈등이 발생하기도 하였다."],["근무","勤務","부지런할 근|힘쓸 무","직장에서 맡은 일을 하는 것","경제성장 과정에서 근로자들은 열악한 환경에서 오랜 시간 근무하기도 했다."],["빈부격차","貧富隔差","가난할 빈|부유할 부|사 이 뜰 격|다를 차","한 사회에서 가난한 사람과 부유한 사람이 지닌 재산의 차이","경제성장으로 생활 수준이 높아졌지만, 사람 사이의 빈부격차가 커지기도 하였다."],["중재","仲裁","버금 중|마를 재","분쟁에 끼어들어 당사자들을 화해시킴","정부는 근로자와 경영자가 문제를 원만히 해결할 수 있도록 노사갈등을 중재한다."],["무역","貿易","무역할 무|바꿀 역","나라와 나라 사이에 물건이나 서비스를 사고파는 것","각 나라는 무역을 통해 다른 나라와 경제적 관계를 맺는다."],["수출","輸出","보낼 수|날 출","다른 나라에 물건이나 서비스를 파는 것","우리나라 기업이 만든 반도체를 다른 나라에 수출했다."],["수입","輸入","보낼 수|들 입","다른 나라에서 물건이나 서비스를 사 오는 것","우리나라는 바나나, 오렌지 등 다양한 외국 과일을 수입했다."],["세계화","世界化","인간 세|지경 계|될 화","오늘날 교통과 정보 통신 기술의 발달로 전 세계가 마치 하나의 공동체가 된 것처럼 긴밀하게 연결되는 현상","세계화가 진행되면서 세계 여러 나라 사이의 무역과 경제적 교류가 활발해졌다."],["자유무역협정(FTA)","自由貿","스스로 자|말미암을 유|무역할 무","나라와 나라 사이에 상품의 자유로운 이동을 가로막는 세금, 제도 등을 줄이거나 없애기로 한 약속","여러 나라는 상품을 자유롭게 사고팔기 위해 자유 무역 협정을 체결하고 있다."]],"3단원":[["산업혁명","產業革命","낳을 산|업 업|가죽 혁|목숨 명","약 1760년대부터 영국에서 시작된 생산 기술과 그에 따른 사회 조직의 변화","세계의 인구는 산업혁명 이후 빠르게 증가하였다."],["인구분포","人口分布","사람 인|입 구|나눌 분|펼 포","사람들이 어느 지역에 얼마나 모여 살고 있는지를 나타낸 것","세계의 인구 분포를 보면 전체 인구의 약 90%가 북반구에 살고 있다."],["제약","制約","절제할 제|맺을 약","제한되는 조건","과학 기술의 발달로 사람들은 자연환경의 제약을 극복하며 생활할 수 있게 되었다."],["인구밀도","人口密度","사람 인|입 구|밀 빽빽할|법도 도","일정한 지역의 넓이에 대한 인구수의 비율","세계 여러 나라의 인구 밀도는 인구와 국토 면적에 따라 다양하게 나타난다."],["인구구조","人口構造","사람 인|입 구|얽을 구|지을 조","일정한 지역의 인구를 성, 연령 등의 기준으로 나누어 나타낸 것","한 나라의 인구 구조를 분석하면 인구의 변화와 앞으로 나타날 인구 문제를 예측할 수 있다."],["지구촌","地球村","땅 지|공 구|마을 촌","세계 여러 나라가 서로 긴밀하게 연결되어 하나의 마을처럼 살아가는 모습을 나타내는 말","우리의 일상생활 속 작은 행동도 지구촌의 사람과 환경에 영향을 줄 수 있다."],["자원","資源","재물 자|근원 원","사람이 생활하거나 물건을 만드는 데 이용할 수 있는 여러 가지 재료나 에너지원","자원의 소비가 늘어나면서 물과 식량이 부족해지는 문제가 나타나고 있다."],["기후변화","氣候變化","기운 기|기후 후|변할 변|될 화","전 세계적으로 기온, 대기 상태, 기상 현상 등이 오랜 기간에 걸쳐 변화하는 현상","기후변화로 지구촌 곳곳에서 폭염, 홍수, 폭설, 해수면 상승 등의 문제가 나타나고 있다."],["난민","難民","어려울 난|백성 민","민족, 종교, 정치 등 여러 가지 이유로 자신이 살던 나라를 떠나 다른 나라에서 생활하는 사람","난민들은 다른 나라로 이동하는 과정에서 안전을 보장받지 못하기도 한다."],["국제연합","國際聯合","나라 국|이음새 제|연 연이을|합할 합","지구촌의 평화 유지와 전쟁 방지 등을 목적으로 설립된 국제기구","국제연합은 지구촌의 평화와 발전을 위해 여러 나라가 서로 협력하도록 돕는다."],["비정부기구","非政府機構","아닐 비|정사 정|마을 부|틀 기|얽을 구","뜻을 같이하는 개인들이 모여 지구촌의 여러 문제를 해결하고자 활동하는 단체","비정부 기구는 환경, 빈곤, 보건 등 다양한 분야에서 지구촌의 문제를 해결하기 위해 활동한다."],["구호","救護","구원할 구|도울 호","재난이나 재해를 당한 사람을 도와서 보호함","국경없는의사회는 분쟁이나 자연재해로 어려움을 겪는 사람들을 돕기 위해 의료 구호 활동을 펼친다."],["종식","終熄","끝 종|불 꺼질 식","일이 끝나거나 없어짐","국제연합은 빈곤을 종식하기 위해 노력하고 있다."],["세계시민","世界市民","인간 세|지경 계|저자 시|백성 민","지구촌의 문제가 곧 우리의 문제임을 알고, 이를 함께 해결하기 위해 협력하고 노력하는 사람","지속가능한 미래를 만들기 위해서 우리는 세계시민의 자세를 지녀야 한다."]]},"천재교과서(박기범)":{"1단원":[["지형","地形","땅 지|모양 형","땅의 생김새","세계 각 지역에는 산지, 평야, 고원 등 다양한 지형이 나타난다."],["분포","分布","나눌 분|베 포","일정한 범위에 흩어져 퍼져 있음","세계의 유명한 지형의 위치를 살펴보면 세계 지형의 분포 특징을 파악할 수 있다."],["산지","山地","메 산|땅 지","주변보다 해발 고도가 높은 지역","산지는 주변보다 해발 고도가 높은 지역이다."],["해발고도","海拔高度","바다 해|뽑을 발|높을 고|법도 도","평균적인 바닷물의 표면을 기준으로 측정한 어떤 곳의 높이","티베트고원은 평균 해발 고도가 약 4,500m 이상인 평평한 지대이다."],["협곡","峽谷","골짜기 협|골 곡","험하고 좁은 골짜기","미국의 그랜드 캐니언은 약 1,500m의 깊이로 파인 거대한 협곡이다."],["경관","景觀","볕 경|볼 관","산이나 들, 강, 바다 등의 자연이나 지역의 풍경","유럽의 알프스 산맥은 경관이 아름답기로 유명하다."],["고산지대","高山地帶","높을 고|메 산|땅 지|띠 대","높은 산의 일정한 구역","적도 부근의 고산 지대는 일 년 내내 봄처럼 따뜻한 날씨가 나타나기도 한다."],["광업","鑛業","쇳돌 광|업 업","광물에서 자원을 캐내어 활용할 수 있도록 만드는 산업","지하자원이 풍부한 산지에서는 광업이 발달하기도 한다."],["하천","河川","물 하|내 천","땅 위의 일정한 길을 따라 흐르는 물줄기","큰 하천은 대부분 거대한 산지에서 시작해 넓은 평야를 가로질러 바다로 흘러간다."],["비옥","肥沃","살찔 비|기름질 옥","식물이 잘 자라는 성분이 많아 기름짐","갠지스강 주변에는 도시와 비옥한 평원이 있다."],["곡창지대","穀倉地帶","곡식 곡|곳집 창|땅 지|띠 대","쌀과 같은 곡식이 많이 생산되는 곳","중국의 황허강 주변의 넓은 평야는 농사가 발달한 곡창 지대이다."],["유역","流域","흐를 류(유)|지경 역","하천의 물이 모여 흘러드는 범위","아마존강 유역에는 세계 최대 규모의 밀림이 펼쳐져 있다."],["해안","海岸","바다 해|언덕 안","바다와 육지가 만나는 곳","해안에는 모래 해안과 암석 해안 등이 있다."],["만","灣","물굽이 만","바다가 육지 쪽으로 들어와 있는 곳","피오르는 빙하가 깎아 만든 골짜기에 바닷물이 들어와 형성된 좁고 깊은 만이다."],["내륙지역","內陸地域","안 내|뭍 륙|땅 지|지경 역","바다에서 멀리 떨어져 있는 지역","해안 지역은 내륙 지역보다 기후가 온화한 편이다"],["기후","氣候","기운 기|기후 후","일정한 지역에서 여러 해에 걸쳐 나타난 대기의 평균적인 상태","세계의 기후는 기온과 강수량, 해발 고도 등에 따라 다양하게 나타난다."],["열대기후","熱帶氣候","더울 열|띠 대|기운 기|기후 후","적도 부근에 주로 나타나며, 일 년 내내 기온이 높고 강수량이 많은 기후","열대 기후 지역에는 열기와 습기, 해충을 막기 위해 땅 위에 띄워 짓는 고상 가옥이 나타나기도 한다."],["화전농업","火田農業","불 화|밭 전|농사 농|업 업","숲을 태워 그 재를 영양분 삼아 농작물을 기르는 농업 방식","열대 기후 지역에서는 전통적으로 화전 농업을 통해 카사바, 얌 등을 재배한다."],["건조기후","乾燥氣候","마를 건|마를 조|기운 기|기후 후","위도 20°~30°일대와 대륙 내부에 분포하며 연 강수량이 500mm 미만으로 매우 적어 건조한 기후","건조 기후 지역의 초원에서는 가축과 함께 풀과 물을 찾아 이동하는 유목 생활을 한다."],["온대기후","溫帶氣候","따뜻할 온|띠 대|기운 기|기후 후","중위도 지역에 주로 나타나며 비교적 사계절이 뚜렷하고 온화한 기온이 나타나는 기후","온대 기후 지역은 계절별 기온과 강수량의 특징에 따라 지중해성 기후, 서안 해양성 기후로 구분한다."],["냉대기후","冷帶氣候","찰 냉|띠 대|기운 기|기후 후","북반구의 온대와 한대 사이에 발달하는 사계절이 나타나지만, 겨울이 길고 추운 기후","냉대 기후 지역에는 추운 겨울의 영향으로 잎이 뾰족한 침엽수 숲이 넓게 발달했다."],["한대기후","寒帶氣候","찰 한|띠 대|기운 기|기후 후","주로 극지방에서 분포하며, 일 년 내내 기온이 매우 낮아 눈과 얼음으로 덮여 있는 기후","한대 기후 지역 사람들은 사냥하여 얻은 생선과 고기를 주로 먹거나, 순록을 기르며 유목 생활을 하기도 한다."],["고산기후","高山氣候","높을 고|메 산|기운 기|기후 후","해발 고도가 높아 주변 지역에 비해 낮은 기온이 나타나는 기후","적도 주변의 해발 고도가 높은 일부 고산 기후 지역은 일 년 내내 온화한 날씨가 나타난다."]],"2단원":[["시장경제","市場經濟","저자 시|마당 장|날 경|건널 제","시장을 중심으로 개인과 기업이 물건의 생산과 분배 등을 자율적으로 결정하는 경제활동 방식","시장경제에서 사람들은 자유롭게 직업을 선택하고 일을 해서 얻은 소득을 소비하거나 저축할 수 있다."],["이윤","利潤","이로울 리(이)|불을 윤","물건이나 서비스를 판매해 얻은 수입에서 생산에 들어간 비용을 뺀 금액으로, 기업이 얻는 순수한 이익","기업은 더 많은 이윤을 얻기 위해 다른 기업과 경쟁을 한다."],["경제체제","經濟體制","날 경|건널 제|몸 체|제 절제할","가계, 기업, 정부 등 경제활동에 참여하는 개인 또는 집단","시장이 경제활동의 중심이 되는 경제 체제를 시장경제라고 한다."],["가계","家計","집 가|셀 계","소득을 바탕으로 소비 활동을 하는 가장 기본적인 경제 주체","가계는 생산 활동에 참여해 얻은 소득으로 필요한 물건을 사거나 서비스를 이용한다."],["기업","企業","꾀할 기|업 업","이윤을 얻기 위해 생활에 필요한 물건이나 서비스를 생산하여 판매하는 경제 주체","기업은 물건과 서비스를 생산하여 판매하고 사람들에게 일자리를 제공한다."],["고용","雇用","품 팔 고|쓸 용","대가를 주고 사람에게 일을 시키는 것","기업은 일자리를 만들고 사람들을 고용한다."],["생계","生計","날 생|셀 계","살림을 살아 나가기 위해 이용하는 방법이나 도구","노동은 중요한 생계 수단이다."],["근로자","勤勞者","부지런할 근|일할 로|사람 자","사용자에게 노동을 제공하고 그 대가로 임금을 받는 사람","근로자는 사용자에게 노동을 제공하고 그 대가로 임금을 받는다."],["사용자","使用者","부릴 사|쓸 용|사람 자","근로자를 고용하거나 해고하고, 근로에 대해 지휘·감독할 책임을 지는 사람","사용자는 근로자를 고용하고 근로에 대해 지휘·감독할 책임을 진다."],["최저임금","最低賃金","가장 최|낮을 저|품삯 임|쇠 금","근로자에게 그보다 적게 지급해서는 안 된다고 정한 임금의 액수","근로자는 법으로 정한 최저 임금을 보장받는다."],["유급휴가","有給休暇","있을 유|줄 급|쉴 휴|틈 가","근로자가 근로를 제공하지 않아도 임금을 지급해야 하는 휴일","근로자는 법으로 정해진 유급휴가를 사용할 수 있다."],["체불","滯拂","막힐 체|떨칠 불","마땅히 지급해야 할 것을지급하지 못하고 미룸","사용자가 근로자에게 지급해야 할 임금을 주지 않는 것은 임금 체불에 해당한다."],["삭감","削減","깎을 삭|덜 감","깎아서 줄임","근로자의 임금을 정당한 이유 없이 삭감해서는 안 된다."],["퇴사","退社","물러날 퇴|모임 사","회사를 그만둠","근로자는 부당한 대우를 이유로 퇴사하기도 한다."],["경제성장","經濟成長","날 경|건널 제|이룰 성|길 장","한 나라의 전체적인 생산 수준이나 국민 소득이 계속해서 증가하는 것","우리나라는 짧은 시간 동안 빠르게 경제 성장을 이루어서 ‘한강의 기적’이라고 불린다."],["국내총생산","國內總生産","국 나라|안 내|총 합 할|날 생|산 낳을","일정 기간에 한 나라 안에서 생산된 물건과 서비스의 양을 돈으로 계산해 합한 것","국내 총생산의 증가는 한 나라의 경제 성장을 보여 주는 지표 중 하나이다."],["기대수명","期待壽命","기약할 기|기다릴 대|목숨 수|목숨 명","0세의 출생자가 앞으로 몇 세까지 생존할 것인지 예상되는 수명","의학 기술의 발전과 의료 서비스의 수준이 향상되면서 사람들의 기대수명이 크게 늘어났다."],["격차","隔差","사이 뜰 격|다를 차","빈부, 임금, 기술 수준 등이 서로 벌어져 다른 정도","사람들 사이의 소득 격차가 커지면 여러 사회문제가 나타날 수 있다."],["빈부격차","貧富隔差","가난할 빈|부유할 부|사 이 뜰 격|다를 차","한 사회에서 가난한 사람과 부유한 사람이 지닌 재산의 차 function fill(sel,vals,cur,fmt){
  sel.innerHTML=vals.map(v=>`<option value="${esc(v)}">${esc(fmt?fmt(v):v)}</option>`).join('');
  const use=vals.map(String).includes(String(cur))?String(cur):String(vals[0]);

}
function sync(from){

  const pubs=keysOf(DATA[S.g][S.s][S.sub]);S.pub=fill($('selPub'),pubs,S.pub);
  const units=keysOf(book());S.unit=fill($('selUnit'),units,S.unit);

  if(S.i>=units_items().length)S.i=0;

$('detail').addEventListener('click',e=>{
  if(e.target.id==='prev')pick(S.i-1);if(e.target.id==='next')pick(S.i+1)});
document.addEventListener('keydown',e=>{
  if($('ov').hidden&&!/SELECT|INPUT/.test(document.activeElement.tagName)){
    if(e.key==='ArrowDown'&&S.i<units_items().length-1){pick(S.i+1);e.preventDefault()}
    if(e.key==='ArrowUp'&&S.i>0){pick(S.i-1);e.preventDefault()}}
  if(e.key==='Escape'){closeQuiz();closeIx()}});

/* ---------- 골든벨 ---------- */
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q=null;
function makeQuestions(){
  const items=units_items(),pool=[].concat(...Object.values(book()));
  const uniq=a=>{const s=new Set();return a.filter(x=>!s.has(x)&&s.add(x))};
  const qs=[];
  const lastT=[];
  shuf(items).slice(0,10).forEach(w=>{
    const [word,hz,hun,mean,ex]=w,types=[];
    if(mean)types.push('mean');
    if(hz)types.push('hanja');
    if(ex&&ex.includes(word))types.push('blank');
    if(mean)types.push('rev');
    if(!types.length)types.push('hanja0');
    const pref=types.filter(t=>t!==lastT[lastT.length-1]);
    const t=shuf(pref.length?pref:types)[0];lastT.push(t);
    const near=shuf(items.filter(x=>x[0]!==word)).concat(shuf(pool.filter(x=>x[0]!==word)));
    let ans,opts,prompt,hint='',type;
    if(t==='rev'){
      type='뜻 고르기';prompt=`‘${word}’의 뜻으로 알맞은 것은?`;
      ans=mean;opts=uniq([mean].concat(near.filter(x=>x[3]&&x[3]!==mean).map(x=>x[3]))).slice(0,4);
    }else{
      ans=word;
      opts=uniq([word].concat(near.map(x=>x[0]))).slice(0,4);
      if(t==='mean'){type='뜻풀이';prompt='다음 뜻에 알맞은 어휘는?';hint=mean.split(word).join('○○')}
      else if(t==='blank'){type='빈칸 채우기';prompt='빈칸에 들어갈 알맞은 어휘는?';hint=ex.split(word).join('(　　　)')}
      else{type='한자 어휘';prompt='다음 한자로 이루어진 어휘는?';
        const p=hun?hun.split('|'):[];hint=`<span class="qhz">${hz}</span>`+(p.length?`<div class="muted" style="font-size:13px">${esc(p.join(' · '))}</div>`:'');}
    }
    qs.push({type,prompt,hint,html:t==='hanja'||t==='hanja0',ans,opts:shuf(opts),w});
  });
  return qs;
}
function openQuiz(){
  Q={qs:makeQuestions(),i:0,lives:3,res:[],score:0,done:false,picked:null};
  $('ov').hidden=false;drawQ();$('quiz').scrollTop=0;
}
function closeQuiz(){$('ov').hidden=true;Q=null;renderBell()}
const ladder=()=>'<div class="ladder">'+Q.qs.map((_,i)=>`<span class="${Q.res[i]||(i===Q.i&&!Q.done?'cur':'')}"></span>`).join('')+'</div>';
const lives=()=>'<div class="lives" aria-label="남은 기회 '+Q.lives+'번">기회 '+[0,1,2].map(i=>`<i class="${i<Q.lives?'':'off'}"></i>`).join('')+'</div>';
function drawQ(){
  const q=Q.qs[Q.i],box=$('quiz');
  const hint=q.hint?(q.html?q.hint:`<p class="qtext" style="background:var(--celadon-soft);border-radius:10px;padding:10px 12px">${esc(q.hint)}</p>`):'';
  const L='①②③④';
  box.innerHTML=`<div class="qtop"><h2>${BELL}어휘 골든벨</h2>${lives()}</div>${ladder()}
  <div class="qcard"><div class="qtype">${Q.i+1} / ${Q.qs.length} · ${q.type}</div><p class="qtext">${esc(q.prompt)}</p>${hint}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt" data-o="${i}"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="fb"></div>
  <button class="btn ghost" type="button" id="qquit">그만하기</button>`;
}
function answer(oi){
  const q=Q.qs[Q.i];if(Q.picked!==null)return;
  Q.picked=oi;const ok=q.opts[oi]===q.ans;
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;
    if(q.opts[i]===q.ans)b.classList.add('right');else if(i===oi)b.classList.add('wrong')});
  Q.res[Q.i]=ok?'ok':'bad';if(ok)Q.score++;else Q.lives--;
  const [word,hz,hun,mean,ex]=q.w;
  const last=Q.i>=Q.qs.length-1,out=Q.lives<=0;
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><strong>${ok?'정답이에요!':'아쉬워요. 정답은 ‘'+esc(q.type==='뜻 고르기'?word:q.ans)+'’'}</strong>${esc(word)}${hz?' ('+hz+')':''} · ${esc(mean||'')}</div>
  <button class="btn" type="button" id="qnext" style="width:100%;margin-top:8px">${out||last?'결과 보기':'다음 문제'}</button>`;
  document.querySelector('.qtop .lives').outerHTML=lives();
  document.querySelector('.ladder').outerHTML=ladder();
  $('qnext').scrollIntoView({block:'nearest'});$('qnext').focus({preventScroll:true});
}
function nextQ(){
  const out=Q.lives<=0,last=Q.i>=Q.qs.length-1;
  Q.picked=null;
  if(out||last){return result()}
  Q.i++;drawQ();$('quiz').scrollTop=0;
}
function result(){
  Q.done=true;
  const total=Q.qs.length,pts=Math.round(Q.score/total*100),win=Q.lives>0&&Q.res.length===total;
  const key=[S.g,S.s,S.sub,S.pub,S.unit].join('/'),b=store('ja-best')||{};
  if(b[key]==null||pts>b[key]){b[key]=pts;store('ja-best',b)}
  const wrong=Q.qs.filter((_,i)=>Q.res[i]==='bad');
  const skipped=total-Q.res.length;
  $('quiz').innerHTML=`<div class="res ${win?'win':''}">
    <div class="big">${BELL}</div>
    <h2>${win?'골든벨을 울렸어요!':'다음엔 꼭 울려 봐요'}</h2>
    <div class="muted">${Q.score}문제 정답 · ${pts}점${skipped?` · ${skipped}문제 남음`:''}</div>
    ${wrong.length?`<div class="wr"><strong style="font-size:13px" class="muted">다시 볼 어휘</strong>${wrong.map(q=>`<div><b>${esc(q.w[0])}</b>${q.w[1]?' ('+q.w[1]+')':''}<br><span class="muted">${esc(q.w[3]||'')}</span></div>`).join('')}</div>`:''}
    <div class="row"><button class="btn gold" type="button" id="qagain">다시 도전</button><button class="btn ghost" type="button" id="qclose">닫기</button></div></div>`;
  $('quiz').scrollTop=0;
}
$('bellBtn').addEventListener('click',openQuiz);
$('ov').addEventListener('click',e=>{
  if(e.target===$('ov'))return;
  const o=e.target.closest('.opt');if(o)return answer(+o.dataset.o);
  const id=e.target.id;
  if(id==='qnext')nextQ();else if(id==='qagain')openQuiz();else if(id==='qclose'||id==='qquit')closeQuiz();
});

/* ---------- 전체 색인 ---------- */
const ALL=[];
for(const g of keysOf(DATA,1))for(const s of keysOf(DATA[g],1))for(const sub of SUBJ.filter(x=>DATA[g][s][x]))for(const p of keysOf(DATA[g][s][sub]))for(const u of keysOf(DATA[g][s][sub][p]))DATA[g][s][sub][p][u].forEach((w,i)=>ALL.push({g,s,sub,p,u,i,w}));
const cntOf=o=>Object.values(o).reduce((a,v)=>a+(Array.isArray(v)?v.length:cntOf(v)),0);
function treeHTML(){
  let h='';
  for(const g of keysOf(DATA,1)){
    h+=`<details class="l1"><summary>${g}학년<em>${cntOf(DATA[g])}개</em></summary><div class="kid">`;
    for(const s of keysOf(DATA[g],1)){
      h+=`<details class="l2"><summary>${s}학기<em>${cntOf(DATA[g][s])}개</em></summary><div class="kid">`;
      for(const sub of SUBJ.filter(x=>DATA[g][s][x])){
        h+=`<details class="l3"><summary>${sub}<em>${cntOf(DATA[g][s][sub])}개</em></summary><div class="kid">`;
        for(const p of keysOf(DATA[g][s][sub])){
          h+=`<details class="l4"><summary>${esc(p)}<em>${cntOf(DATA[g][s][sub][p])}개</em></summary><div class="kid">`;
          for(const u of keysOf(DATA[g][s][sub][p])){
            h+=`<details class="l5" data-k="${esc([g,s,sub,p,u].join('\u0001'))}"><summary>${esc(u)}<em>${DATA[g][s][sub][p][u].length}개</em></summary><div class="chips"></div></details>`;
          }
          h+='</div></details>';
        }
        h+='</div></details>';
      }
      h+='</div></details>';
    }
    h+='</div></details>';
  }
  return h;
}
let treeDone=false;
function openIx(){
  $('ixov').hidden=false;
  if(!treeDone){$('ixbody').innerHTML=treeHTML();treeDone=true}
  $('ixsum').textContent='전체 '+ALL.length.toLocaleString()+'개 어휘 · 학년 › 학기 › 교과 › 출판사 › 단원';
  $('ixq').focus({preventScroll:true});
}
function closeIx(){$('ixov').hidden=true}
function jump(g,s,sub,p,u,i){
  Object.assign(S,{g:String(g),s:String(s),sub,pub:p,unit:u,i:+i});
  closeIx();sync('idx');
}
$('ixBtn').addEventListener('click',openIx);
$('ixClose').addEventListener('click',closeIx);
$('ixov').addEventListener('click',e=>{if(e.target===$('ixov'))closeIx()});
$('ixbody').addEventListener('toggle',e=>{
  const d=e.target;
  if(d.classList&&d.classList.contains('l5')&&d.open){
    const c=d.querySelector('.chips');
    if(!c.children.length){
      const [g,s,sub,p,u]=d.dataset.k.split('\u0001');
      c.innerHTML=DATA[g][s][sub][p][u].map((w,i)=>`<button type="button" class="chip" data-j="${esc(d.dataset.k)}\u0001${i}">${esc(w[0])}${w[1]?`<small>${w[1]}</small>`:''}</button>`).join('');
    }
  }
},true);
$('ixbody').addEventListener('click',e=>{
  const b=e.target.closest('[data-j]');if(!b)return;
  const [g,s,sub,p,u,i]=b.dataset.j.split('\u0001');jump(g,s,sub,p,u,i);
});
let qt=0;
$('ixq').addEventListener('input',e=>{
  clearTimeout(qt);const q=e.target.value.trim();
  qt=setTimeout(()=>{
    if(!q){$('ixbody').innerHTML=treeHTML();$('ixsum').textContent='전체 '+ALL.length.toLocaleString()+'개 어휘 · 학년 › 학기 › 교과 › 출판사 › 단원';return}
    const r=ALL.filter(x=>x.w[0].includes(q)||x.w[1].includes(q));
    $('ixsum').textContent=`‘${q}’ 검색 결과 ${r.length.toLocaleString()}개`+(r.length>200?' (앞 200개만 표시)':'');
    $('ixbody').innerHTML=r.slice(0,200).map(x=>`<button type="button" class="hit" data-j="${esc([x.g,x.s,x.sub,x.p,x.u,x.i].join('\u0001'))}"><b>${esc(x.w[0])}${x.w[1]?`<small>${x.w[1]}</small>`:''}</b><span>${x.g}학년 ${x.s}학기 · ${x.sub} · ${esc(x.p)} · ${esc(x.u)}</span></button>`).join('')||'<p class="muted" style="text-align:center">검색 결과가 없어요.</p>';
  },150);
});
sync('init');
</script>

</body></html>
