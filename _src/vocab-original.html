<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>청자골 아학 어휘력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&display=swap">
<style>
/* Layout: 상단 선택 박스 5개, 아래는 좌측(어휘 목록 + 골든벨) / 우측(상세) 2단. 폰·태블릿 모두 2단 유지 */
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --ink:#1B2B33; --muted:#5C6F76; --line:#D3E0DA;
  --celadon:#2E7D6E; --celadon-soft:#DDEEE7; --gold:#C98A0B; --gold-soft:#FBEFCF;
  --um:#1F8A5B; --gold-ink:#8A5A00; --ok:#1E8A4F; --ok-soft:#DDF3E5; --bad:#C23B3B; --bad-soft:#FADFDF;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-han:"Noto Serif KR","Batang","AppleMyungjo",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1E; --surface:#17262B; --ink:#E6F0EC; --muted:#93A8A2; --line:#2A3D42;
  --celadon:#6CC4AE; --celadon-soft:#1F3B37; --gold:#F0B43A; --gold-soft:#3A3014;
  --um:#5FD8A0; --gold-ink:#F0B43A; --ok:#62D38E; --ok-soft:#1B3A2A; --bad:#F08080; --bad-soft:#3F2020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1E; --surface:#17262B; --ink:#E6F0EC; --muted:#93A8A2; --line:#2A3D42;
  --celadon:#6CC4AE; --celadon-soft:#1F3B37; --gold:#F0B43A; --gold-soft:#3A3014;
  --um:#5FD8A0; --gold-ink:#F0B43A; --ok:#62D38E; --ok-soft:#1B3A2A; --bad:#F08080; --bad-soft:#3F2020; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;overflow-x:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:1100px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.brand .tag{font-size:clamp(15px,4.2vw,20px);font-weight:800;color:#fff;background:var(--celadon);padding:3px 12px;border-radius:999px;letter-spacing:-.01em;white-space:nowrap}
:root:not([data-theme="light"]) .brand .tag{color:#0F1A1E}
.brand .grades{white-space:nowrap;font-size:13px;font-weight:700;color:var(--gold-ink)}
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.filters label{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:11px;color:var(--muted);font-weight:500}
.filters label:nth-child(-n+3){grid-column:span 2}
.filters label:nth-child(n+4){grid-column:span 3}
select{width:100%;min-width:0;height:42px;padding:0 28px 0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;font-weight:500;text-overflow:ellipsis;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}
select:focus{border-color:var(--celadon)}
@media (min-width:760px){
  .filters{grid-template-columns:repeat(5,minmax(0,1fr))}
  .filters label:nth-child(n){grid-column:auto}
  .brand h1{font-size:21px}
}
main{flex:1;min-height:0;display:grid;grid-template-columns:clamp(116px,36%,300px) minmax(0,1fr);gap:10px}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.listwrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.listhead{padding:10px 10px 8px;background:var(--celadon-soft);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.listhead small{font-size:11px;color:var(--muted)}
.listhead .row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.listhead b{color:var(--ink);font-weight:800;font-size:17px;word-break:keep-all}
.listhead span{font-size:12px;color:var(--muted)}
#vocab{list-style:none;margin:0;padding:4px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
#vocab button{width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;border:0;background:transparent;padding:10px 8px;min-height:44px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:500;word-break:keep-all}
#vocab button .n{font-size:11px;color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
#vocab button:hover{background:var(--celadon-soft)}
#vocab button[aria-current="true"]{background:var(--celadon);color:#fff}
#vocab button[aria-current="true"] .n{color:inherit;opacity:.8}
:root:not([data-theme="light"]) #vocab button[aria-current="true"]{color:#0F1A1E}
.bell{flex:none;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bell .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--ink)}
.bell svg{width:22px;height:22px;flex:none;color:var(--gold)}
.bell p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.btn{white-space:nowrap;border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;font-size:15px;cursor:pointer;background:var(--celadon);color:#fff}
:root:not([data-theme="light"]) .btn{color:#0F1A1E}
.btn.gold{background:var(--gold);color:#fff}
:root:not([data-theme="light"]) .btn.gold{color:#1B1503}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.detail{min-width:0;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.crumb{font-size:12px;color:var(--muted)}
.word{font-family:var(--f-han);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0;word-break:keep-all}
.hanja{display:flex;flex-wrap:wrap;gap:8px}
.hz{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;min-width:58px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.hz big{font-family:var(--f-han);font-size:clamp(30px,6vw,40px);line-height:1.1;font-weight:600;color:var(--celadon)}
.hz small{font-size:12px;color:var(--muted);white-space:nowrap}
.hz .um{color:var(--um);font-weight:800}
.hz small .um{font-size:15px}
.hzline{font-family:var(--f-han);font-size:26px;color:var(--celadon)}
.sec h3{margin:0 0 4px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sec p{margin:0;font-size:clamp(16px,2.6vw,19px);line-height:1.6;word-break:keep-all}
.sec .ex{background:var(--celadon-soft);border-radius:10px;padding:12px 14px}
.sec .ex mark{background:transparent;color:var(--celadon);font-weight:700;border-bottom:2px solid var(--celadon)}
.muted{color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:auto}
.nav .btn{flex:1}
.empty{margin:auto;text-align:center;color:var(--muted)}
/* quiz overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,20,24,.62);display:flex;align-items:stretch;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.quiz{background:var(--bg);width:100%;max-width:680px;display:flex;flex-direction:column;gap:12px;padding:14px 16px;overflow-y:auto}
@media (min-width:700px){.ov{align-items:center;padding:20px}.quiz{border-radius:18px;max-height:min(100%,780px)}}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qtop h2{margin:0;font-size:16px;display:flex;align-items:center;gap:6px}
.qtop h2 svg{width:22px;height:22px;color:var(--gold)}
.lives{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.lives i{width:16px;height:16px;border-radius:50%;background:var(--bad);display:inline-block}
.lives i.off{background:transparent;border:2px solid var(--line)}
.ladder{display:flex;gap:4px}
.ladder span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.ladder span.ok{background:var(--ok)}.ladder span.bad{background:var(--bad)}.ladder span.cur{background:var(--gold)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.qtype{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.qtext{font-size:clamp(17px,3vw,20px);line-height:1.55;margin:0;font-weight:500;word-break:keep-all}
.qhz{font-family:var(--f-han);font-size:34px;color:var(--celadon);font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;font-weight:500;word-break:keep-all}
.opt b{width:26px;height:26px;border-radius:50%;background:var(--celadon-soft);color:var(--celadon);display:grid;place-items:center;font-size:13px;flex:none}
.opt:hover:not(:disabled){border-color:var(--celadon)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb strong{display:block;font-size:16px;margin-bottom:2px}
.res{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:10px}
.res .big{width:84px;height:84px;color:var(--gold)}
.res.win .big{animation:ring 1.2s ease-in-out 2;transform-origin:50% 10%}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.res.win .big{animation:none}}
.res h2{margin:0;font-size:22px}
.wr{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px}
.wr div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;width:100%}.row .btn{flex:1}

/* 색인 */
.ixbtn{margin-left:auto;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--celadon);background:transparent;color:var(--celadon);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.ixbtn:hover{background:var(--celadon-soft)}
.ix{background:var(--bg);width:100%;max-width:820px;display:flex;flex-direction:column;min-height:0}
@media (min-width:700px){.ix{border-radius:18px;max-height:min(100%,860px)}}
.ixhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.ixhead .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ixhead h2{margin:0;font-size:18px}
.ixhead input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:var(--surface);color:var(--ink)}
.ixhead input:focus{border-color:var(--celadon);outline:none}
.ixbody{overflow-y:auto;padding:10px 16px 16px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.ix details{margin:0}
.ix summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 8px;border-radius:9px;font-weight:700}
.ix summary::-webkit-details-marker{display:none}
.ix summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s;flex:none}
.ix details[open]>summary::before{transform:rotate(90deg)}
.ix summary:hover{background:var(--celadon-soft)}
.ix summary em{font-style:normal;font-weight:500;font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.ix .l1>summary{font-size:17px;color:var(--celadon);background:var(--celadon-soft)}
.ix .l2>summary{font-size:15px}
.ix .l3>summary{font-size:14px}
.ix .l4>summary{font-size:14px;font-weight:600}
.ix .l5>summary{font-size:13px;font-weight:600;color:var(--gold-ink)}
.ix .kid{margin-left:12px;padding-left:8px;border-left:2px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 10px 8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;min-height:34px;font-size:14px;cursor:pointer;word-break:keep-all}
.chip small{color:var(--muted);font-family:var(--f-han);margin-left:4px}
.chip:hover{border-color:var(--celadon);background:var(--celadon-soft)}
.hit{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 6px;min-height:48px;cursor:pointer}
.hit:hover{background:var(--celadon-soft)}
.hit b{font-size:16px}.hit b small{font-family:var(--f-han);font-weight:500;color:var(--celadon);margin-left:6px}
.hit span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.brand .grades{display:none}.brand h1{font-size:17px}}
</style>

<div class="app">
  <header>
    <div class="brand"><h1>청자골 아학</h1><span class="tag">교과서 어휘력편</span><span class="grades">초등 3~6학년</span><button class="ixbtn" id="ixBtn" type="button">어휘 찾기</button></div>
    <div class="filters" role="group" aria-label="교재 선택">
      <label for="selGrade">학년<select id="selGrade"></select></label>
      <label for="selSem">학기<select id="selSem"></select></label>
      <label for="selSubject">교과<select id="selSubject"></select></label>
      <label for="selPub">출판사<select id="selPub"></select></label>
      <label for="selUnit">단원<select id="selUnit"></select></label>
    </div>
  </header>
  <main>
    <section class="left" aria-label="단원 어휘">
      <div class="listwrap">
        <div class="listhead"><small id="unitSub"></small><div class="row1"><b id="unitName">단원</b><span id="cnt"></span></div></div>
        <ul id="vocab"></ul>
      </div>
      <div class="bell">
        <div class="t"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a1.6 1.6 0 0 1 1.6 1.6v.5A6.5 6.5 0 0 1 18.5 10.5v3.2l1.7 2.6a1 1 0 0 1-.84 1.55H4.64a1 1 0 0 1-.84-1.55l1.7-2.6v-3.2a6.5 6.5 0 0 1 4.9-6.4v-.5A1.6 1.6 0 0 1 12 2zm-2.2 17h4.4a2.2 2.2 0 0 1-4.4 0z"/></svg>어휘 골든벨</div>
        <p id="bellInfo"></p>
        <button class="btn gold" id="bellBtn" type="button">도전하기</button>
      </div>
    </section>
    <section class="detail" id="detail" aria-live="polite"></section>
  </main>
</div>
<div class="ov" id="ixov" hidden><div class="ix" id="ixp" role="dialog" aria-modal="true" aria-label="전체 어휘 색인">
  <div class="ixhead"><div class="r"><h2>전체 어휘 색인</h2><button class="btn ghost" id="ixClose" type="button" style="min-height:38px">닫기</button></div>
  <input id="ixq" type="search" placeholder="어휘나 한자 검색 (예: 지도, 地)" autocomplete="off"><div class="muted" id="ixsum" style="font-size:12px"></div></div>
  <div class="ixbody" id="ixbody"></div></div></div>

<script>

 저작권을 침해하는 행동이다."],["문화","文化","글월 문|될 화","한 사회에서 살아가는 사람들이 가지고 있는 공통의 생활 방식","의식주뿐만 아니라 놀이와 취미 생활 같은 여가 활동도 문화라고 할 수 있다."],["결혼이주자","結婚移住者","맺을 결|혼인할 혼|옮길 이|살 주|놈 자","결혼한 후 다른 나라에 가서 사는 사람","결혼 이주자는 결혼을 이유로 다른 나라로 이주하여 사는 사람이다."],["북한이탈주민","北韓離脫住民","북녘 북|한국 한|떠날 리(이)|벗을 탈|살 주|백성 민","북한을 떠나 다른 지역에서 살고 있는 사람","우리 지역에는 북한을 떠나 다른 지역에서 생활하는 북한 이탈 주민도 함께 살아가고 있다."],["유입","流入","흐를 류(유)|들 입","문화나 지식이 들어오는 것","세계 여러 나라의 문화가 유입되며 다양한 문화를 체험하고 즐길 수 있다."],["가구","家口","집 가|입 구","한 집에 같이 살며 함께 생활하는 사람들로 이루어진 집단","요즘에는 혼자 사는 1인 가구가 늘어나고 있다."],["반려동물","伴侶動物","짝 반|짝 려|움 직 일 동|물건 물","사람과 더불어 살아가며 친밀감과 안정감을 주는 동물","반려동물을 키우는 사람이 늘어나면서 반려동물 산업이 발달하고 있다."],["편견","偏見","치우칠 편|볼 견","공정하지 못하고 한쪽으로 치우친 생각","종교적인 이유로 특정 음식을 먹지 않는 문화를 두고 이상하게 여기는 것은 편견이다."],["차별","差別","다를 차|나눌 별","옳지 않은 기준을 두어 다르게 대하는 것","피부색이나 생김새가 다르다는 이유로 피하는 것은 차별이다."]],"2단원":[["풍습","風習","바람 풍|익힐 습","옛날부터 전해 내려오는 생활 모습이나 습관","풍습은 세시 풍속, 놀이, 의식주와 같이 옛날부터 전해 내려오는 생활 모습이나 생활 습관을 말한다."],["명절","名節","이름 명|마디 절","해마다 일정하게 지키고 기념하는 날","사람들은 설날, 추석과 같은 명절이 되면 명절 음식을 만들어 먹고 놀이도 함께 한다."],["세시풍속","歲時風俗","해 세|때 시|바람 풍|풍속 속","해마다 반복되는 날에 하는 일과 놀이, 먹는 음식, 입는 옷 등의 생활 모습","계절마다 농사와 관련된 다양한 세시 풍속이 있었다."],["한식","寒食","찰 한|먹을 식","찬 음식을 먹고, 불을 사용하지 않는 날","한식에는 한 해의 농사를 준비하고 조상의 산소에 성묘하며 풍년을 빌었다."],["산소","山所","메 산|바 소","사람의 무덤을 높여 이르는 말","명절을 맞아 온 가족이 조상의 산소를 정성껏 돌보았다."],["성묘","省墓","살필 성|무덤 묘","조상의 무덤을 돌보는 일","성묘를 하러 가는 사람들이 많아 도로가 크게 붐볐다."],["단오","端午","끝 단|낮 오","음력 5월 5일로 더위가 시작되는 시기","단오에는 사람들이 씨름과 그네뛰기를 즐기고 나쁜 기운을 쫓으려고 창포물에 머리를 감았다."],["삼복","三伏","석 삼|엎드릴 복","양력 7~8월 무렵의 초복, 중복, 말복을 일컬음, 여름철 가장 더운 시기","삼복에 사람들은 영양이 풍부한 음식을 먹으며 더위를 이겨 냈다."],["추석","秋夕","가을 추|저녁 석","음력 8월 15일로, 가을의 한가운데 있는 큰 날이란 뜻으로 한가위라고 부르기도 함","추석에는 곡식과 과일을 수확하고, 한 해 농사에 감사하는 의미로 조상에게 차례를 지냈다."],["추수","秋收","가을 추|거둘 수","가을에 익은 곡식을 거두어들이는 일","가을이 되면 마을에서는 정성껏 기른 곡식을 추수한다."],["중양절","重陽節","무거울 중|볕 양|마디 절","음력 9월 9일로, 추수를 마무리하는 시기","중양절에는 사람들이 단풍과 국화를 구경하려고 산으로 나들이를 갔다."],["동지","冬至","겨울 동|이를 지","양력 12월 22일 무렵, 한 해를 마무리하고 새해를 맞이할 준비를 하는 시기","동지에는 팥의 붉은색이 나쁜 기운을 몰아낸다고 생각해 팥죽을 만들어 먹었다."],["덕담","德談","클 덕|말씀 담","남이 잘되기를 바라는 마음으로 서로 나누는 좋은 말","새해를 맞아 우리 가족은 서로 덕담을 주고받았다."],["교통수단","交通手段","사 귈 교|통할 통|손 수|조 각 단","사람이 이동하거나 물건을 옮기는 데 쓰는 방법이나 도구","옛날 교통수단은 주로 사람, 동물, 자연의 힘을 이용했다."],["생활권","生活圈","날 생|살 활|우리 권","사람들이 일상생활을 하기 위해 활동하는 범위","교통이 발달하면서 사람들의 생활권이 넓어졌다."],["교통약자","交通弱者","사귈 교|통할 통|약할 약|놈 자","노인, 어린이, 장애인, 임산부처럼 교통수단을 이용하거나 이동할 때 어려움을 겪는 사람","교통의 발달로 교통 약자도 안전하고 편하게 이동할 수 있게 되었다."],["통신수단","通信手段","통할 통|믿을 신|손 수|조 각 단","사람들이 서로 정보를 주고받기 위해 이용하는 방법이나 도구","옛날 사람들은 먼 곳에 있는 사람들과 서로 소식을 주고받기 위해 다양한 통신 수단을 이용했다."],["방","榜","노 저을 방","어떤 중요한 소식을 널리 알리기 위해 사람이 많이 모이는 곳에 써 붙인 글","과거 시험이 끝난 뒤 게시판에 합격자의 이름을 적은 방이 붙었다."],["파발","擺撥","열 파|다스릴 발","옛날에 파발꾼이 말을 타거나 걸어가서 나라의 급하고 중요한 소식을 전하던 통신 제도","조선 시대에는 파발꾼이 직접 말을 타거나 발로 뛰어 소식을 전하는 파발을 이용했다."],["서찰","書札","글 서|편지 찰","안부나 소식 등을 적어 보내는 글","옛날에는 멀리 사는 사람에게 소식을 전할 때 서찰을 직접 전달했다."],["신호 연","信號煙","믿을 신|이름 호|연기 연","약속된 신호가 그려져 있는 연","옛날에 전쟁 중에는 신호연을 띄워서 작전을 전달했다."],["봉수","烽燧","봉화 봉|부싯돌 수","나라에 위급한 일이 생겼을 때 낮에는 연기, 밤에는 불을 피워 임금이 있는 한양(서울) 까지 빠르게 알리는 수단","우리 조상들은 봉수를 이용하여 적이 쳐들어왔다는 소식을 임금에게 전달했다."],["가상공간","假想空間","거짓 가|생각 상|빌 공|사이 간","현실 세계가 아닌 컴퓨터, 인터넷 등으로 만들어진 가상의 공간","요즘에는 지역에 방문하지 않아도 가상 공간에서 지역을 체험하고, 지역에 대한 정보를 얻을 수 있다."],["지구온난화","地球溫暖化","땅 지|공 구|따뜻할 온|따뜻할 난|될 화","지구의 평균 온도가 올라가는 현상","디지털 기기를 사용하는 과정에서도 온실가스가 발생하여 지구 온난화에 영향을 줄 수 있다."]]},"아이스크림미디어":{"1단원":[["일상생활","日常生活","날 일|떳 떳 할 상|날 생|살 활","평상시의 생활","사회가 변화하면 사람들의 일상생활 모습도 달라진다."],["수명","壽命","목숨 수|목숨 명","태어나서부터 죽을 때까지 살아 있는 기간","평균 수명이 증가하며 노인 복지관이 새롭게 생겼다."],["교류","交流","사귈 교|흐를 류","사람들이 오가거나 물건, 기술 등을 서로 주고받는 것","우리 사회는 다른 나라와 음식 문화를 교류한다."],["폐교","廢校","무너질 폐|학교 교","운영하지 않고 문을 닫는 학교","올해 입학할 학생이 없어 학교가 폐교되었다."],["저출산","低出産","낮을 저|날 출|낳을 산","태어나는 아이의 수가 줄어들어 출산율이 감소하는 현상","저출산이 계속되면 학생 수가 줄어든다."],["보육","保育","지킬 보|기를 육","어린아이들을 돌보아 기름","아이들을 안전하게 돌보기 위해 보육 시설을 만들어 운영한다."],["고령화","高齡化","높을 고|나이 령|될 화","전체 사람 수에서 노인(65세 이상)의 수가 차지하는 비율이 높아지는 현상","고령화로 노인 복지관, 노인 전문 병원 등 노인을 위한 시설이 늘어나고 있다."],["비율","比率","견줄 비|비율 률(율)","일정한 양을 기준으로 어떤 양이 차지하는 정도를 나타낸 것","전체 사람 수에서 노인의 수가 차지하는 비율이 점차 높아질 것으로 예상된다."],["요양","療養","고칠 료(요)|기를 양","편히 쉬면서 병을 치료함","노인의 건강과 생활을 돕기 위한 요양 시설이 들어선다."],["복지제도","福祉制度","복 복|복 지|절제할 제|법도 도","사람들이 건강하고 행복하게 살 수 있도록 사회에서 지원하는 제도","나라에서는 노인의 안정적인 생활을 위해 다양한 복지 제도를 운영한다."],["인공지능","人工知能","사람 인|장인 공|알 지|능할 능","사람처럼 정보를 익히고 처리하여 다양한 상황에 적용할 수 있는 기능을 갖춘 컴퓨터 시스템","최근에는 다양한 정보를 더욱 빠르고 정확하게 처리하는 인공지능이 발달하고 있다."],["지능정보화","知能情報化","알 지|능할 능|뜻 정|갚 을 보|될 화","인공지능을 활용한 다양한 기술이 사회 전반에 폭넓은 영향을 미치는 현상","지능정보화로 사람들의 생활이 편리해졌다."],["개인정보","個人情報","낱 개|사람 인|뜻 정|갚을 보","다른 사람과 구별해 개인을 알 수 있는 모든 정보","개인정보는 이름, 성별, 나이, 주소 등 개인을 알 수 있는 모든 정보를 말한다."],["세계화","世界化","인간 세|지경 계|될 화","세계 여러 나라가 다양한 분야에서 교류하면서 전 세계가 하나로 연결되는 현상","세계화로 인해 다른 나라에서 만든 영화를 보거나 다른 나라에서 온 물건을 구입할 수 있게 되었다."],["생활양식","生活樣式","날 생|살 활|모양 양|법 식","사람들이 환경에 적응하면서 살아가는 생활 방식이나 사고방식","세계화로 다른 나라 사람들도 우리나라 사람들의 음식, 옷차림 등 생활 양식을 쉽게 접할 수 있게 되었다."],["한류","韓流","한국 한|흐를 류","대한민국과 관련 있는 것들이 다른 나라에서 인기를 얻는 현상","한류의 영향으로 우리나라에 관한 세계인의 관심이 높아졌다."],["문화","文化","글월 문|될 화","한 사회의 사람들이 지닌 공통의 생활양식","지역의 환경에 따라 다양한 문화가 나타난다."],["의식주","衣食住","옷 의|먹을 식|살 주","사람들이 살아가기 위해 꼭 필요한 옷, 음식, 집을 함께 이르는 말","지역에 따라 사람들의 옷차림, 음식, 집의 모습 등 의식주 문화가 다양하게 나타난다."],["이주민","移住民","옮길 이|살 주|백성 민","다른 지역에서 옮겨 와 사는 사람","세계화의 영향으로 공부, 직장, 결혼 등의 목적으로 우리나라에 사는 이주민이 늘어나고 있다."],["가구","家口","집 가|입 구","같이 살며 생활하는 사람들로 이루어진 집단","오늘날에는 혼자 사는 1인 가구가 늘어나고 있다."],["반려동물","伴侶動物","짝 반|짝 려|움 직 일 동|물건 물","사람과 더불어 살아가며 친밀감과 안정감을 주는 동물","반려동물에는 개, 고양이, 물고기, 새, 토끼, 햄스터 등이 있다."],["편견","偏見","치우칠 편|볼 견","나와 다르고 익숙하지 않은 것에 대해 공정하지 못하고 한쪽으로 치우친 생각","피부색이나 국적이 나와 다르다는 이유로 이상하게 생각하는 것은 편견이다."],["차별","差別","다를 차|나눌 별","편견을 가지고 다르게 대우하는 것","우리말을 잘하지 못한다고 해서 그 사람의 말을 무시하는 것은 차별이다."]],"2단원":[["풍습","風習","바람 풍|익힐 습","옛날부터 되풀이되어 전해 오는 생활 습관과 생활 모습","우리나라에는 생일날 미역국을 먹거나 겨울이 되기 전 김장을 하는 풍습이 있다."],["덕담","德談","클 덕|말씀 담","남이 잘되기를 바라며 서로 나누는 좋은 말","새해에는 가족들과 덕담을 주고받는다."],["세시풍속","歲時風俗","해 세|때 시|풍 바람|속 풍속","해마다 같은 시기에 반복되는 일, 음식, 놀이 등을 말함","풍습에는 해마다 일정한 때에 되풀이하는 세시풍속이 있다."],["명절","名節","이름 명|마디 절","설날, 정월 대보름, 단오, 추석과 같이 해마다 일정하게 지켜 즐기는 날","추석이나 설날과 같은 명절에는 세시 음식을 먹거나 차례를 지내고 전통 놀이를 즐긴다."],["절기","節氣","마디 절|기운 기","태양의 움직임에 따라 일 년을 24개로 나누어 정한 날들로, 계절의 기준이 됨","동지는 1년 중 밤이 가장 길고 낮이 가장 짧은 절기이다."],["백일","百日","일백 백|날 일","아이가 태어난 날로부터 백 번째 되는 날","우리나라에는 아이가 태어난 지 백일(100일)이 된 것을 축하하며 잔치를 하는 풍습이 있다."],["관례","冠","갓 관|예도 례","남자와 여자가 결혼하기 전에 하는 성인식","옛날에는 관례를 마치면 어른으로 대해주었다."],["혼례","婚","혼인할 혼|예도 례","성인이 된 남자와 여자가 부부가 되는 예식","성인이 된 남자와 여자가 혼인하는 것을 혼례라고 한다."],["회갑","回甲","돌아올 회|갑옷 갑","사람이 태어난 지 만 60년이 되는 61세 생일","우리 가족은 올해 만 60세가 되신 할아버지의 회갑(환갑)을 축하하는 잔치를 열었다."],["장례","葬","장사지낼 장|예도 례","사람이 죽었을 때 죽은 사람을 땅에 묻거나 화장하는 일","우리 가족은 돌아가신 할머니의 장례를 치르며 슬픔을 나누었다."],["폐백","幣帛","화폐 폐|비단 백","신부가 처음으로 신랑 부모나 신랑 쪽 어른들을 뵐 때 큰절을 올리는 것","옛날의 결혼 풍습에서는 신부가 신랑 집안의 어른들께 폐백을 드렸다."],["성묘","省墓","살필 성|무덤 묘","조상의 산소(무덤)에 찾아가서 돌보는 일","명절에는 조상의 묘지를 찾아가 성묘를 하기도 한다."],["풍년","豐年","풍년 풍|해 년","곡식이 잘 자라고 잘 익어 평년보다 수확이 많은 해","사람들은 정월 대보름에 보름달을 보며 소원을 빌고 풍년을 기원하였다."],["단오","端午","끝 단|낮 오","음력 5월 5일로 모내기를 마치고 더운 여름을 맞이하기 전에 잠시 휴식을 취하는 날","단오에 여자들은 창포물에 머리를 감고 그네를 뛰었고 남자들은 씨름을 즐겼다."],["추석","秋夕","가을 추|저녁 석","음력 8월 15일로 농사지은 곡식과 과일을 수확하는 시기","추석에는 그해에 새로 난 곡식과 과일로 차례를 지내고 보름달 아래에서 강강술래를 하였다."],["동지","冬至","겨울 동|이를 지","양력 12월 22일~23일 무렵으로, 한 해 중 밤이 가장 길고 낮이 가장 짧은 날","동지에는 팥죽을 먹는다."],["농사","農事","농사 농|일 사","곡류, 과채류 따위의 씨나 모종을 심어 기르고 거두는 따위의 일","우리 조상들은 주로 농사를 짓고 살았다."],["교통","交通","사귈 교|통할 통","어떤 장소에서 다른 장소로 사람이 이동하거나 물건을 옮기는 것","어떤 장소에서 다른 장소로 사람이 이동하거나 물건을 옮기는 것을 교통이라 한다."],["교통수단","交通手段","사 귈 교|통할 통|손 수|조 각 단","사람이 이동하거나 물건을 옮길 때 사용하는 도구","교통수단에는 자동차, 기차, 배, 비행기 등이 있다."],["교통로","交通路","사귈 교|통할 통|길 로","교통에 이용하는 길","교통로에는 도로, 철도, 수로 등이 있다."],["통신수단","通信手段","통할 통|믿을 신|손 수|조 각 단","소식이나 정보를 주고받으려고 사용하는 방법이나 도구","휴대전화와 컴퓨터는 멀리 있는 사람과 정보를 주고받을 수 있는 통신 수단이다."],["서찰","書札","글 서|편지 찰","일상생활의 안부나 소식을 적어 보내는 글","옛날에는 멀리 사는 사람에게 소식을 전하기 위해 서찰을 직접 전달했다."],["방","榜","노 저을 방","어떠한 소식이나 정보를 널리 알리기 위하여 사람들이 다니는 길거리나 많이 모이는 곳에 써 붙이는 글","나라에서 큰 공사를 한다는 소식이 담긴 방이 붙었다."],["파발","擺撥","열 파|다스릴 발","나라의 중요한 일이나 소식을 적은 문서를 말을 타고 가거나 걸어가서 전달했던 옛날의 통신수단","옛날에는 파발을 이용해 나라의 중요한 소식을 빠르게 전달했다."],["봉수","烽燧","봉화 봉|부싯돌 수","낮에는 연기, 밤에는 불을 피워 위급한 상황을 알리던 옛날의 통신수단","우리 조상들은 나라에 위급한 일이 생기면 높은 산 위에서 봉수를 올려 연기나 불빛으로 소식을 알렸다."],["신호연","信號鳶","믿을 신|이름 호|솔개 연","연에 여러 가지 모양과 색깔을 그려 넣어, 멀리 떨어져 있는 사람들에게 암호나 신호를 보낼 때 사용했던 연","장군은 하늘 높이 신호연을 띄워 전쟁 중 군사들에게 공격이나 후퇴 명령을 전했다."]]},"천재교과서(김정인)":{"1단원":[["저출산","低出産","낮을 저|날 출|낳을 산","태어나는 아이의 수가 점점 줄어드는 현상","저출산의 영향으로 태어나는 아이가 줄어들면서 산부인과 병원과 학교가 문을 닫고 있다."],["대응","對應","대할 대|응할 응","어떤 일이나 상황에 맞춰 태도·행동을 취하는 것","우리 사회는 저출산에 대응하기 위해 여러 가지 노력을 하고 있다."],["육아휴직","育兒休職","기를 육|아이 아|쉴 휴|직분 직","어린 자녀를 돌보기 위해 일하는 부모가 일정 기간 일을 쉬면서 자녀를 키울 수 있도록 하는 제도","아버지께서는 어린 동생을 돌보기 위해 회사에 육아 휴직을 신청하셨다."],["요양원","療養院","고칠 료(요)|기를 양|집 원","노인들이 생활하며 병을 치료하도록 시설을 갖추어 놓은 기관","요양원은 연세가 많거나 몸이 불편한 노인들이 생활하며 돌봄을 받을 수 있도록 시설을 갖춘 곳이다."],["인구","人口","사람 인|입 구","한 나라나 일정한 지역 안에 살고있는 사람의 수","의료 기술의 발달로 사람들의 수명이 늘어나면서 노인 인구가 늘어나고 있다."],["고령화","高齡化","높을 고|나이 령|될 화","전체 인구 중 65세 이상 인구가 차지하는 비율이 높아지는 현상","고령화가 계속되면서 노인을 위한 시설이 늘어나고 있다."],["비율","比率","견줄 비|비율 률(율)","전체에 대해 비교하는 양의크기를 나타낸 것","전체 인구 중 65세 이상 인구가 차지하는 비율이 점차 높아지고 있다."],["가상현실","假想現實","거짓 가|생각 상|나타날 현|열매 실","컴퓨터를 활용해 실제처럼 보이게 만든 현실","박물관 누리집에 접속해 가상 현실로 직접 가보지 못한 전시관 구석구석을 둘러보았다."],["인공지능","人工知能","사람 인|장인 공|알 지|능할 능","사람처럼 학습해서 문제를 해결하는 컴퓨터 프로그램","오늘날에는 인공지능, 인터넷 등의 지능 정보 기술이 발달하면서 원하는 정보를 쉽고 빠르게 얻을 수 있다."],["지능정보화","知能情報化","알 지|능할 능|뜻 정|갚 을 보|될 화","지능 정보 기술의 발달로 정보가 중심이 되어 사회의 발전을 이끌어 나가는 현상","지능정보화로 인공지능과 같은 지능 정보 기술이 우리 생활의 여러 분야에서 활용되고 있다."],["저작권","著作權","나타날 저|지을 작|권세 권","음악과 사진, 글 등을 만든 사람이 갖는 권리","다른 사람이 만든 음악, 영화 등을 불법으로 내려받는 것은 저작권을 침해하는 행동이다."],["문화","文化","글월 문|될 화","한 사회의 구성원들이 가지고 있는 공통의 생활 방식","문화는 사는 지역, 나이, 성별 등에 따라 다양하게 나타난다."],["외국인이주민","外國人移住民","바깥 외|나라 국|사람 인|옮길 이|살 주|백성 민","한국으로 사는 곳을 옮긴 외국인(자녀 포함)","우리 반에 새로 전학 온 친구는 가족과 함께 한국으로 이사 온 외국인 이주민이다."],["반려동물","伴侶動物","짝 반|짝 려|움 직 일 동|물건 물","사람과 더불어 사는 동물","오늘날에는 반려동물과 함께 사는 사람이 많아졌다."],["비혼","非婚","아닐 비|혼인할 혼","결혼하지 않고 살아가는 것","혼자 사는 사람 중에는 결혼을 하지 않고 비혼을 선택한 사람도 있다."],["가구","家口","집 가|입 구","함께 생계를 하는 생활 단위","혼자 사는 사람이 많아지면서 1인 가구가 늘고 있다."],["편견","偏見","치우칠 편|볼 견","한쪽으로 치우친 생각","누군가의 피부색이나 생김새만 보고 한국말을 잘 못할 것이라 생각하는 것은 편견이다."],["차별","差別","다를 차|나눌 별","나와 다르다는 이유로 상대방을 부당하게 대우하는 것","종교나 문화가 다르다는 이유로 친구를 모둠 활동에서 제외하는 것은 차별이다."]],"2단원":[["풍습","風習","바람 풍|익힐 습","오랜 기간 동안 사람들에게 이어져 내려온 생활 습관","우리나라에는 이삿날 이웃에게 떡을 돌리고, 생일날에는 미역국을 먹는 풍습이 있다."],["세시","歲時","해 세|때 시","매년 같은 시기에 돌아오는 특정한 날","설날이나 추석처럼 해마다 일정한 시기에 되풀이되는 때를 세시라고 한다."],["세시풍속","歲時風俗","해 세|때 시|바람 풍|풍속 속","세시에 즐기는 다양한 풍습","설날에는 연을 날리거나 떡국을 먹고 세배를 하는 세시풍속이 있다."],["한식","寒食","찰 한|먹을 식","봄에 씨를 뿌리기 전 조상의 산소에 찾아가 차례를 지내고 묘를 돌보는 날","한식에는 불을 사용하지 않고 찬 음식을 먹었다."],["단오","端午","끝 단|낮 오","음력 5월 5일로, 모내기를 끝낸 후 여름을 맞이하는 날","단오에는 여름을 대비해 부채를 주고받고, 나쁜 기운을 쫓으려고 창포물에 머리를 감았다."],["삼복","三伏","석 삼|엎드릴 복","몹시 더운 여름날인 초복, 중복, 말복을 말함","삼복에는 농사일을 잠시 쉬고, 영양가 있는 음식을 먹으며 체력을 회복하거나 계곡에서 더위를 피하기도 했다."],["추석","秋夕","가을 추|저녁 석","음력 8월 15일로, 농사를 무사히 마치고 조상에게 고마움을 표현하는 날","추석에는 송편을 만들어 먹으며 차례를 지냈다."],["동지","冬至","겨울 동|이를 지","12월에 찾아오는 날로, 일 년 중 밤이 가장 긴 날","동지에는 나쁜 기운을 쫓으려고 팥죽을 만들어 나눠 먹거나 대문에 뿌리기도 했다."],["성묘","省墓","살필 성|무덤 묘","조상의 무덤을 돌보는 일","옛날에는 추석에 친척들과 차례를 지내고 성묘를 하러 갔다."],["교통수단","交通手段","사 귈 교|통할 통|손 수|조 각 단","사람이 이동하거나 물건을 실어 나를 때 이용하는 방법이나 도구","옛날의 교통수단은 주로 사람이나 동물, 자연의 힘을 이용했다."],["증기선","蒸氣船","찔 증|기운 기|배 선","물이 끓을 때 나오는 수증기의 힘으로 움직이는 배","증기선은 증기의 힘으로 움직이는 배이다."],["전차","電車","번개 전|수레 차","전기의 힘으로 철길 위를 달리는 차","사람들은 전차를 타고 원하는 곳까지 빠르고 편리하게 갈 수 있게 되었다."],["화물선","貨物船","재물 화|물건 물|배 선","많은 양의 물건이나 짐을 실어 나르는 배","화물선은 강이나 바다 건너로 한 번에 많은 물건을 실어 나를 수 있는 배이다."],["무인기","無人機","없을 무|사람 인|틀 기","사람이 직접 타지 않고, 땅에서 리모컨이나 컴퓨터 프로그램으로 조종하는 비행체(드론)","무인기는 이동이 힘든 곳까지 날아가서 물건을 옮겨 준다."],["여객선","旅客船","나그네 려(여)|손 객|배 선","사람을 태우고 강이나 바다를 오가는 배","사람들은 섬에 가기 위해 여객선을 타고 바다를 건넜다."],["생활공간","生活空間","날 생|살 활|빌 공|사이 간","사람이 일상생활을 하는 공간 범위","교통수단의 발달로 사람들의 생활 공간(생활권)이 넓어졌다."],["통신수단","通信手段","통할 통|믿을 신|손 수|조 각 단","소식이나 정보를 전할 때 이용하는 방법이나 도구","옛날 사람들은 편지, 방, 신호 연, 북, 파발, 봉수 등의 다양한 통신 수단을 이용하였다."],["신호연","信號煙","믿을 신|이름 호|연기 연","옛날 전쟁이나 긴급한 상황에서 서로 다른 무늬와 색깔을 이용해 소식이나 명령을 전하던 연","신호연은 그려진 무늬와 색깔에 따라 적을 공격하는 방향이나 공격 시간을 알리는 데 쓰였다."],["봉수","烽燧","봉화 봉|부싯돌 수","낮에는 연기, 밤에는 횃불을 피워서 나라의 급한 일을 전하던 통신 수단","봉수를 이용해 적이 쳐들어오거나 나라에 위급한 일이 생겼다는 소식을 알리기도 했다."],["편지","片紙","조각 편|종이 지","안부, 소식 등을 적어 보내는 글","옛날 사람들은 편지를 써서 하인이나 심부름꾼을 통해 멀리 있는 사람에게 소식을 전했다."],["파발","擺撥","열 파|다스릴 발","옛날에 파발꾼이 말을 타거나 걸어가서 나라의 급하고 중요한 소식을 전하던 통신 제도","파발은 나라의 중요한 소식을 적은 문서를 사람이 직접 달려가거나 말을 타고 가서 전달하는 방법이었다."],["방","榜","노 저을 방","나라나 지역의 중요한 일을 널리 알리기 위해 사람이 많이 모이는 곳에 써 붙인 글","나라나 지역의 중요한 일을 널리 알리려고 글을 써서 사람들이 많이 모이는 곳에 방을 붙였다."],["전신","電信","번개 전|믿을 신","전기 신호를 이용하여 멀리 떨어진 곳에 소식을 전하는 통신 방법","옛날에는 전신을 이용해 전기 신호로 멀리까지 소식을 빠르게 전했다."],["전화","電話","번개 전|말씀 화","전기를 이용하여 멀리 떨어져 있는 사람과 서로 말을 주고받는 통신 방법","전화가 발명되면서 사람들은 멀리 떨어진 사람과도 목소리를 들으며 대화할 수 있게 되었다."],["무선호출기","無線呼出機","없을 무|줄 선|부를 호|날 출|틀 기","휴대 전화가 널리 이용 되기 전에 많은 사람이 이용한 통신수단으로, 전화번호나 음성 메시지를 남길 수 있음","옛날에는 공중전화나 ‘삐삐’라고 불리는 무선 호출기를 이용하기도 했다."]]},"천재교과서(박기범)":{"1단원":[["인구","人口","사람 인|입 구","한 나라 또는 일정한 지역에 사는 사람의 수","인구가 늘어나거나 줄어들면서 사회의 모습도 변화한다."],["저출산","低出産","낮을 저|날 출|낳을 산","태어나는 아이의 수가 줄어드는 현상","저출산의 영향으로 새로 태어나는 아이의 수가 점점 줄어들고 있다."],["고령화","高齡化","높을 고|나이 령|될 화","전체 인구에서 만 65세 이상의 노인 인구가 차지하는 정도가 늘어나는 현상","노인의 수가 계속 늘어나며 고령화 현상이 나타나고 있다."],["보육","保育","지킬 보|기를 육","어린아이들을 돌보아 기름","우리 지역에는 어린아이를 안전하게 돌보기 위한 보육 시설이 있다."],["육아휴직","育兒休職","기를 육|아이 아|쉴 휴|직분 직","어린 자녀를 돌보기 위해 일하는 부모가 일정 기간 동안 일을 쉴 수 있도록 하는 제도","아버지께서는 어린 동생을 돌보기 위해 회사에 육아휴직을 신청하셨다."],["요양","療養","고칠 료(요)|기를 양","편히 쉬면서 병을 치료함","노인의 건강을 관리하고 돌봄 제공하는 요양 시설이 생겼다."],["세대","世代","인간 세|대신할 대","젊은 세대, 부모 세대처럼 비슷한 나이대의 사람 전체","세대 간에는 서로 이해하고 배려하는 자세가 필요하다."],["인공지능","人工知能","사람 인|장인 공|알 지|능할 능","컴퓨터가 인간처럼 생각하고, 학습하고, 상황을 판단하도록 만드는 기술","오늘날에는 인공지능이 개인별 특징을 파악하여 맞춤 정보를 추천해 준다."],["지능정보화","知能情報化","알 지|능할 능|뜻 정|갚을 보|될 화","수많은 정보를 더욱 빠르고 똑똑하게 처리하는 지능정보 기술이 사회의 다양한 분야에서 널리 활용되는 것","지능정보화가 활발하게 이루어지면서 사람들의 생활이 더욱 편리해지고 있다."],["개인정보","個人情報","낱 개|사람 인|뜻 정|갚을 보","이름, 주소, 전화번호 등 개인을 알아볼 수 있는 정보","지능정보화로 개인정보나 사생활이 침해되는 문제가 발생할 수 있다."],["문화","文化","글월 문|될 화","사람들이 가지고 있는 공통의 생활 방식","문화는 사회 구성원들이 오랜 시간을 함께 생활하며 만들어지고 전해 내려온 것이다."],["이주민","移住民","옮길 이|살 주|백성 민","다른 곳으로 옮겨 가서 사는 사람","일이나 공부, 결혼 등을 하기 위해 우리나라에 사는 외국인 이주민이 늘어나고 있다."],["가구","家口","집 가|입 구","같이 살며 생활하는 사람들로 이루어진 집단","1인 가구가 늘어나면서 혼자 사는 사람들을 위한 1인용 제품이 인기를 얻고 있다."],["비혼","非婚","아닐 비|혼인할 혼","결혼하지 않기로 선택하는 것","비혼을 선택해 혼자 사는 가구가 많아지고 있다."],["반려동물","伴侶動物","짝 반|짝 려|움 직 일 동|물건 물","사람과 함께 살며 친구나 가족처럼 가까이 지내는 동물","최근에는 반려동물과 사는 사람들이 많아지며 반려동물 산업이 빠르게 성장하고 있다."],["편견","偏見","치우칠 편|볼 견","한쪽으로 치우친 의견이나 생각","손으로 음식을 먹는 문화를 이상하게 생각하는 것은 편견이다."],["차별","差別","다를 차|나눌 별","대상을 구별하고 다르게 대우하는 것","우리말을 잘하지 못한다고 해서 그 사람의 말을 무시하는 것은 차별이다."]],"2단원":[["풍습","風習","바람 풍|익힐 습","사람들 사이에 옛날부터 전해 내려오는 습관이나 행동","추석에는 송편을 만들어 먹거나 윷놀이를 하는 등 다양한 풍습을 볼 수 있다."],["명절","名節","이름 명|마디 절","설날이나 추석 등과 같이 옛날부터 해마다 즐기거나 기념하는 날","추석이나 설날과 같은 명절에는 다양한 놀이를 즐긴다."],["투호","投壺","던질 투|병 호","일정한 거리에 큰 항아리를 두고, 편을 나눠 화살을 던져 많이 넣는 편이 이기는 놀이","옛날 사람들은 명절이나 잔칫날에 모여 투호 놀이를 즐겼다."],["세시풍속","歲時風俗","해 세|때 시|바람 풍|풍속 속","옛날부터 전해 내려오는 풍습 중에서 해마다 명절이나 계절에 따른 일정한 시기에 되풀이하는 일, 먹는 음식, 즐기는 놀이","세시 풍속을 통해 옛날 사람들의 생활과 생각을 알 수 있다."],["한식","寒食","찰 한|먹을 식","한 해의 농사를 시작하는 시기로 4월 5일 무렵을 말함","한식에는 하루 동안 불을 사용하지 않고 찬 음식을 먹었다."],["단오","端午","끝 단|낮 오","더위가 시작되는 시기로 음력 5월 5일을 말함","단오에는 나쁜 기운을 쫓으려고 창포물에 머리를 감고, 여름을 시원하게 보내라는 뜻으로 부채를 주고받았다."],["삼복","三伏","석 삼|엎드릴 복","7~8월 중 가장 더운 시기로 첫 번째 복날을 초복, 두 번째 복날을 중복, 세 번째 복날을 말복이라 함","삼복에는 더위를 이겨 내려고 시원한 냇가로 놀러 가거나 몸에 좋은 음식을 먹었다."],["추석","秋夕","가을 추|저녁 석","곡식과 과일을 수확할 시기인 음력 8월 15일을 말함","추석에는 조상에게 감사하는 마음을 담아 햇과일과 햇곡식으로 차례를 지내고 강강술래, 씨름을 즐겼다."],["동지","冬至","겨울 동|이를 지","일 년 중 밤이 가장 긴 날인 12월 22일 무렵","동지에는 붉은 팥이 나쁜 기운을 쫓는다고 생각하여 팥죽을 만들어 먹거나 팥을 집의 대문이나 벽에 뿌리기도 했다."],["민속촌","民俗村","백성 민|풍속 속|마을 촌","옛날 사람들이 살던 모습을 그대로 되살려 놓은 곳","오늘날에는 명절이나 계절이 아니어도 민속촌, 지역 축제 장소 등에서 세시 풍속을 즐길 수 있다."],["교통","交通","사귈 교|통할 통","사람이 이동하거나 물건을 옮기는 일","교통은 사람이 이동하거나 물건을 옮기는 일이다."],["교통수단","交通手段","사 귈 교|통할 통|손 수|조 각 단","사람이 이동하거나 물건을 옮길 때 사용하는 도구나 수단","오늘날에는 자동차, 버스, 기차, 배, 비행기 등 다양한 교통수단을 이용한다."],["교통로","交通路","사귈 교|통할 통|길 로","교통에 이용하는 길","도로, 철도, 바닷길, 하늘길 등 다양한 교통로를 이용해 사람과 물건이 이동한다."],["의사소통","意思疏通","뜻 의|생각 사|소 소통할|통할 통","서로의 생각이나 뜻을 주고받는 것","우리는 편지, 전화, 인터넷 등을 ","自然災害","스스로 자|그럴 연|재앙 재|해칠 해","자연현상으로 생기는 큰 피해","자연재해가 일어났을 때 지역 간 도움의 중요성을 알아본다."],["자원봉사","自願奉仕","스스로 자|원할 원|받들 봉|섬길 사","스스로 나서서 돕는 활동","자원봉사에 참여하여 자연재해 피해 복구를 돕는다."],["생필품","生必品","날 생|반드시 필|물건 품","살아가는 데 꼭 필요한 물건","자연재해가 일어났을 때 생필품을 지원한다."]]},"천재교과서(김정인)":{"1단원":[["지도","地圖","땅 지|그림 도","위에서 내려다본 땅의 실제 모습을 일정한 약속에 따라 줄여서 나타낸 것","지도는 위치, 거리 등의 다양한 정보를 정확하게 전달하려고 정해진 규칙에 따라 만든다."],["위치","位置","자리 위|둘 치","사람, 사물 등이 일정한 곳 에 차지하고 있는 장소","학교의 위치를 지도에서 찾아 본다."],["항공사진","航空寫眞","배 항|빌 공|베낄 사|참 진","비행 중인 항공기에서 땅의 모습을 찍은 사진","항공사진은 땅의 모습을 있는 그대로 보여준다."],["방위","方位","모 방|자리 위","동·서·남·북과 같은 방향의 위치","방향의 위치인 방위는 방위표 로 나타낸다."],["방위표","方位表","모 방|자리 위|겉 표","방위를 나타내는 표시","지도에 방위표가 없다면 지도 의 오른쪽이 동쪽, 왼쪽이 서쪽, 아래쪽이 남쪽, 위쪽이 북쪽이라 고 약속한다."],["기호","記號","기록할 기|이름 호","땅의 생김새나 건물, 도로 등을 지도에 약속대로 간단히 나타낸 표시","기호는 지도에 담긴 정보를 쉽게 알아볼 수 있도록 도와준다."],["범례","凡例","무릇 범|법식 례","지도에 쓰인 기호와 그 뜻","지도에 쓰인 기호와 그 뜻은 범례로 나타낸다."],["축척","縮尺","줄일 축|자 척","지도에서 실제 거리를 줄인 정도","축척을 보면 실제 거리를 얼마 나 줄여서 나타낸 지도인지 알 수 있다."],["등고선","等高線","무리 등|높을 고|줄 선","지도에서 높이가 같은 곳끼리 연결하여 이은 선","지도에서는 높고 낮은 땅의 실 제 모습을 평면에 나타내기 위해 등고선을 사용한다."],["평면도","平面圖","평평할 평|낯 면|그림 도","물체를 바로 위에서 내려다 본 그림","평면도는 물체를 바로 위에서 내려다본 그림을 말하고, 단면도 는 물체를 위에서 아래 방향으로 똑바로 잘랐을 때 그 안의 생김 새를 나타낸 그림을 말한다."],["단면도","斷面圖","끊을 단|낯 면|그림 도","물체를 위에서 아래 방향으 로 똑바로 잘랐을 때 그 안의 생김새를 나타낸 그림",""],["약도","略圖","다스릴 략(약)|그림 도","필요한 내용만 간략하게 나 타낸 지도","친구가 그려 준 약도를 보고 도서관을 쉽게 찾아갔다."],["노선도","路線圖","길 로(노)|줄 선|그림 도","지하철이나 버스와 같은 대 중교통의 경로를 알려 주는 지도","지하철 노선도를 보고 어느 역 에서 갈아타야 하는지 확인했다."],["안내도","案內圖","책상 안|안 내|그림 도","알리고자 하는 내용을 자세 히 표시한 지도","건물에 있는 피난 안내도를 살 펴보고, 피난 동선을 확인해 두 면 위급 상황에서 안전하게 대피 할 수 있다."],["최남단","最南端","가장 최|남녘 남|끝 단","어떤 지역에서 남쪽의 맨 끝","대한민국 최남단비 앞에서 기 념사진을 찍었다."],["행정구역","行政區域","다닐 행|정사 정|구분할 구|지경 역","나라를 효율적으로 관리하 려고 나눈 지역","행정구역이 나타난 지도에서 우리 지역(시·군·구)의 위치를 찾을 수 있다."],["면적","面積","낯 면|쌓을 적","어떤 지역의 넓이","지역의 면적은 행정구역의 변 화에 따라 조금씩 달라지기도 한 다."],["인구","人口","사람 인|입 구","일정 지역에 사는 사람의 수","지역의 인구는 출생이나 사망, 이사 등에 따라 늘어나기도 하고 줄어들기도 한다."],["통계 연보","統計年報","거느릴 통|셀 계|해 년(연)|알릴 보","1년에 한 번씩 한 해 동안 수집한 통계 자료를 종합해 펴낸 책","우리 지역의 면적과 인구는 시· 군·구청에서 발행하는 안내 책 자나 지역 누리집의 소개 및 통 계 연보 등을 참고해 조사한다."],["통계","統計","거느릴 통|셀 계","수집된 자료를 한눈에 알아보 기 쉽게 일정한 규칙에 따라 숫 자로 나타낸 것","지역의 면적과 인구를 나타내 는 통계 자료를 살펴본다."],["지형","地形","땅 지|모양 형","땅의 생김새","지형은 지역에 따라 서로 비슷하 기도 하고, 다르기도 하다."],["기온","氣溫","기운 기|따뜻할 온","대기(공기)의 온도","기온은 크게 계절의 흐름에 따라 변하지만, 계절이 같아도 지역에 따라 기온이 다르게 나타난다."],["강수량","降水量","내릴 강|물 수|헤아릴 량","일정한 지역에 일정 기간 비, 눈 등으로 내린 물의 양을 모두 합한 것","강수량은 계절과 지역에 따라 다르게 나타난다."],["지리 정보","地理情報","땅 지|리 다 스 릴|뜻 정|알 릴 보","위치, 면적, 인구, 지형, 기온, 강수량 등과 같이 어떤 장소나 지역의 특성을 알려 주는 지식 과 정보","우리 지역의 지리 정보를 조사 한 내용을 살펴보면 지역의 특징 을 종합적으로 파악할 수 있다."],["관광","觀光","볼 관|빛 광","다른 지역이나 나라에 가서 그 곳의 풍경, 문화 등을 구경하는 것","우리 지역에서 어린이들이 좋아할 만한 장소를 찾아 관광 지도로 만들어 보다."]],"2단원":[["국가유산","國家遺產","나라 국|집 가|남길 유|낳을 산","옛날 사람들의 생활 모습을 알 려주는 것 중 후손들에게 물려 줄 만한 가치가 있는 것","남한산성과 김장 문화는 후손 들에게 물려줄 만한 가치가 있는 우리나라의 국가유산이다."],["문화유산","文化遺產","글월 문|될 화|남길 유|낳을 산","그림이나 책, 건물처럼 형태가 있는 국가유산","옛사람들이 돌로 만든 무덤인 강화 고인돌은 문화유산이다."],["무형유산","無形遺產","없을 무|모양 형|남길 유|낳을 산","음악이나 춤, 연극, 기술 등과 같이 형태가 없는 국가유산","강강술래는 여러 사람이 손을 잡고 둥글게 모여 노래하며 춤추 는 놀이로, 무형유산이다."],["목판","木版","나무 목|판목 판","책을 인쇄하려고 나무에 글씨 를 새긴 것","합천 해인사 대장경판은 외적 의 침입을 막으려고 만든, 부처 님의 말씀이 적힌 목판이다."],["서원","書院","글 서|집 원","조선 시대에 지방에 세운 사립 학교","도산 서원, 하회 마을 등의 안내 판에 ‘어린이용 설명 큐아르 (QR) 코드’를 붙였다."],["순수비","巡狩碑","돌 순|사냥할 수|비석 비","왕이 직접 다녀간 것을 기념한 비석","서울 북한산 순수비는 진흥왕 이 오늘날의 서울 지역을 차지한 뒤, 이곳을 방문한 것을 기념하 여 세운 비석이다."],["거중기","擧重器","들 거|무거울 중|그릇 기","작은 힘으로 무거운 물건을 들어 올리는 장치","거중기는 산에서 캐낸 무거운 돌 을 수레에 실어 올리는 역할을 했다."],["녹로","轆轤","도르래 록(녹)|도르래 로","무거운 물건을 높이 들어 올리는 장치","녹로는 수원화성의 성벽을 쌓 을 때 사용했다."],["훼손","毀損","헐 훼|덜 손","헐거나 깨뜨려 못 쓰게 만듦","훼손이 심한 국가유산은 과학적 인 방법으로 복원한다."],["복원","復元","회복할 복|으뜸 원","원래대로 회복함",""],["박물관","","","",""],["기념관","紀念","벼리 기|생각 념|집 관","과거의 뜻깊은 사건이나 훌륭한 인물 등을 오랫동안 잊지 않고 마음에 간직하기 위해 세운 곳","기념관은 사건이나 인물과 관련 된 다양한 자료를 보관, 전시하고 있다."],["유적지","遺跡地","남길 유|발자취 적|땅 지","옛날 사람들이 남긴 흔적 중에서 형태가 크고 위치를 옮길 수 없는 곳","유적지에는 동굴, 패총, 무덤, 집터, 궁궐터 등이 있다."],["유물","遺物","남길 유|물건 물","옛날 사람들이 남긴 물건으 체험할 수 있다."]],"3단원":[["환경","環境","고리 환|지경 경","우리 주변을 둘러싸고 있는 모든 것","환경에는 자연환경과 인문환경이 있다."],["자연환경","自然環境","스스로 자|그럴 연|고리 환|지경 경","산, 들, 눈, 비 등 사람이 만들지 않은 자연 그대로의 환경","자연환경에는 산, 들, 하천, 바다와 같은 땅의 생김새와 날씨에 영향을 주는 눈, 비, 바람, 기온 등이 있다."],["인문환경","人文環境","사람 인|글월 문|고리 환|지경 경","과수원, 공원, 도로 등 사람이 만든 환경","인문환경에는 논과 밭, 과수원, 공원, 도로, 다리, 공장, 건물, 항구 등이 있다."],["양식장","養殖場","기를 양|불릴 식|마당 장","사람의 힘을 이용해 물고기나 김 등을 기르는 곳","바닷가에 있는 지역에서는 양식장을 볼 수 있다."],["항구","港口","항구 항|입 구","배가 안전하게 드나들도록 강가나 바닷가에 배가 들어오는 입구를 만들어 놓은 곳","우리 지역에는 배가 드나드는 항구가 있다."],["휴양림","休養林","쉴 휴|기를 양|수풀 림","편안히 쉬면서 몸과 마음을 보양할 목적으로 조성한 숲","산이 많은 지역에서는 휴양림을 볼 수 있다."],["산지촌","山地村","메 산|땅 지|마 을 촌","주로 버섯, 약초 등을 기르거나 목장에서 소, 양 등을 키우는 일을 하는 사람들이 모여 산지에 이루어진 마을","우리 지역은 산속이나 산비탈에서 작물을 재배하거나 나무를 심고 기르는 산지촌이다."],["농촌","農村","농사 농|마 을 촌","대부분의 주민들이 농사일을 하며 사는 마을","우리 지역은 사람들 대부분이 넓은 들에서 농작물을 재배하는 농촌이다."],["어촌","漁村","고기 잡을 어|마 을 촌","물고기 잡는 일을 직업으로 하는 사람들이 모여 사는 바닷가 마을","우리 지역은 작은 고기잡이배가 드나드는 조용한 어촌이다."],["간척","干拓","방패 간|넓힐 척","얕은 바다를 막고 물을 뺀 뒤, 땅으로 만드는 일","지역을 개발하려고 바다를 메우는 간척 사업을 하였다."],["도시","都市","도읍 도|저자 시","많은 사람이 모여 살고 정치, 경제, 사회, 문화 활동의 중심이 되는 곳","도시에는 높은 건물이 많고 공공기관, 회사, 은행, 백화 점, 상가 등이 모여 있다."],["인구","人口","사람 인|입 구","일정한 지역에 사는 사람의 수","서울특별시는 우리나라의 수도로 우리나라에서 인구가 가장 많은 도시이다."],["산업","産業","낳을 산|업 업","사람들이 생활하는 데 필요한 것을 얻거나 만들어 내는 모든 활동","도시에는 다양한 산업이 발달해 있다."],["제조업","製造業","지을 제|지을 조|업 업","자동차, 전자 제품, 의류 등 공장에서 다양한 제품을 생산하는 산업","우리 지역에서는 자동차와 전자 제품을 만드는 제조업이 발달했다."],["첨단산업","尖端産業","뾰족할 첨|끝 단|낳을 산|업 업","우주 개발, 컴퓨터 등과 같이 첨단 기술을 핵심으로 하는 산업","최근 우리 지역에는 인공지능과 로봇 기술을 연구하는 첨단 산업 단지가 들어서고 있다."],["도시문제","都市問題","도읍 도|저자 시|물을 문|제목 제","주택 문제, 교통 문제, 환경 문제, 범죄 문제 등 도시에서 나타나는 여러 가지 문제","도시에는 많은 사람이 모여 살기 때문에 여러 가지 도시 문제가 나타난다."]]},"아이스크림미디어":{"1단원":[["민주주의","民主主義","백성 민|임금 주|임금 주|옳을 의","구성원들의 다양한 의견을 반영하여 사회 공동의 문제에 관한 의사 결정을 하는 방식","민주주의 사회에서는 모든 구성원이 자신의 의견을 제시하고 자유롭게 행동할 수 있다."],["자치","自治","스스로 자|다스릴 치","자기 일을 스스로 다스림","학생들은 학생 자치회 임원 선거에 참여하며 건전한 학생 자치 문화를 배운다."],["예산","豫算","미리 예|셈 산","어떠한 일을 하기 위해 필요한 돈을 미리 계획해 둔 것","지역 주민들은 지역에 필요한 예산을 세우는 일에 참여할 수 있다."],["주민자치","住民自治","살 주|백성 민|스스로 자|다스릴 치","주민이 지역의 주인으로서 지역의 일에 참여하여 함께 문제를 해결해 나가는 것","지역 주민들은 주민자치 활동에 적극적으로 참여한다."],["세대","世代","인간 세|대신할 대","같은 시대에 사는 비슷한 연령층의 사람들","주민 자치회를 통해 어린이부터 어르신까지 다양한 세대가 모여 의견을 나눈다."],["공공기관","公共機關","공평할 공|함께 공|틀 기|관계할 관","주민 전체의 이익을 위해 국가나 지방 자치 단체가 세워 관리하는 곳","지역 주민들은 지역의 일에 관한 의견을 다른 주민이나 공공기관에 전달하기도 한다."],["면담","面談","낯 면|말씀 담","서로 만나서 이야기하거나 의견을 나눔","지역의 문제를 알아보기 위해 주민자치에 참여하는 지역 주민을 면담했다."],["역사","歷史","지날 력(역)|역사 사","옛날부터 지금까지 사람들이 살아오면서 겪은 일과 사회가 변해 온 과정 또는 그 기록","우리 지역의 유적지를 살펴보면 옛날 사람들의 생활과 지역의의 역사를 알 수 있다."],["문화","文化","글월 문|될 화","한 사회의 사람들이 지닌 공통의 생활양식","광주 비엔날레와 충장 축제는 많은 사람이 참여하는 우리 지역의 문화 행사이다."],["생산물","生產物","날 생|낳을 산|물건 물","어떤 지역에서 사람의 힘이나 기술로 직접 만들어 내거나 땅에서 키워낸 물건과 농산물","무등산 수박은 광주의 대표적인 생산물 중 하나이다."],["의병","義兵","옳을 의|병사 병","백성이 국가나 자기 고장을 지키려고 스스로 만든 군대","백성들은 스스로 의병을 일으켜 나라를 지켰다."],["축제","祭","빌 축|제사 제","축하하는 의미로 벌이는 큰 규모의 행사","지역 사람들은 지역에 전해 내려오는 역사를 보존하고 알리기 위해 축제를 연다."],["박람회","博覽會","넓을 박|볼 람|모일 회","여러 가지 산업 제품, 유물, 기술, 문화 작품 등을 한자리에 모아 벌여 놓고 소개하는 큰 규모의 전시회","지역에서는 생산물을 널리 알리기 위해 박람회를 연다."]],"2단원":[["지역문제","地域問題","땅 지|지경 역|물을 문|제 목 제","지역 주민의 생활을 불편하게 하거나 지역 주민들 사이에 갈등을 일으키는 문제","지역 문제는 각 지역의 상황에 따라 다르게 나타난다."],["설문조사","設問調査","베풀 설|물을 문|고를 조|조사할 사","어떤 주제에 대해 여러 사람의 생각, 의견, 행동 등을 알아보기 위해 문제를 내어 묻는 조사","우리 반은 해결하고 싶은 지역 문제를 정하려고 설문조사를 하였다."],["원인","原因","근원 원|인할 인","어떤 일이 일어나게 된 바탕이나 까닭이 되는 일이나 사건","지역 문제와 관련 있는 다양한 자료를 분석하여 문제가 일어난 원인을 찾는다."],["결과","結果","맺을 결|실과 과","원인으로 생기는 결말","주차 장소가 아닌 곳에 주차를 한 결과 불법 주차 문제가 생겼다."],["해결방안","解決方案","풀 해|결단할 결|모 방|책상 안","어떤 일을 처리하거나 해결하여 나갈 방법이나 계획","지역의 문제의 해결 방안을 찾기 위해 다양한 의견을 제시한다."],["자연환경","自然環境","스스로 자|그럴 연|고리 환|지경 경","인간 생활을 둘러싸고 있는 자연적인 모든 환경 (자연 그대로 생겨난 것)","광주천과 무등산은 아름다운 경관을 자랑하는 광주의 대표적인 자연환경이다."]],"3단원":[["자연환경","自然環境","스스로 자|그럴 연|고리 환|지경 경","인간 생활을 둘러싸고 있는 자연적인 모든 환경 (자연 그대로 생겨난 것)","산, 바다와 같은 지형과 눈, 비, 바람 등 날씨에 영향을 주는 것은 자연환경에 속한다."],["하천","河川","물 하|내 천","빗물과 지하수가 낮은 곳으로 흘러가며 만든 크고 작은 물줄기","하천은 자연환경에 속한다."],["인문환경","人文環境","사람 인|글월 문|고리 환|지경 경","사람들이 만든 환경","논과 밭, 항구, 건물, 목장, 도로 등은 사람들이 만든 것이므로 인문환경에 속한다."],["저수지","貯水池","쌓을 저|물 수|못 지","물을 모아 두어 필요할 때 사용할 수 있게 해 둔 시설","들이 펼쳐진 지역에서는 하천이나 저수지 가까이에 만든 논과 밭을 볼 수 있다."],["양식장","養殖場","기를 양|불릴 식|마당 장","사람의 힘을 이용해 물고기나 김 등을 기르는 곳","바다가 있는 지역에서는 양식장을 볼 수 있다."],["항구","港口","항구 항|입 구","배가 안전하게 드나들도록 강가나 바닷가에 배가 들어오는 입구를 만들어 놓은 곳","우리 지역에는 큰 항구가 있다."],["원료","原料","근원 원|헤아릴 료","어떤 물건을 만드는 데 들어가는 재료","사람들은 배를 이용해 원료와 제품을 실어 나른다."],["공업","工業","장인 공|업 업","원료를 이용해 생활에 필요한 물건을 만드는 일","바다가 있는 지역에서는 배를 만들거나 제품을 생산하는 공업이 발달하기도 한다."],["산사태","山沙汰","메 산|모래 사|일 태","산에 있던 바위나 흙이 갑자기 무너져 내리는 현상","비가 많이 내리면 산림이 줄어든 곳에 산사태가 일어날 위험이 커진다."],["삼림","山林","메 산|수풀 림","산과 숲, 또는 그곳에 자라는 나무와 풀을 통틀어 이르는 말","산림이 훼손되면 산사태가 발생할 위험이 커진다."],["훼손","毀損","헐 훼|덜 손","헐거나 깨뜨려 못 쓰게 만듦","산을 무분별하게 개발하면 자연환경이 훼손되어 생태계가 파괴된다."],["생태통로","生態通路","날 생|모습 태|통할 통|길 로","야생 동물이 자유롭게 이동하도록 도로나 철도 위에 다리를 놓거나 아래로 굴을 파서 마련한 길","야생 동물이 안전하게 지나갈 수 있도록 생태통로를 만들었다."],["생태하천","生態河川","날 생|모습 태|물 하|내 천","다양한 하천 생물이 잘 보존되어 있는 하천","개발로 훼손되거나 오염된 하천을 생태 하천으로 되살린다."],["편의시설","便宜施設","편할 편|마땅 의|베풀 시|베풀 설","사람들의 생활에 편리함을 주는 시설","도시에는 편의 시설이 잘 갖추어져 있다."],["도시","都市","도읍 도|저자 시","많은 인구가 모여 살면서 정치, 경제, 사회 활동의 중심이 되는 곳","도시에는 많은 사람이 모여 살고 높은 건물이 많다."],["산업","産業","낳을 산|업 업","사람들이 생활하는 데 필요한 것을 얻거나 만들어 내는 모든 활동","도시에는 다양한 산업이 발달했다."],["대기오염","大氣汚染","클 대|기운 기|오 더 러 울|물들 염","자동차나 공장에서 나오는 매연, 먼지, 일산화탄소 같은 나쁜 물질이 공기와 섞여서 공기가 더러워지는 현상","자동차에서 나오는 매연은 대기 오염을 일으킨다."],["수질오염","水質汚染","물 수|바탕 질|오 더 러 울|물들 염","공장 폐수나 쓰레기 등으로 인해 강, 호수, 바다 등의 물이 더러워지는 현상","우리 지역의 강이 수질 오염으로 해를 입지 않도록 깨끗하게 보호해야 한다."],["토양오염","土壤汚染","흙 토|양 흙덩이|오 더 러 울|물들 염","사람이나 동식물에 해로운 중금속이나 화학 물질이 흙에 쌓여 땅이 더러워지는 현상","무분별하게 버린 쓰레기와 화학 농약은 토양 오염의 원인이 된다."]]},"천재교과서(김정인)":{"1단원":[["자유","自治","스스로 자|다스릴 치","자신의 바람과 의지에 따라 결정하고 행동하는 것","공동의 문제를 해결할 때 누구나 자유롭게 의견을 말할 수 있다."],["평등","平等","평평할 평|무리 등","모든 사람이 성별, 재산, 종교 등을 이유로 차별받지 않고 동등하게 대우받는 것","학급 임원 선거에서는 모든 학생이 평등하게 한 표씩 투표할 권리가 있다."],["민주주의","民主主義","백성 민|임금 주|임금 주|옳을 의","모든 사람이 자유롭고 평등한 입장에서 서로의 의견을 모아 의사를 결정하는 방식","학급 회의에서 민주주의 방식에 따라 학생 모두의 의견을 모아 학급 생활 규칙을 정하였다."],["선거","選擧","가릴 선|들 거","투표를 통해 여러 후보들 중에서 적절한 대표자를 뽑는 일","학교에서는 선거를 통해 학교와 학급을 대표할 사람을 뽑는다."],["공약","公約","공평할 공|맺을 약","후보자가 어떤 일을 실행하겠다고 하는 약속","후보자들은 공약을 발표하며 자신을 뽑아 달라는 연설을 한다."],["개표","開票","열 개|표 표","투표함을 열고 투표의 결과를 검사하는 것","후보자 투표가 끝나고 개표를 시작했다."],["학교자치","學校自治","배울 학|학교 교|스스로 자|다스릴 치","학교의 구성원들이 뜻을 모아 학교의 일을 스스로 결정하고 문제를 해결하는 것","친구들과 학교생활 규칙을 정하고 실천하는 일은 학교 자치에 해당한다."],["협의","協議","화합할 협|의논할 의","둘 이상의 사람이 서로 협력하여 논의함","문제를 해결할 방법을 찾을 때는 서로 양보하고 협의하는 태도가 필요하다."],["대화","對話","대할 대|말씀 화","마주 대하여 이야기를 주고받음. 또는 그 이야기","학급의 문제에 대해 친구들과 대화하며 서로의 생각을 주고받았다."],["토론","討論","칠 토|논할 론","어떤 문제에 대하여 여러 사람이 각각 의견을 말하며 논의함","학급에서 디지털 기기 사용 규칙을 정하기 위해 찬성과 반대 의견으로 나누어 토론했다."],["인정","認定","알 인|정할 정","어떤 사실이나 의견이 옳거나 타당하다고 받아들이는 것","친구의 의견이 나와 다르더라도 그 생각이 옳을 수 있음을 인정해야 한다."],["양보","讓步","사양할 양|걸음 보","서로 의견이나 생각이 다를 때 자신의 주장을 조금 줄이고 상대방의 의견을 받아들이는 것","학급 회의에서 서로 조금씩 양보하여 모두가 받아들일 수 있도록 의견을 조정했다."],["다수결","多數決","많을 다|셈 수|결단할 결","다수의 의견이 소수의 의견보다 합리적일 것이라 생각하고 다수의 의견에 따라 결정하는 방식","학급 회의에서 의견이 하나로 모이지 않아 다수결로 결정했다."],["합리적","合理的","합할 합|다 스 릴 리|과녁 적","이론이나 이치에 꼭 알맞음","여러 사람의 의견을 비교하여 모두에게 도움이 되는 합리적인 방법을 선택했다."],["주민자치","住民自治","살 주|백성 민|스스로 자|다스릴 치","지역 주민들이 공동의 문제를 함께 해결하고 지역사회를 스스로 운영해 나가는 것","우리 지역의 문제를 스스로 해결하기 위해 주민들은 주민자치 활동에 참여했다."],["지역사회","地域社會","땅 지|지경 역|모일 사|모일 회","지역의 일정한 범위 안에서 자연스럽게 이루어진 생활 공동체","지역사회에서 다양한 사람들이 모여 살다 보면 갈등과 문제가 발생할 수 있다."],["공청회","公聽會","공평할 공|들을 청|모일 회","어떤 일을 결정하기 전에 여러 사람의 의견을 듣기 위해 여는 회의","우리 지역에 새로운 공원을 만드는 것에 대한 주민들의 의견을 듣기 위해 공청회를 열었다."],["조례","條例","가지 조|법식 례","지역의 어떤 일을 처리하기 위해 지방 자치 단체가 만드는 법","주민들은 지역에 필요한 조례를 직접 제안하였다."],["예산","豫算","미리 예|셈 산","국가나 단체에서 보통 1년 동안의 수입과 지출을 미리 셈하여 정한 계획","주민들은 우리 지역의 예산을 어떻게 사용할지 결정하는 과정에 직접 참여해 의견을 냈다."],["주민참여","住民參與","살 주|백성 민|참여할 참|더불 여","지역의 문제를 해결하거나 중요한 일을 결정하는 과정에 주민이 직접 의견을 내고 함께하는 것","우리 지역의 환경 문제를 해결하기 위해 많은 주민이 주민 참여 활동에 나섰다."],["시민단체","市民團體","저자 시|백성 민|둥 글 단|몸 체","시민들이 개인의 이익이 아니라, 사회 전체의 이익을 위해 자발적으로 모임을 갖고 활동하는 단체","주민들은 지역의 문제를 해결하기 위하여 시민단체에 가입하여 활동에 참여했다."]],"2단원":[["지역문제","地域問題","땅 지| ,"넉 사|계절 계|마디 절","봄, 여름, 가을, 겨울의 네 철","우리나라는 봄, 여름, 가을, 겨울의 사계절이 비교적 뚜렷하다."],["자연재해","自然災害","스스로 자|그럴 연|재앙 재|해칠 해","급격한 자연현상이 사람들의 생명과 재산에 피해를 주는 것","태풍, 홍수와 같은 자연재해가 발생하면 인명 및 재산 피해가 커진다."],["황사","黃砂","누를 황|모래 사","중국이나 몽골의 사막에서 발생한 모래 먼지가 바람을 타고 우리나라로 날아와 가라앉는 현상","봄철에는 황사가 자주 나타난다."],["폭염","暴炎","사나울 폭|불꽃 염","매우 심한 더위","여름에는 폭염에 대비해야 한다."],["태풍","颱風","태풍 태|바람 풍","강한 비바람을 동반한 큰 폭풍","여름철에는 태풍 피해가 발생하기도 한다."],["열대야","熱帶夜","더울 열|띠 대|밤 야","밤이 되어도 기온이 25℃ 이상으로 무더위가 지속되는 현상","여름에는 밤이 되어도 기온이 떨어지지 않는 열대야 현상이 나타난다."],["대설","大雪","큰 대|눈 설","겨울철 한꺼번에 많은 눈이 내리는 현상","대설 주의보가 내렸다."],["내륙","內陸","안 내|뭍 륙","바다에서 멀리 떨어져 있는 육지","우리나라 내륙 지역에서는 겨울 날씨로 하천이 얼어 생긴 얼음 위에서 썰매를 즐기기도 한다."],["기온","氣溫","기운 기|따뜻할 온","공기의 따뜻하고 차가운 정도","우리나라는 여름에 기온이 높고 겨울에 기온이 낮다."],["강수량","降水量","내릴 강|물 수|헤아릴 량","비, 눈, 우박 등이 일정 기간 동안 일정한 곳에 내린 물의 총량","우리나라의 강수량은 세계 평균보다 많다."],["기후변화","氣候變化","기운 기|기후 후|변할 변|될 화","여러 가지를 원인으로 기온, 강수량 등 현재의 기후가 점차 변하는 현상","기후변화로 이상 기후 현상 및 자연재해가 자주 발생한다."],["지구온난화","地球溫暖化","땅 지|공 구|따뜻할 온|따뜻할 난|될 화","지구의 기온이 높아지는 현상","지구 온난화가 점점 심해져 전 세계적으로 기후변화가 나타나고 있다."],["인구","人口","사람 인|입 구","일정한 지역에 사는 사람 수","우리나라 인구의 변화를 알아본다."],["인구분포","人口分布","사람 인|입 구|나눌 분|펼 포","어느 곳에 얼마나 많은 사람이 살고 있는지를 나타낸 것","우리나라의 인구분포는 수도권에 집중되어 있다."],["인구밀도","人口密度","사람 인|입 구|밀 빽빽할|법도 도","일정한 넓이(1㎢) 안에 살고 있는 사람 수","대도시는 인구밀도가 높다."],["수도권","首都圈","머리 수|도읍 도|우리 권","한 나라의 수도를 중심으로 이루어진 대도시권을 말함 우리나라의 수도권은 서울특별시와 그 주변인 인천광역시, 경기도를 말함","우리나라 총인구의 절반 이상이 수도권에 모여 살고 있다."],["불균형","不均衡","아닐 불|고를 균|저울대 형","어느 편으로 치우쳐 고르지 않음","수도권에 인구가 몰리면서 인구 불균형 문제가 나타난다."],["고령화","高齡化","높을 고|나이 령|될 화","나라나 지역의 전체 인구 중 노인(65세 이상)이 차지하는 비율이 높아지는 현상","비수도권의 청년들이 일자리를 찾아 수도권으로 이동하며 고령화 현상이 심화되고 있다."],["생필품","生必品","날 생|반드시 필|물건 품","음식, 옷, 생활 도구, 약 등 일상생활에 반드시 있어야 할 것","비수도권의 일부 지역은 인구 감소로 주변 마트가 문을 닫아 생필품을 구하지 못하기도 한다."]],"3단원":[["법","法","법 법","한 국가의 구성원이라면 반드시 지켜야 하는 사회 규범","우리는 법을 잘 지켜야 한다."],["권리","權利","권세 권|이로울 리","사람이 마땅히 누릴 수 있는 이익이나 자유","모든 사람은 인간으로서 존중받을 권리를 가진다."],["질서","秩序","차례 질|차례 서","혼란 없이 순조롭게 이루어지게 하는 사물의 순서나 차례","법은 사회 질서를 유지하는 역할을 한다."],["헌법","憲法","법 헌|법 법","국가 통치 체제의 가장 기본이 되는 우리나라 최고법","모든 법은 헌법을 바탕으로 만들어진다."],["인권","人權","사람 인|권세 권","사람이라면 누구나 가지는 소중한 권리","인권은 사람이라면 누구나 가지는 소중한 권리이다."],["침해","侵害","침노할 침|해할 해","침범하여 해를 끼침","성별이나 나이, 신체적 특징, 피부색 등을 이유로 차별하는 것은 인권 침해에 해당한다."],["편견","偏見","치우칠 편|볼 견","공정하지 못하고 한쪽으로 치우친 생각","인권을 보호하려면 나와 다른 사람의 차이를 인정하고 편견을 버려야 한다."],["고정관념","固定觀念","굳을 고|정할 정|볼 관|생각 념","잘 변하지 않는, 주된 행동을 결정하는 확고한 의식이나 관념","성별이나 나이에 따른 고정관념은 특정 집단의 사회 활동을 제한할 수 있다."]]},"아이스크림미디어":{"1단원":[["국토","國土","나라 국|흙 토","한 나라의 모든 땅","우리나라 국토의 특징을 알아 본다."],["지형","地形","땅 지|모양 형","다양한 땅의 생김새","우리나라의 지형을 살펴보다."],["산지","山地","뫼 산|땅 지","높이 솟은 산들이 모여 이룬 지형","산지는 산봉우리가 길게 이어져 산맥을 이루기도 한다."],["하천","河川","물 하|내 천","물이 흐르며 만든 크고 작은 물줄기","하천은 동쪽에서 서쪽으로 흐른다."],["평야","平野","평평할 평|들 야","평평하고 낮은 땅이 넓게 펼쳐진 곳","평야는 하천 주변에 주로 발달한다."],["해안","海岸","바다 해|언덕 안","바다와 육지가 맞닿아 있는 부분","해안에는 갯벌, 모래사장 등 다양한 지형이 나타난다."],["산맥","山脈","뫼 산|줄기 맥","산봉우리가 길게 이어져 이룬 지형","우리나라 지도에서 산맥을 찾아본다."],["분포","分布","나눌 분|펼 포","여러 곳에 퍼져 있는 상태","우리나라의 북동쪽에는 높고 험한 산지가 주로 분포한다."],["위치","位置","자리 위|둘 치","어떤 곳이 있는 자리","여행지의 위치를 지도에 표시 하다."],["중요성","重要性","무거울 중|중요할 요|성품 성","중요한 가치나 의미","우리나라 국토의 아름다움과 생태 환경의 중요성을 느끼다."],["독도","獨島","홀로 독|섬 도","우리나라 동쪽 끝에 있는 섬","소중한 우리 땅 독도를 알아 보다."],["경관","景觀","볕 경|볼 관","눈에 보이는 자연의 모습","독도에는 경관이 아름답고 독특한 지형이 많다."],["자원","資源","재물 자|근원 원","생활에 도움이 되도록 쓸 수 있는 것","독도 바다 밑바닥에는 미래의 에너지 자원으로 주목받는 가스 하이드레이트가 묻혀있다."]],"2단원":[["기후","氣候","기운 기|기후 후","오랜 기간 한 지역에서 나타나는 평균적이며 종합 적인 대기 상태","오랜 기간 한 지역에서 나타 나는 평균적이며 종합적인 대기 상태를 기후라고 한다."],["대기","大氣","큰 대|기운 기","공기를 달리 이르는 말","짧은 시간 동안의 대기 상태를 날씨라고 한다."],["상태","狀態","형상 상|모습 태","겉으로 드러나는 모습이나 형편","대기 상태를 확인하다."],["기온","氣溫","기운 기|따뜻할 온","공기의 따뜻하고 차가운 정도","우리나라는 계절에 따라 기온 차이가 크다."],["강수","降水","내릴 강|물 수","비, 눈, 우박 따위가 땅에 내린 물","강수의 특징을 살펴본다."],["강수량","降水量","내릴 강|물 수|헤아릴 량","비, 눈, 우박 등이 일정 기간 동안 일정한 곳에 내 린 물의 총량","우리나라의 강수량은 세계 평균보다 많다."],["계절","季節","계절 계|마디 절","봄·여름·가을·겨울처럼 한 해를 나눈 시기","계절에 따라 다른 기후는 사 람들의 옷차림이나 식생활에 영향을 준다."],["영향","影響","그림자 영|울릴 향","어떤 일에 작용하여 변화를 일으키는 힘","기후가 사람들의 생활에 미치는 영향을 알아본다."],["자연재해","自然災害","스스로 자|그럴 연|재앙 재|해할 해","사람들의 생명과 재산에 피해를 주는 자연현상","홍수, 가뭄, 폭설과 같은 자연 재해의 종류를 조사하다."],["현상","現象","나타날 현|모양 상","눈앞에 나타나는 일이나 모습","자연재해와 관련된 현상을 알아본다."],["기후변화","氣候變化","기운 기|기후 후|변할 변|될 화","오랜 기간에 걸쳐 한 지 역에 만들어진 평균적인 기후가 달라지는 현상","기후변화의 원인과 영향을 살펴본다."],["대응","對應","대할 대|응할 응","어떤 일에 맞추어 행동함","기후변화에 대응하는 방법을 알아본다."],["실천","實踐","열매 실|밟을 천","생각한 것을 실제로 해 봄","기후변화를 줄이기 위해 에너지 절약을 실천해야 한다."],["피해","被害","입을 피|해할 해","해를 입음","홍수로 인한 피해를 조사하다."],["인구","人口","사람 인|입 구","일정한 지역에 사는 사람의 수","비수도권 지역의 인구가 감소 하는 이유를 알아본다."],["인구분포","人口分布","사람 인|입 구|나눌 분|펼 포","인구가 모이거나 흩어져 있는 정도","지형, 기후, 교육, 교통, 일자리 등은 인구분포에 영향을 준다."],["인구밀도","人口密度","사람 인|입 구|밀 빽빽할|정도 도","일정한 넓이에 사는 사람의 수","수도권은 인구밀도가 높다."],["인구구조","人口構造","사람 인|입 구|얽을 구|지을 조","일정한 지역 안의 인구를 남녀별 나이, 직업 등을 기준으로 나누어 파악하는 인구의 특징","인구구조를 비교하다."],["수도권","首都圈","머리 수|도읍 도|우리 권","서울, 인천, 경기도를 중 심으로 이루어진 대도시권","수도권에 인구가 많이 모이는 이유를 알아보다."],["공공기관","公共機關","공 공평할|함께 공|틀 기|빗장 관","국민을 위해 일하는 기관","공공기관이 이전한 사례를 찾아보다."],["균형발전","均衡發展","고를 균|저울대 형|필 발|펼 전","한쪽으로 치우치지 않고 고르게 발전하는 것","우리나라의 균형발전 정책을 알아보다."]],"3단원":[["법","法","법 법","사회 구성원이 반드시 지켜야 하는 규범","법은 사람들 사이의 갈등이나 다툼을 해결하는 기준이다."],["인권","人權","사람 인|권세 권","사람이 태어나면서 당연히 가지는 권리","모든 사람의 인권은 존중받아야 한다."],["규칙","規則","법 규|법칙 칙","함께 지키기로 한 약속","학교에서 지켜야 할 규칙을 정하다."],["질서","秩序","차례 질|차례 서","정해진 순서나 상태가 잘 지켜지는 것","법은 사회 질서를 유지하려고 만들어졌다."],["규범","規範","법 규|법 범","행동하거나 판단할 때 따라야 할 기준","법은 사회 구성원이 반드시 지켜야 하는 강제성이 있는 규범 이다."],["제재","制裁","절제할 제|마를 재","법을 어겼을 때 받는 조치","법을 지키지 않으면 국가로부터 제재를 받는다."],["헌법","憲法","법 헌|법 법","우리나라의 최고법","헌법은 모든 국민이 인간으로 서의 존엄과 가치를 가지고 행복을 추구할 수 있도록 인권을 보장한다."],["권리","權利","권세 권|이로울 리","사람이 마땅히 누릴 수 있는 것","법은 개인의 권리를 보호한다."],["의무","義務","옳을 의|힘쓸 무","반드시 해야 하는 일","국민의 의무를 알아본다."],["존중","尊重","높일 존|무거울 중","소중하게 여기고 함부로 대하지 않음","다른 사람의 인권을 존중한다."],["평등","平等","평평할 평|같을 등","차별 없이 똑같이 대함","평등한 사회를 만들다."],["보호","保護","지킬 보|보호할 호","위험이나 어려움에서 지켜 줌","법이 인권을 보호하는 사례를 알아본다."],["개인정보","個人情報","낱 개|사람 인|뜻 정|알릴 보","한 사람을 알아볼 수 있는 여러 가지 정보","법은 개인정보를 보호한다."],["법령","法令","법 법|명령할 령","법과 명령을 아울러 이르는 말","생활법령 정보를 찾아본다."],["차별","差別","다를 차|다를 별","대상을 다르게 대하거나 불리하게 대함","모든 사람은 차별받지 않을 권리가 있다."],["침해","侵害","침범할 침|해할 해","다른 사람의 권리나 이익을 해침","인권 침해 사례를 조사한다."]]},"천재교과서(김정인)":{"1단원":[["국토","國土","나라 국|흙 토","나라의 땅, 한 나라의 통 치권이 미치는 지역","우리 국토는 산지가 많은 편이고, 삼면이 바다로 둘러싸여 있다."],["지형","地形","땅 지|모양 형","땅의 생김새(땅의 생긴 모양)","우리나라는 산지, 하천, 해안 등 다양한 지형이 나타난다."],["산지","山地","메 산|땅 지","높고 낮은 산들이 모여 있는 곳","우리나라 국토는 70%가 산지 이고, 높은 산은 대체로 북쪽과 동쪽에 분포한다."],["하천","河川","물 하|내 천","땅 위를 흐르는 크고 작은 물 줄기","우리나라의 큰 하천은 대부분 동쪽 산지에서 시작해 황해나 남 해로 흐른다."],["평야","平野","평평할 평|들 야","평평하고 넓은 땅","하천 주변의 넓은 평야가 발달 한 곳에서는 벼농사를 짓는다."],["해안","海岸","바다 해|언덕 안","바다와 육지가 맞닿은 부분","해안에는 모래사장이나 갯벌 등이 나타난다."],["산맥","山脈","메 산|줄기 맥","산봉우리가 줄이나 띠 모양 으로 길게 이어져 있는 지형","우리나라는 대체로 북쪽과 동 쪽에 산맥이 발달했다."],["다도해","多島海","많을 다|섬 도|바다 해","많은 섬이 흩어져 있는 바다","우리나라 남해안은 크고 작은 섬이 많아 ‘다도해’라고 불린다."],["해안선","海岸線","바다 해|언덕 안|줄 선","바다와 육지가 맞닿은 선","동해안은 해안선이 단조롭고, 서해안과 남해안은 해안선이 복 잡하다."],["양식업","養殖業","기를 양|불릴 식|업 업","물고기나 해조, 버섯 따위의 양식을 전문으로 하는 생산업","파도가 잔잔한 바다에서는 김, 전복 등을 기르는 양식업이 발달 한다."],["국립 공원","國立公園","나라 국|설 립|공평할 공|동산 원","자연 경치가 뛰어난 지역 의 자연과 문화적 가치를 보 호하기 위하여 나라에서 지 정하여 관리하는 공원","우리나라는 아름다운 지형 경관 을 대표하는 곳을 국립 공원으로 지정해 보호하거나, 생태 관광지로 선정해 관리한다."],["생태","生態","날 생|모습 태","생물이 살아가는 모양이나 상태",""],["화산","火山","불 화|메 산","땅속에 있는 가스, 마그마 따 위가 지각의 터진 틈을 통하여 지표로 분출하는 지점","제주도, 울릉도, 독도에서는 다 양한 화산 지형을 볼 수 있다."],["독도","獨島","홀로 독|섬 도","우리나라 영토의 동쪽 끝에 있 는 섬으로 동도와 서도, 89개의 작은 바위섬으로 이루어짐","독도는 화산 활동으로 만들어졌 으며, 다양한 동식물이 살고 있다."],["정박","渟泊","닻 정|배 댈 박","배가 닻을 내리고 머무름","동도에는 큰 배를 정박할 수 있 는 시설과 등대, 독도 경비대 숙 소, 헬기장 등이 있다."],["영토","領土","거느릴 령(영)|흙 토","국제법에서, 국가의 통치권 이 미치는 구역","우리나라는 오래전부터 울릉 도와 독도를 우리나라 영토로 표 시해 왔다."]],"2단원":[["대기","大氣","큰 대|기운 기","지구를 둘러싸고 있는 공 기층","한 지역에서 하루하루 나타나는 대기의 상태를 날씨라고 한다."],["기후","氣候","기운 기|기후 후","어떤 지역에서 오랜 기간에 걸쳐 나타난 대기의 평균적 이고 종합적인 상태","기후를 설명할 때는 기온, 강수량, 바람 등의 평균적인 특징을 종합적으로 고려해 설명한다."],["평균","平均","평평할 평|고를 균","수나 양, 정도의 중간이 되는 것",""],["계절","季節","계절 계|마디 절","규칙적으로 되풀이되는 자연 현상에 따라서 일 년을 구분한 것","우리나라는 사계절이 뚜렷하 게 나타난다."],["기온","氣溫","기운 기|따뜻할 온","대기(공기)의 온도","우리나라는 계절에 따라 기온 차이가 있으며, 특히 여름과 겨 울의 기온 차이가 큰 편이다."],["열대야","熱帶夜","더울 열|띠 대|밤 야","밤에도 최저 기온이 25℃ 이하로 떨어지지 않는 현상","여름에는 열대야 현상이 발생 하기도 한다."],["한파","寒波","찰 한|물결 파","겨울철에 기온이 갑자기 내 려가는 현상","겨울에는 기온이 급격히 내려 가는 한파가 발생하기도 한다."],["강수량","降水量","내릴 강|물 수|헤아릴 량","일정한 지역에 일정 기간 비, 눈 등으로 내린 물의 양을 모두 합한 것","우리나라의 연 강수량은 약 1,300mm로, 세계 평균보다 많은 편이다."],["태풍","颱風","태풍 태|바람 풍","북태평양 서남부에서 발생 하여 아시아 대륙 동부로 불어오는, 폭풍우를 수반한 맹렬한 열대 저기압","우리나라는 장마와 태풍의 영향 으로 여름에 강수량이 집중된다."],["계절풍","季節風","계절 계|마디 절|바람 풍","계절에 따라 주기적으로 일 정한 방향으로 부는 바람","우리나라는 계절에 따라 바람 의 방향과 성질이 다른 계절풍이 불어온다."],["기후변화","氣候變化","기운 기|기후 후|변할 변|될 화","화석 연료의 소비가 늘어나 온실가스가 많이 배출되면서 지구의 기온이 점점 높아지 는 지구 온난화 현상","우리나라는 연평균 기온이 높 아지고, 연 강수량도 증가하는 추세로 기후가 변화하고 있다."],["자연재해","自然災害","스스로 자|그럴 연|재앙 재|해할 해","자연 현상이 인간의 생명이 나 재산에 피해를 주는 것","기후변화로 자연재해가 심화 되고 있다."],["폭염","暴炎","사나울 폭|불꽃 염","하루 최고 기온이 33℃ 이상 으로 올라가는 매우 심한 더위","기후변화로 폭염 발생 일수가 증 가하면서 일사병이나 열사병에 걸리는 사람들이 늘어나고 있다."],["홍수","洪水","넓을 홍|물 수","짧은 시간에 많은 비가 내려 하천이나 강의 물이 넘쳐흐르는 현상","홍수는 기후변화로 장마 기간 이 길어지거나, 갑작스러운 집중 호우 또는 태풍의 영향을 받아 나타난다."],["집중 호우","集中豪雨","모을 집|가운데 중|호걸 호|비 우","어느 한 지역에 집중적으로 내리는 비",""],["폭설","暴雪","사나울 폭|눈 설","짧은 시간 동안 많은 양의 눈이 내리는 현상","폭설이 발생하면 교통이 마비 되고, 비닐하우스나 축사 등이 붕괴되기도 한다."],["기상 특보","氣象特報","기운 기|모양 상|특별할 특|알릴 보","각종 기상 현상으로 재해가 발생할 우려가 있을 때, 위험을 경고하기 위해 제공하는 정보","정부에서는 자연재해를 예측하 고, 국민이 미리 재해에 대처할 수 있도록 기상 특보를 발령한다."],["기후 행동","氣候行動","기운 기|기후 후|다닐 행|동 움직일","기후변화로 발생하는 여러 가 지 문제를 해결하고, 기후변화 에 대응하기 위해 노력하는 것","기후변화에 대응하기 위해서 는 기후 행동에 참여해야 한다."],["탄소중립","炭素中立","숯 탄|본디 소|가운데 중|설 립","탄소 배출량을 줄이고 흡수 량을 늘려, 실질적인 배출량 을 ‘0’으로 만드는 일","정부는 탄소중립 실천을 확산하 기 위해 친환경 활동을 할 때마다 점수를 주는 제도를 운영한다."],["인구 분포","人口分布","사람 인|입 구|나눌 분|베 포","사람들이 어디에 얼마나 모 여 살고 있는지 나타낸 것","우리나라는 지역별로 인구 분포 의 차이가 크다."],["산업화","","","",""],["수도권","首圈","머리 수|도읍 도|우리 권","수도를 중심으로 이루어진 대도시권(서울특별시, 경기 도, 인천광역시)","현재 우리나라 인구의 약 70%가 수도권과 대도시에 거주하며, 수 도권에 전체 인구의 절반 이상이 모여 살고 있다."],["거주","居住","살 거|살 주","일정한 곳에 머물러 삶",""],["인구 구조","人口構造","사람 인|입 구|얽을 구|지을 조","일정한 지역 안의 인구를 성별, 나이, 직업 등을 기 준으로 나누어 파악하는 인구의 특징","수도권의 연령별 인구 구조를 살 펴보면 청장년층의 비중이 다른 지역보다 높게 나타난다."],["인구 밀도","人口密度","사람 인|입 구|밀 빽빽할|법도 도","일정한 면적(1㎢) 안에 거주 하는 인구수","인구 밀도는 인구가 얼마나 빽빽 하게 모여 있는지를 나타낸다."],["조성","組成","지을 조|이룰 성","무엇을 만들어서 이룸","수도권 집중 현상으로 수도권 에는 대규모 주거 단지가 조성 되고 도로와 철도 등 교통망이 크게 발달했다."],["비수도권","非首圈","아닐 비|머리 수|도읍 도|우리 권","서울특별시, 경기도, 인천 광역시를 제외한 지역","비수도권은 서울특별시, 경기도, 인천광역시를 제외한 지역이다."],["불균형","不均衡","아닐 불|고를 균|저울대 형","어느 한 편으로 치우쳐 고르지 않음","수도권에 인구가 지나치게 집 중하면서 우리나라에는 인구 분 포의 불균형이 나타났다."],["고령 인구","高齡人口","높을 고|나이 령|사람 인|입 구","65세 이상의 인구","비수도권의 인구가 빠져나가 는 지역에서는 고령 인구의 비율 이 높아 일손이 부족해지고, 지 역 경제가 어려워졌다."],["이전","移轉","옮길 이|구를 전","장소나 주소 등을 다른 곳으로 옮김","국토 균형 발전을 위해 세종특 별자치시를 만들어 대부분의 중 앙 행정 기관을 이전했다."],["혁신 도시","革新都市","가죽 혁|새 신|도읍 도|저자 시","국가 균형 발전을 위해 수도 권의 공공 기관을 지방으로 이전해 새롭게 조성한 도시","국토 균형 발전을 위해 나주시 에도 혁신 도시가 조성되었다."],["육성","育成","기를 육|이룰 성","길러 자라게 함","각 지역의 특성에 맞는 산업을 키 우고 일자리를 만드는 등 지방 도시 를 육성하는 정책을 추진하고 있다."],["창업","創業","비롯할 창|업 업","사업을 처음으로 시작함","정부는 지방으로 옮겨 가거나 지 방에서 창업하는 기업에 세금 혜택 을 주고 있다."],["균형","均衡","고를 균|저울대 형","어느 한쪽으로 기울거나 치 우치지 아니하고 고른 상태","정부와 지방 자치 단체는 국토 균형 발전을 위해 다양한 노력 을 하고 있다."],["폐교","廢校","무너질 폐|학교 교","학교의 운영을 그만두고 문 을 닫음. 또는 그렇게 문을 닫 은 학교","학생 수가 빠르게 줄어 폐교 위기에 놓였던 학교가 여러 사 람의 노력으로 다시 살아났다."]],"3단원":[["사회 규범","會規範","모일 사|모일 회|법 규|법 범","사회에서 사람들이 지켜야 할 여러 가지 행동 기준","사회 규범은 사회에서 사람 들이 지켜야 할 여러 가지 행 동 기준을 말한다."],["법","法","법 법","사회 질서를 유지하고 개인 의 권리를 보호하기 위해 국 가가 제정한 사회 규범","법은 사람들에게 어떤 행동 을 하도록 하거나 하지 않도 록 기준을 제시한다."],["강제성","","","",""],["제재","制裁","절제할 제|마를 재","법이나 규정을 어겼을 때 국 가가 처벌이나 금지를 행함","법을 지키지 않으면 국가로 부터 제재를 받는다."],["규제","規制","법 규|절제할 제","규칙이나 법으로 개인 또 는 단체의 활동을 제한함","우리는 가정, 학교, 사회 등 일상생활 속에서도 법의 보호 와 규제를 받으며 살아간다."],["구제","救濟","구원할 구|도울 제","어려운 처지에 있는 사람 을 도와줌","법은 개인의 권리를 보호하고, 권리가 침해된 경우 이를 구제하 여 개인의 권리를 보장한다."],["사회 질서","會秩序","모일 사|모일 회|차례 질|차례 서","사회를 구성하는 여러 요소 와 집단이 조화롭게 균형을 이룬 상태","법은 범죄와 사고로부터 사람 들의 안전을 지키고, 사회 질서 를 유지하는 역할을 한다."],["침해","侵害","침노할 침|해할 해","침범하여 해를 끼침","법을 지키지 않으면 다른 사람 의 권리를 침해할 수 있다."],["인권","人權","사람 인|권세 권","인간이 마땅히 누려야 할 기본적인 권리","인권은 사람이 태어나면서 당연히 갖게 되는 권리로, 누구에게나 똑같이 보장된다."],["헌법","憲法","법 헌|법 법","모든 법의 기본이 되는 국가의 최고 법","헌법에는 국가가 국민의 기본 적 인권을 보장해야 한다는 내 용이 분명하게 제시되어 있다."],["권리","權利","권세 권|이로울 리","어떤 일을 행하거나 타인 에 대하여 당연히 요구할 수 있는 힘이나 자격","[제10조] 모든 국민은 인간으 로서의 존엄과 가치를 가지며, 행복을 추구할 권리를 가진다."],["불가침","不可侵","아닐 불|옳을 가|침노할 침","함부로 침범할 수 없음","국가는 개인이 가지는 불가침 의 기본적 인권을 확인하고 이를 보장할 의무를 진다."],["의무","義務","옳을 의|힘쓸 무","반드시 해야 하는 일","헌법에는 국민의 기본적 권리 와 의무, 국가기관을 조직하고 운영하는 원칙 등이 담겨 있다."],["경시","輕視","가벼울 경|볼 시","어떤 대상을 중요하게 보 지 않고 하찮게 여김","[제37조 제1항] 국민의 자유와 권리는 헌법에 열거되지 아니 한 이유로 경시되지 아니한다."],["규정","規定","법 규|정할 정","내용이나 성격, 의미 등을 밝혀 정함","헌법은 우리나라 국민이라면 누 구나 인권을 누릴 수 있도록 기 본적 인권을 규정하고 있다."],["점자","點字","점 점|글자 자","손가락으로 더듬어 읽도록 만든 문자","음료수 및 컵라면 용기에는 시 각 장애인이 손끝으로 읽을 수 있도록 점자가 표기되어 있다."],["제도","制度","절제할 제|법도 도","관습이나 도덕, 법률 따위의 규범이나 사회 구조의 체계","헌법에 규정된 인권은 법과 제도를 통해 다양한 모습으로 실현되고 있다."],["인권 침해","人權侵害","사람 인|권세 권|침노할 침|해할 해","헌법으로 보장된 국민의 기 본적 인권을 지키지 않거나, 다른 사람을 차별하는 행위","인간으로서 누려야 할 기본적 권리를 존중받지 못하는 것을 인권 침해라고 한다."],["인식","認識","알 인|알 식","무엇을 분명히 알고 이해함","시민 단체는 인권 문제에 대 한 관심과 인식을 높이기 위해 다양한 캠페인을 펼친다."],["편견","偏見","치우칠 편|볼 견","공정하지 못하고 한쪽으 로 치우친 생각","학교에서는 편견과 차별을 없 애며, 인권을 존중하는 태도를 기를 수 있도록 다양한 인권 교육을 실시하고 있다."],["차별","差別","다를 차|다를 별","대상을 다르게 대하거나 불리하게 대함",""],["고정 관념","固定觀念","굳을 고|정할 정|볼 관|생각 념","잘 변하지 않는, 행동을 결정 하는 확고한 의식이나 신념","사람들의 편견이나 고정 관념, 잘못된 법률이나 제도 등으로 인권이 침해되는 경우가 있다."],["진정서","陳情書","진 늘어놓을|뜻 정|글 서","어떤 문제에 대한 실제 사 정을 적어서 관청이나 공공 기관 등에 문제 해결을 바 라며 내는 글","자신이 겪은 차별에 대해 국가 인권위원회에 진정서를 제출할 수 있다."],["헌법재판소","憲法裁判所","법 헌|법 법|마를 재|판단할 판|바 소","법률이 헌법에 어긋나는지, 국가 권력이 국민의 권리를 침해하는지 등을 심판하는 국 가기관","법률이나 국가 권력이 국민의 권리를 침해할 때는 헌법재판소 의 도움을 받아 문제를 해결할 수 있다."],["개설자","開設者","열 개|베풀 설|놈 자","설비나 제도 따위를 새로 마 련하고 그에 관한 일을 시작 한 사람","동물 약국 개설자인 약사는 수의사의 처방전이 있어야 예 방 접종 약을 판매할 수 있다."],["동반","同伴","함께 동|짝 반","일을 하거나 길을 가는 등의 행동을 함께 함","아동이 이 식당을 이용하려면 반드시 보호자를 동반해야 한다."],["민원","民願","백성 민|원할 원","주민이 행정 기관에 대하여 원하는 바를 요구하는 일","통학로에 인도가 없어 위험하 다고 구청에 민원을 제기했다."],["보행로","步行路","걸음 보|다닐 행|길 로","사람이 지나다니도록 만든 도로","아이들이 안전하게 통학하려 면 보행로가 필요하다."],["보호","保護","지킬 보|도울 호","위험이나 곤란이 미치지 않도록 잘 보살펴 돌봄","나와 다른 사람의 인권에 관심 을 갖고, 인권 보호 활동에 적 극적으로 참여해야 한다."],["무인","無人","없을 무|사람 인","사람이 없음","디지털 격차를 해소하기 위해 무인 주문기 이용 교육을 실시 한다."]]},"천재교과서(박기범)":{"1단원":[["국토","國土","나라 국|흙 토","한 나라의 영토 전체","우리나라 국토의 모습을 살펴보다."],["지형","地形","땅 지|모양 형","산, 하천, 평야, 해안, 섬 등과 같은 땅의 생김새","우리나라에는 산지, 하천, 평 야, 해안, 섬과 같은 다양한 지형이 있다."],["산지","山地","뫼 산|땅 지","주변보다 높은 산들이 모여 있는 곳","우리나라의 높은 산지는 주 로 북쪽과 동쪽에 분포한다."],["하천","河川","물 하|내 천","빗물 등이 낮은 곳으로 흘러가며 만든 크고 작은 물줄기","우리나라 하천은 대부분 높은 산지에서 시작해 넓은 평야를 지나 바다로 흘러간다."],["해안","海岸","바다 해|언덕 안","바다와 육지가 맞닿은 부분","동해안은 모래사장이 많아 해수욕장이 발달했다."],["평야","平野","평평할 평|들 야","평탄하고 넓은 땅","우리나라의 평야는 하천이 흐르는 방향을 따로 주로 남 쪽과 서쪽에 발달했다."],["경사","傾斜","기울 경|비낄 사","기울어진 정도","독도는 화산섬으로 경사가 가파르다."],["해안선","海岸線","바다 해|언덕 안|줄 선","바다와 육지가 맞닿은 선","우리나라의 서해안과 남해안 은 동해안에 비해 해안선이 복잡하다."],["간척","干拓","방해 간|넓힐 척","호수나 바다를 육지로 만드는 일","갯벌을 간척해 공업 용지나 농업 용지로 이용하다."],["호수","湖水","호수 호|물 수","육지로 둘러싸인 큰 물","호수나 바다를 육지로 만드는 일을 간척이라고 한다."],["생산","生産","날 생|낳을 산","물건이나 농산물을 만들어 냄","호남평야는 쌀을 많이 생산 하는 곳이다."],["경관","景觀","볕 경|볼 관","자연이나 지역의 아름다운 모습","설악산은 아름다운 경관으로 유명하다."],["산맥","山脈","뫼 산|줄기 맥","여러 산지가 연이어 있는 지형, 산들이 길게 이어진 줄기","동해안을 따라서 국토의 동 쪽에 길게 뻗어 있는 산맥은 태백산맥이다."],["황해","黃海","누를 황|바다 해","한반도 서쪽의 바다","우리나라의 큰 하천은 주로 황해와 남해로 흐른다."],["용암","熔岩","녹을 용|바위 암","화산의 분화구에서 분출 된 마그마, 또는 그것이 굳어진 암석","독도는 화산 폭발로 솟은 용암 이 굳어 만들어진 화산섬이다."],["화산","火山","불 화|뫼 산","땅속에 있는 가스, 마그마 따위가 분출하여 지각의 터진 틈을 통해 지표로 분 출하는 지점 또는 그 결과","독도는 화산 폭발로 만들어진 섬이다."],["분포","分布","나눌 분|펼 포","여러 곳에 흩어져 있는 상태","우리나라는 전 국토에 걸쳐 아름다운 지형이 분포한다."],["환경","環境","고리 환|지경 경","사람과 생물이 살아가는 주변 조건","국토의 아름다움과 환경의 중 요성을 이해한다."]],"2단원":[["기후","氣候","기운 기|기후 후","오랜 기간 한 지역에서 나타나는 평균적인 날씨의 상태","우리나라는 사계절이 나타나 며 계절에 따라 기후의 특징이 다르게 나타난다."],["대기","大氣","큰 대|기운 기","공기를 달리 이르는 말","날씨는 짧은 기간 동안 나타 나는 대기 상태를 말한다."],["기온","氣溫","기운 기|따뜻할 온","공기의 따뜻하고 차가운 정도","우리나라는 여름에 기온이 높고 겨울에 기온이 낮다."],["강수량","降水量","내릴 강|물 수|헤아릴 량","비, 눈, 우박 등이 일정 기간 동안 일정한 곳에 내 린 물의 총량","우리나라의 강수량은 세계 평균보다 많다."],["기후변화","氣候變化"," |기약할 기","힘이 가장 강했던 시기","고구려는 5세기 광개토 대왕과 장수왕 때 전성기를 맞이했다."],["고분","古墳","옛 고|무덤 분","옛날에 만들어진 무덤","고분을 보면 당시 사람들의 의식주나 종교 등 생활 모습을 알 수 있다."],["연호","年號","해 년(연)|이름 호","왕이 자신이 다스리던 시기에 붙이던 해의 이름","고구려의 불상에 새겨진 연호를 통해 불상을 만든 시기를 짐작할 수 있다."],["불교","佛敎","부처 불|가르칠 교","인도의 석가모니에 의해 만들어져, 이 세상의 모든 고통에서 벗어나 부처가 되는 것을 이상으로 삼는 종교","삼국은 불교를 받아들여 왕의 권위를 높이고, 백성의 힘을 하나로 모으고자 했다."],["백제","百濟","일백 백|건널 제","고구려 왕자였던 온조가 남쪽으로 내려와 한강 유역에 살던 세력과 힘을 합해 세운 나라","백제는 4세기 근초고왕 때 삼국 중 가장 먼저 전성기를 맞았다."],["신라","新羅","새 신|그물 라","박혁거세가 지금의 경주 지역을 중심으로 세운 나라","신라는 주변의 여러 나라와 경쟁하며 세력을 넓혀 갔다."],["골품제","骨品制","뼈 골|물건 품|절제할 제","골품은 뼈의 등급이라는 뜻으로, 혈통에 따라 신분을 나눈 제도","신라에는 골품제라는 신분제가 있었다."],["가야","伽倻","절 가|가야 야","한반도 남쪽의 낙동강 하류 지역에서 여러 나라가 모여 발전한 나라","가야는 철이 풍부하여 철기문화가 발달하였다."],["유민","遺民","남길 유|백성 민","망하여 없어진 나라의 백성","신라는 고구려의 유민과 힘을 합쳐 당에 맞서 싸웠다."],["발해","渤海","발해 발|바다 해","고구려 출신 대조영이 고구려 유민과 말갈 집단을 이끌고 고구려의 옛 땅에 세운 나라","발해는 고구려를 계승한 나라이다."],["해동성국","海東盛國","바다 해|동녘 동|성할 성|나라 국","크게 발전하고 번성한 발해를 당나라에서 부르던 말","당은 발해를 ‘바다 동쪽에서 일어나 번성하는 나라’라는 뜻으로 해동성국이라고 불렀다."],["호족","豪族","호걸 호|겨레 족","신라 말, 고려 초에 경제력과 군사력을 바탕으로 지방에서 성장한 정치 세력","신라 말에는 왕권이 약해지면서 각 지방에서 호족이 성장했다."],["고려","高麗","높을 고|고울 려","왕건이 후삼국을 통일하고 918년에 세운 나라","왕건은 후삼국을 통일하고 고려를 세웠다."],["연등회","燃燈會","불탈 연|등 등|모일 회","등을 켜고 부처에게 복을 비는 불교 행사","고려에서는 등을 밝히고 부처에게 복을 비는 연등회를 크게 열었다."],["팔관회","八關會","여덟 팔|관계할 관|모일 회","불교 행사와 여러 토속신에게 제사를 지내는 행사가 결합된 고려의 대표적 국가 행사","고려에서는 불교 행사와 여러 토속 신에게 제사를 지내는 팔관회를 열었다."],["과거제","科擧制","과목 과|들 거|절제할 제","시험을 통해 관리를 뽑던 제도","고려에서는 과거제를 실시하여 능력에 관리를 선발했다."],["벽란도","碧瀾渡","푸를 벽|물결 란|건널 도","푸른 물결이 넘실대는 나루 라는 뜻으로, 고려 시대에 다른 나라와의 무역이 활발하게 이루어졌던 국제 무역항","고려 시대 벽란도는 여러 나라의 상인들이 드나드는 국제 무역항으로 발달하였다."],["담판","談判","말씀 담|판단할 판","서로 맞선 관계에 있는 쌍방이 의논하여 옳고 그름을 판단하는 것","서희는 거란과의 외교 담판을 통해 강동 6주 지역을 확보하였다."],["삼별초","三別抄","석 삼|나눌 별|뽑을 초","‘별초’는 ‘가려 뽑은 군대’라는 뜻으로, 원래 경찰 및 전투의 임무를 맡았던 부대","삼별초는 고려가 몽골과 강화를 맺는 것에 반대하며 고려 정부와 몽골의 연합군에 맞서 싸웠다."],["상감기법","象嵌技法","코끼리 상|산골짜기 감|재주 기|법 법","금속이나 도자기 등의 표면에 무늬를 새겨서 그 속에 다른 재료를 넣는 기법","고려 시대에는 청자에 무늬를 새기는 데 상감 기법을 사용하였다."],["대장경","大藏經","큰 대|감출 장|날 경","불교의 가르침을 모아 놓은 불교 경전을 일컫는 말","고려 사람들은 나라에 어려운 일이 생길 때 부처의 힘으로 위기를 극복하기 위해 대장경을 만들었다."],["금속활자","屬活字","쇠 금|무리 속|살 활|글자 자","글을 인쇄하기 위해 금속으로 만든 낱개의 글자판","고려 시대에는 세계 최초로 금속 활자가 발명되었다."]],"2단원":[["신진사대부","新進士大夫","새 신|나아갈 진|선비 사|큰 대|부 지아 비","고려 말 유교의 한 갈래인 성리학을 공부한 뒤 과거 시험을 통해 관리가 되었던 사람들","신진 사대부들은 이성계와 함께 고려를 개혁하고자 하였다."],["조선","朝鮮","아침 조|고울 선","이성계가 고려를 무너뜨리고 1392년에 세운 나라로, 유교를 바탕으로 나라를 다스린 왕조","이성계는 신진 사대부의 지지를 받고 왕위에 올라 조선을 건국했다."],["유교","儒敎","선비 유|가르칠 교","중국에서 생겨난 사상으로, 나라를 다스리는 데 필요한 질서와 사람이 지켜야 할 도리를 중요하게 여김","조선은 유교의 가르침을 바탕으로 나라를 다스렸다."],["위패","位牌","자리 위|패 패","죽은 사람의 이름을 적은 나무패","종묘는 왕과 왕비의 위패를 모시고 제사를 지내는 곳이다."],["집현전","集賢殿","모을 집|어질 현|전각 전","조선 전기에 학문과 정책을 연구하고 도서를 수집, 보관하기 위해 설치한 기관","조선 시대에 세종은 집현전을 운영하며 뛰어난 학자를 길러냈다."],["창제","創製","비롯할 창|지을 제","전에 없던 것을 처음으로 만들어 냄","세종은 글자를 몰라 어려움을 겪는 백성을 위해 훈민정음을 창제하였다."],["반포","頒布","나눌 반|베 포","세상에 널리 퍼뜨려 모두 알게 함","세종은 새로 만든 훈민정음을 백성들이 널리 사용하도록 반포하였다."],["국역","國役","나라 국|부역 역","나라에서 필요로 하는 일에 불려 가 일하는 의무","양반은 관리가 되어 나랏일에 참여하면서 국역을 면제받았다."],["관혼상제","冠婚喪祭","갓 관|혼인할 혼|잃을 상|제사 제","관례·혼례·상례·제례의 네 가지 전통적인 예식","조선 시대에는 관혼상제를 유교 예절에 따라 치렀다."],["임진왜란","壬辰倭亂","북방 임|별 진|왜 왜 나 라|어지러울 란","1592년에 일본이 조선을 침략하여 일어난 전쟁","임진왜란은 1592년 명나라로 가는 길을 빌려 달라는 구실로 일본이 조선을 침략한 사건이다."],["피란","避亂","피할 피|어지러울 란","전쟁과 같은 난리를 피하여 옮겨 감","임진왜란이 일어나자, 선조는 한양을 떠나 의주로 피란하였다."],["의병","義兵","옳을 의|병사 병","국가에 큰 혼란이 있을 때 백성들이 자발적으로 일어나서 싸운 군대","임진왜란 때 이순신이 이끄는 수군과 전국 각지에서 일어난 의병이 활약했다."],["사고","史庫","역사 사|곳집 고","『조선왕조실록』과 같이 나라의 중요한 책을 보관하던 곳","조선은 일본과의 전쟁으로 불국사, 경복궁, 사고 등 중요한 건축물들이 불타 없어졌다."],["병자호란","丙子胡亂","남녘 병|자식 자|호 오 랑 캐|어지러울 란","1636년에 청이 조선을 침략하여 일어난 전쟁","병자호란 때 청의 군대가 조선을 침략하자 조선은 청의 군대에 맞서 싸웠으나 결국 항복했다."],["붕당","朋黨","벗 붕|무리 당","학문적 또는 정치적으로 생각을 같이하는 사람들의 모임","조선의 지배층은 붕당을 이루어 서로 다양한 의견을 주고받으며 정치를 하였다."],["탕평책","蕩平策","쓸어 없앨 탕|평평할 평|대쪽 책","한 붕당에 치우치지 않고 나랏일을 함께할 인재를 고르게 등용하는 정책","영조는 여러 붕당에서 인재를 고르게 뽑아 쓰는 탕평책을 실시했다."],["규장각","奎章閣","별 규|글 장|집 각","왕실의 도서관이면서 학문 및 정책을 연구하던 곳","정조는 규장각을 세워 학자들이 학문을 연구하고 나라의 중요한 문제를 생각하게 하였다."],["실학","實學","열매 실|배울 학","나라를 운영하는 방법이나 백성의 생활과 관련된 현실 문제에 관심을 가지고 적극적으로 해결하려는 새로운 학문","조선 후기의 학자들은 실학을 연구하며 백성들의 생활을 개선할 방법을 찾았다."],["서민문화","庶民文化","여러 서|백성 민|글월 문|될 화","조선 후기에 일반 백성들이 즐기며 발달시킨 문화","조선 후기에는 한글 소설, 판소리, 탈놀이 등 다양한 서민 문화가 발달하였다."],["부정부패","不正腐敗","아닐 불|바를 정|썩을 부|패할 패","바르지 못하고 타락함","세도 정치로 관리의 부정부패가 심해지고 백성들의 삶이 어려워졌다."],["대원군","大院君","큰 대|집 원|임금 군","왕의 후손이 없어 친척 중 왕위를 이어받는 경우 그 왕의 아버지를 이르는 말","흥선 대원군은 세도 정치의 잘못된 점을 바로잡기 위해 여러 개혁을 추진하였다."],["서원","書院","글 서|집 원","유교를 공부하고 훌륭한 학자에게 제사 지내던 곳","흥선 대원군은 백성에게 피해를 주던 서원을 정리하고 양반에게도 세금을 거두었다."],["통상","通商","통할 통|헤아릴 상","나라 사이에 물건 등을 사고파는 것","조선 후기에는 서양 여러 나라의 배가 조선의 해양에 자주 나타나 통상을 요구하였다."],["조약","條約","가지 조|맺을 약","나라와 나라 사이에 문서를 작성하여 합의한 약속","강화도 조약은 조선이 외국과 맺은 최초의 근대적 조약으로, 강압에 의해 체결되어 조선에 불리한 내용이 담겨 있었다."],["개항","開港","열 개|항구 항","항구를 열어 외국의 배, 사람, 상품 등이 들어오게 함","1876년 조선은 일본과 강화도 조약을 맺고 개항했다."],["개화","開化","열 개|될 화","서양의 새로운 제도와 문화 등을 받아들이는 것","조선은 서양의 새로운 문물과 제도를 받아들이는 개화 정책을 펼쳤다."],["정변","政變","정사 정|변할 변","법에 맞지 않는 방법으로 일어난 정치적인 큰 변화","김옥균 등은 근대적 개혁을 추진하기 위해 갑신정변을 일으켰다."],["동학","東學","동녘 동|배울 학","최제우가 서학(천주교)에 대응하여 민간 신앙과 불교 등 다른 종교를 종합하여 만든 종교","전봉준과 농민들은 잘못된 정치를 바로잡고 백성의 삶을 개선하기 위해 동학 농민 운동을 일으켰다."],["시해","弑害","윗사람 죽일 시|해할 해","왕이나 왕비 등 지위가 높은 사람을 죽이는 일","일본은 명성 황후를 시해하였다."],["이권","利權","이로울 리(이)|권세 권","광산, 철도 개발 등 이익을 얻을 수 있는 권리","서양의 여러 나라는 조선의 광산과 철도 개발 등에 관한 이권을 차지하였다."]],"3단원":[["늑약","勒約","굴레 륵(늑)|맺을 약","억지로 맺은 조약","러시아와의 전쟁에서 승리한 일제는 1905년 대한제국을 강압하여 을사늑약을 맺고 외교권을 빼앗았다."],["일제","日帝","날 일|임금 제","일본 제국의 줄임말로, 군사력을 앞세워 다른 나라를 침략했던 과거의 일본을 지칭하는 말","일제는 러일 전쟁에서 승리한 뒤 대한 제국을 본격적으로 침략하기 시작했다."],["의사","義士","옳을 의|선비 사","국가와 민족을 위해 목숨을 바친 사람","안중근 의사는 하얼빈 역에서 이토 히로부미를 사살하였다."],["식민지","植民地","심을 식|백성 민|땅 지","주권을 잃어 정치적·경제적으로 다른 나라에 속하게 된 나라","1910년 대한제국은 일제에 나라를 빼앗기고 일본의 식민지가 되었다."],["헌병","憲兵","법 헌|병사 병","군대 안에서 경찰의 역할을 하는 군인","일제는 헌병에게 경찰의 임무를 맡겨 우리나라 사람들을 감시하고 독립운동을 탄압하였다."],["신사","","귀신 신|토지신 사","일본 왕실의 조상, 일본에 큰 공을 세운 사람 등을 신으로 모시는 곳","일제는 우리나라 전국에 신사를 세우고 우리나라 사람들에게 강제로 절하게 하였다."],["징용","徵用","부를 징|쓸 용","강제로 동원하여 일을 하게 함","일제는 침략 전쟁에 우리나라 사람들을 강제로 징용하여 탄광이나 무기 공장 등에서 일하게 하였다."],["3·1운동(삼일운동)","三一運動","석 삼|한 일|옮길 운|움직일 동","일제의 지배에 저항하고 우리나라의 독립을 요구하며 전국에서 벌인 만세 운동","1919년 3월 1일, 학생과 시민들은 독립 만세를 외치며 3·1 운동(삼일운동)에 참여했다."],["임시정부","臨時政府","임할 임|때 시|정사 정|관청 부","1919년 4월에 중국 상하이에서 대한민국의 광복을 위하여 임시로 조직한 정부","3·1 운동 이후 여러 임시 정부의 힘을 하나로 모아 중국 상하이에 대한민국 임시 정부를 세웠다."],["광복","光復","빛 광|회복할 복","빼앗긴 나라의 땅과 주권을 되찾음","1945년 8월 15일 일본이 연합군에 항복하면서 우리나라는 광복을 맞이했다."],["신탁통치","信託統治","믿을 신|부탁할 탁|통 거느릴|치 다스릴","특정 국가가 다른 나라의 일정 지역을 대신 다스리는 제도","모스크바 3국 외무 장관 회의에서 한반도에 임시 정부를 세우고 신탁 통치를 하기로 결정되었다."],["제헌","制憲","절제할 제|법 헌","헌법을 만들어 정함","제헌 국회에서는 대한민국을 나라 이름으로 정하고, 헌법을 만들어 널리 알렸다."],["정전","停戰","머무를 정|싸움 전","전쟁 중에 서로 합의하여 일시적으로 전투를 중단하는 일","1953년 7월 정전 협정이 체결되면서 휴전선이 확정되었다."],["피란","避亂","피할 피|어지러울 란","전쟁 등의 난리를 피해 다른 곳으로 옮겨 감","전쟁으로 인해 많은 사람이 피란길에 올랐다."]]},"아이스크림":{"1단원":[["유물","遺物","남길 유|물건 물","앞선 세대의 사람들이 후세에 남긴 물건","선사 시대 사람들이 사용했던 토기와 돌로 만든 도구 같은 유물이 발견되었다."],["유적","遺跡","남길 유|발자취 적","옛사람들이 남긴 건축물이나 무덤, 역사적인 사건이 일어난 장소 등의 흔적","선사 시대 사람들이 살았던 집터와 무덤 같은 유적이 발견되었다."],["선사시대","先史時代","먼저 선|역사 사|때 시|대신할 대","문자를 사용하기 이전의 시대, 글로 쓰인 기록이 없는 시대","선사 시대에는 문자를 사용하지 않았기 때문에 당시 사람들이 남긴 유적과 유물을 통해 생활 모습을 알 수 있다."],["구석기시대","舊石器時代","옛 구|돌 석|그릇 기|때 시|대신할 대","사람들이 돌을 깨뜨리거나 떼어서 만든 뗀석기를 주로 사용하던 선사 시대의 한 시기","구석기 시대 사람들은 뗀석기를 사용하여 사냥과 채집을 하며 생활했다."],["신석기시대","新石器時代","새 신|돌 석|그릇 기|때 시|대신할 대","사람들이 돌을 갈고 다듬어 정교하게 만든 간석기를 사용하던 선사 시대의 한 시기","신석기 시대 사람들은 간석기를 사용하고 농사를 지으며 정착 생활을 하였다."],["토기","土器","흙 토|그릇 기","흙으로 빚은 뒤 불에 구워 만든 그릇","신석기 시대 사람들은 음식을 보관하거나 조리하기 위해 빗살무늬 토기를 만들어 사용했다."],["기원전","紀元前","벼리 기|으뜸 원|앞 전","연대를 계산하는 기준인 기원(서기 1년) 이전의 기간","기원전 2000년경에서 기원전 1500년경 청동기 문화가 퍼지기 시작했다."],["청동기","靑銅器","푸를 청|구리 동|그릇 기","구리에 주석이나 납을 섞어서 만든 도구","청동기는 주로 지배자와 제사장의 제사 도구나 장신구, 무기 등으로 사용되었다."],["청동기시대","靑銅器時代","청 푸를|동 구리|그릇 기|때 시|대신할 대","사람들이 구리와 주석 등을 섞어 만든 도구인 청동기를 사용한 시기","청동기 시대에는 청동으로 만든 도구를 사용하고 농사를 지으며 생활했다."],["지배자","支配者","지탱할 지|짝 배|사람 자","남을 지배하거나 지배적인 위치에 있는 사람","청동기 시대에는 힘과 권력을 키워 다른 사람들을 다스리는 지배자가 나타났다."],["채석장","採石場","캘 채|돌 석|마당 장","재료로 쓸 돌을 캐거나 떼어 내는 곳","고창 고인돌 유적에는 고인돌의 돌을 떼어 내던 채석장이 남아 있다."],["고조선","古朝鮮","옛 고|아침 조|고울 선","단군왕검이 세운 우리 역사 최초의 나라","청동기 문화를 바탕으로 단군왕검은 우리 역사 속 최초의 국가인 고조선을 세웠다."],["비파","琵琶","비파 비|비파 파","둥글고 긴 타원형의 몸체를 가지고 있는 악기","고조선의 대표적인 문화유산에는 비파형 동검과 탁자식 고인돌이 있다."],["철기문화","鐵器文化","쇠 철|그릇 기|글월 문|될 화","철로 만든 도구를 사용하면서 발전한 문화","고조선이 멸망할 무렵 한반도와 주변 지역에서는 철기 문화를 바탕으로 여러 나라가 세워졌다."],["고구려","高句麗","높을 고|글귀 구|고울 려","주몽이 졸본 지역에 세운 나라로, 삼국 시대의 삼국 가운데 하나","광개토대왕은 활발한 정복 활동을 펼쳐 고구려의 영토를 크게 넓혔다."],["조공","朝貢","아침 조|바칠 공","한 나라가 힘이 센 다른 나라와 교류하면서 예물을 바치던 일","백제와 신라는 고구려에 조공을 바치기도 하였다."],["백제","百濟","일백 백|건널 제","온조가 한강 유역에 세운 나라로, 삼국 시대의 삼국 가운데 하나","백제는 한강 유역의 지리적 이점을 바탕으로 성장하여 주변 나라들과 활발하게 교류하였다."],["신라","新羅","새 신|그물 라","박혁거세가 경주 지역에 세운 나라로, 삼국 시대의 삼국 가운데 하나","신라는 진흥왕 때 한강 유역을 차지하며 크게 성장하였다."],["연맹","聯盟","잇닿을 련(연)|맹세 맹","서로 돕고 함께 행동할 것 을 약속한 집단이나 국가","여러 나라가 모여 가야 연맹을 이루어 발전하였다."],["서역","西域","서녘 서|지경 역","옛날에 중국의 서쪽에 있던 여러 나라를 통틀어 이르는 말","신라의 무덤에서 서역의 유리병과 잔이 발견된 것으로 보아 신라가 서역과 교류했음을 알 수 있다."],["신분","身分","몸 신|나눌 분","사회에서 개인이 차지하는 지위나 위치","삼국 시대에는 신분을 귀족, 평민, 천민으로 구분하였다."],["고분벽화","古墳壁畫","옛 고|무덤 분|벽 벽|그림 화","옛날에 만들어진 무덤 속 벽이나 천장에 그린 그림","고구려 고분 벽화에는 당시 사람들의 생활 모습과 신분에 따른 차이가 나타나 있다."],["토우","土偶","흙 토|짝 우","흙으로 빚은 사람이나 동물의 인형","신라의 무덤에서는 당시 사람들의 모습을 본떠 만든 토우가 발견되었다."],["불교","佛敎","부처 불|가르칠 교","인도의 석가모니가 만든 부처님의 가르침을 따르는 종교","삼국 시대에는 불교를 통해 백성들의 마음을 하나로 모으고 왕권을 강화하였다."],["통일신라","統一新羅","거느릴 통|한 일|새 신|그물 라","신라가 백제와 고구려를 멸망시키고 당을 몰아내어 삼국 통일을 이룬 이후의 신라","통일 신라는 넓어진 영토와 늘어난 인구를 다스리기 위해 나라의 제도를 정비하였다."],["무역","貿易","무역할 무|바꿀 역","지역 간 또는 나라 간에 서로 물건을 사고팔거나 교환하는 일","통일 신라는 당, 일본 등 주변 나라와 활발하게 무역하며 여러 물건을 주고받았다."],["발해","渤海","발해 발|바다 해","고구려 출신 대조영이 고구려 유민과 말갈인 일부를 이끌고 고구려의 옛 땅인 동모산 근처에 세운 나라","발해는 고구려를 계승한 나라이다."],["해동성국","海東盛國","바다 해|동녘 동|성할 성|나라 국","크게 발전하고 번성한 발해를 당나라에서 부르던 말","당에서는 발해를 바다 동쪽에서 크게 번성한 나라라는 뜻으로 ‘해동성국’이라고 불렀다."],["호족","豪族","호걸 호|겨레 족","통일신라 말 고려 초에 경제력과 군사력을 바탕으로 지방에서 성장한 정치 세력","통일신라 말 지배층의 권력 다툼으로 나라가 혼란해지자 지방에서 호족이 성장했다."],["고려","高麗","높을 고|고울 려","왕건이 후삼국을 통일하고 918년에 세운 나라","왕건은 고구려를 계승한다는 뜻으로 나라 이름을 고려라고 했다."],["과거제","科擧制","과목 과|들 거|절제할 제","관리를 뽑을 때 실시하던 시험 제도","고려에서는 과거제를 실시해 능력 있는 관리를 뽑았다."],["담판","談判","말씀 담|판단할 판","서로 맞선 사람들이 의논 해 옳고 그름을 판단함","서희는 거란과의 외교 담판을 통해 고려가 강동 6주 지역을 얻는 데 기여했다."],["벽란도","碧瀾渡","푸를 벽|물결 란|건널 도","고려 시대에 외국과의 무역이 활발하게 이루어졌던 국제 무역항","고려 시대에는 벽란도를 통해 송, 거란, 여진, 일본, 아라비아 상인들과 활발히 교류했다."],["상감기법","象嵌技法","코끼리 상|산골짜기 감|재주 기|법 법","겉면에 무늬를 새겨 파내고 다른 색의 흙으로 그 자리를 메꾼 뒤 유약을 발라 구워내는 기법","고려 시대에는 청자에 무늬를 새기는 데 상감 기법을 사용하였다."],["대장경","大藏經","큰 대|감출 장|날 경","부처의 가르침이 담긴 여 러 경전을 모아서 하나로 완성한 불교 경전","고려 사람들은 불교의 힘으로 나라를 지키고자 거란의 침입 때는 초조대장경을, 몽골의 침입 때는 팔만대장경을 만들었다."],["금속활자","屬活字","쇠 금|무리 속|살 활|글자 자","글을 인쇄하기 위해 금속으로 만든 낱개의 글자판","고려 사람들은 세계 최초로 금속활자를 발명하여 책을 인쇄했다."]],"2단원":[["신진사대부","新進士大夫","새 신|진 나아갈|선비 사|큰 대|부 지아 비","고려 말에 등장하여 성리학을 공부하고 개혁을 추진한 새로운 정치 세력","이성계는 일부 신진 사대부와 함께 고려를 무너뜨리고 조선을 건국했다."],["조선","朝鮮","아침 조|고울 선","이성계가 고려를 무너뜨리고 1392년에 세운 나라로, 유교를 바탕으로 나라를 다스린 왕조","조선은 한양을 수도로 정하였다."],["유교","儒敎","선비 유|가르칠 교","중국에서 생겨난 사상으로, 나라를 다스리는 데 필요한 질서와 사람이 지켜야 할 도리를 중요하게 여김","조선은 유교를 나라의 기본 정신으로 삼았다."],["서원","書院","글 서|집 원","유학자들이 모여서 유교를 공부하고 훌륭한 유학자를 제사 지내던 곳","조선 시대에는 지방에 서원을 세워 유교의 가르침을 널리 알렸다."],["국역","國役","나라 국|부역 역","세금을 내고 군대에 가며 큰 공사 등에 참여해야 하는 의무","조선 시대에 양반은 관리가 되어 나랏일에 참여하면서 국역을 면제받았다."],["의병","義兵","옳을 의|병사 병","외적의 침입을 물리치려고 백성이 스스로 만든 군대","임진왜란 때 백성들은 스스로 의병을 조직하여 일본군에 맞서 싸웠다."],["실학","實學","열매 실|배울 학","백성의 삶과 연관된 현실의 사회 문제를 해결하려는 학문","실학자들은 농업, 상업과 수공업, 우리 역사와 지리 등 다양한 분야를 연구했다."],["천주교","天主敎","하늘 천|임금 주|가르칠 교","하느님을 믿고 모든 사람이 평등하다는 가르침을 따르는 종교","조선 후기에는 서양의 종교인 천주교가 서학이라는 이름으로 전해졌다."],["동학","東學","동녘 동|배울 학","조선 후기에 우리 고유의 것을 지키고 사람의 평등을 중요하게 여기며 만들어진 종교","동학은 모든 사람이 소중하고 평등하며 우리 것을 존중해야 한다는 생각을 중요하게 여겼다"],["서민","庶民","여러 서|백성 민","벼슬이나 신분에 따른 특권을 갖지 못한 일반 백성","조선 후기에는 경제적으로 여유가 생긴 서민들이 문화와 예술을 즐기면서 서민 문화가 발달하였다."],["풍속화","風俗畫","바람 풍|풍속 속|그림 화","전문 화가들이 백성의 생활 모습을 그린 그림","풍속화에는 양반, 농민, 여성, 아이 등 당시 사람들의 다양한 생활 모습이 나타난다."],["민화","民畫","백성 민|그림 화","일반 백성들이 생활 속에서 즐겨 그린 그림","민화에는 서민들의 소망이 담겨 있다."],["통상","通商","통할 통|헤아릴 상","외국과 서로 물건을 사고
