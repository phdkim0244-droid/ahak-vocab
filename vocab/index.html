<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>청자골 아학 어휘력</title>
<meta name="description" content="초등 3~6학년 교과서 어휘력 교재 — 학년·학기·교과·단원별 어휘 카드와 골든벨 퀴즈">
<meta name="theme-color" content="#2E7D6E">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아학 어휘력">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
@font-face{font-family:"AhakSerif";src:url(../shared/fonts/NotoSerifKR-hanja.woff2) format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+2E80-2FDF,U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+20000-2FA1F}

/* Layout: 상단 선택 박스 5개, 아래는 좌측(어휘 목록 + 골든벨) / 우측(상세) 2단. 폰·태블릿 모두 2단 유지 */
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --ink:#1B2B33; --muted:#5C6F76; --line:#D3E0DA;
  --celadon:#2E7D6E; --celadon-soft:#DDEEE7; --gold:#C98A0B; --gold-soft:#FBEFCF;
  --um:#1F8A5B; --gold-ink:#8A5A00; --ok:#1E8A4F; --ok-soft:#DDF3E5; --bad:#C23B3B; --bad-soft:#FADFDF;
  --f-body:-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-han:"AhakSerif","Noto Serif KR","Apple Myungjo","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1E; --surface:#17262B; --ink:#E6F0EC; --muted:#93A8A2; --line:#2A3D42;
  --celadon:#6CC4AE; --celadon-soft:#1F3B37; --gold:#F0B43A; --gold-soft:#3A3014;
  --um:#5FD8A0; --gold-ink:#F0B43A; --ok:#62D38E; --ok-soft:#1B3A2A; --bad:#F08080; --bad-soft:#3F2020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1E; --surface:#17262B; --ink:#E6F0EC; --muted:#93A8A2; --line:#2A3D42;
  --celadon:#6CC4AE; --celadon-soft:#1F3B37; --gold:#F0B43A; --gold-soft:#3A3014;
  --um:#5FD8A0; --gold-ink:#F0B43A; --ok:#62D38E; --ok-soft:#1B3A2A; --bad:#F08080; --bad-soft:#3F2020; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;overflow-x:hidden}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px;max-width:1100px;margin-inline:auto}
header{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.brand .tag{font-size:clamp(15px,4.2vw,20px);font-weight:800;color:#fff;background:var(--celadon);padding:3px 12px;border-radius:999px;letter-spacing:-.01em;white-space:nowrap}
:root:not([data-theme="light"]) .brand .tag{color:#0F1A1E}
.brand .grades{white-space:nowrap;font-size:13px;font-weight:700;color:var(--gold-ink)}
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.filters label{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:11px;color:var(--muted);font-weight:500}
.filters label:nth-child(-n+3){grid-column:span 2}
.filters label:nth-child(n+4){grid-column:span 3}
select{width:100%;min-width:0;height:42px;padding:0 28px 0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;font-weight:500;text-overflow:ellipsis;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}
select:focus{border-color:var(--celadon)}
@media (min-width:760px){
  .filters{grid-template-columns:repeat(5,minmax(0,1fr))}
  .filters label:nth-child(n){grid-column:auto}
  .brand h1{font-size:21px}
}
main{flex:1;min-height:0;display:grid;grid-template-columns:clamp(116px,36%,300px) minmax(0,1fr);gap:10px}
.left{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.listwrap{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.listhead{padding:10px 10px 8px;background:var(--celadon-soft);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.listhead small{font-size:11px;color:var(--muted)}
.listhead .row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.listhead b{color:var(--ink);font-weight:800;font-size:17px;word-break:keep-all}
.listhead span{font-size:12px;color:var(--muted)}
#vocab{list-style:none;margin:0;padding:4px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
#vocab button{width:100%;display:flex;gap:8px;align-items:baseline;text-align:left;border:0;background:transparent;padding:10px 8px;min-height:44px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:500;word-break:keep-all}
#vocab button .n{font-size:11px;color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
#vocab button:hover{background:var(--celadon-soft)}
#vocab button[aria-current="true"]{background:var(--celadon);color:#fff}
#vocab button[aria-current="true"] .n{color:inherit;opacity:.8}
:root:not([data-theme="light"]) #vocab button[aria-current="true"]{color:#0F1A1E}
.bell{flex:none;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bell .t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--ink)}
.bell svg{width:22px;height:22px;flex:none;color:var(--gold)}
.bell p{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.btn{white-space:nowrap;border:0;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700;font-size:15px;cursor:pointer;background:var(--celadon);color:#fff}
:root:not([data-theme="light"]) .btn{color:#0F1A1E}
.btn.gold{background:var(--gold);color:#fff}
:root:not([data-theme="light"]) .btn.gold{color:#1B1503}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.detail{min-width:0;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.crumb{font-size:12px;color:var(--muted)}
.word{font-family:var(--f-han);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0;word-break:keep-all}
.hanja{display:flex;flex-wrap:wrap;gap:8px}
.hz{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;min-width:58px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.hz big{font-family:var(--f-han);font-size:clamp(30px,6vw,40px);line-height:1.1;font-weight:600;color:var(--celadon)}
.hz small{font-size:12px;color:var(--muted);white-space:nowrap}
.hz .um{color:var(--um);font-weight:800}
.hz small .um{font-size:15px}
.hzline{font-family:var(--f-han);font-size:26px;color:var(--celadon)}
.sec h3{margin:0 0 4px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sec p{margin:0;font-size:clamp(16px,2.6vw,19px);line-height:1.6;word-break:keep-all}
.sec .ex{background:var(--celadon-soft);border-radius:10px;padding:12px 14px}
.sec .ex mark{background:transparent;color:var(--celadon);font-weight:700;border-bottom:2px solid var(--celadon)}
.muted{color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:auto}
.nav .btn{flex:1}
.empty{margin:auto;text-align:center;color:var(--muted)}
/* quiz overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,20,24,.62);display:flex;align-items:stretch;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.quiz{background:var(--bg);width:100%;max-width:680px;display:flex;flex-direction:column;gap:12px;padding:14px 16px;overflow-y:auto}
@media (min-width:700px){.ov{align-items:center;padding:20px}.quiz{border-radius:18px;max-height:min(100%,780px)}}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qtop h2{margin:0;font-size:16px;display:flex;align-items:center;gap:6px}
.qtop h2 svg{width:22px;height:22px;color:var(--gold)}
.lives{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.lives i{width:16px;height:16px;border-radius:50%;background:var(--bad);display:inline-block}
.lives i.off{background:transparent;border:2px solid var(--line)}
.ladder{display:flex;gap:4px}
.ladder span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.ladder span.ok{background:var(--ok)}.ladder span.bad{background:var(--bad)}.ladder span.cur{background:var(--gold)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.qtype{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.qtext{font-size:clamp(17px,3vw,20px);line-height:1.55;margin:0;font-weight:500;word-break:keep-all}
.qhz{font-family:var(--f-han);font-size:34px;color:var(--celadon);font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;font-weight:500;word-break:keep-all}
.opt b{width:26px;height:26px;border-radius:50%;background:var(--celadon-soft);color:var(--celadon);display:grid;place-items:center;font-size:13px;flex:none}
.opt:hover:not(:disabled){border-color:var(--celadon)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb strong{display:block;font-size:16px;margin-bottom:2px}
.res{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-block:10px}
.res .big{width:84px;height:84px;color:var(--gold)}
.res.win .big{animation:ring 1.2s ease-in-out 2;transform-origin:50% 10%}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.res.win .big{animation:none}}
.res h2{margin:0;font-size:22px}
.wr{width:100%;text-align:left;display:flex;flex-direction:column;gap:6px}
.wr div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;width:100%}.row .btn{flex:1}

/* 색인 */
.ixbtn{margin-left:auto;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--celadon);background:transparent;color:var(--celadon);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.ixbtn:hover{background:var(--celadon-soft)}
.ix{background:var(--bg);width:100%;max-width:820px;display:flex;flex-direction:column;min-height:0}
@media (min-width:700px){.ix{border-radius:18px;max-height:min(100%,860px)}}
.ixhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.ixhead .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ixhead h2{margin:0;font-size:18px}
.ixhead input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:var(--surface);color:var(--ink)}
.ixhead input:focus{border-color:var(--celadon);outline:none}
.ixbody{overflow-y:auto;padding:10px 16px 16px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.ix details{margin:0}
.ix summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 8px;border-radius:9px;font-weight:700}
.ix summary::-webkit-details-marker{display:none}
.ix summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s;flex:none}
.ix details[open]>summary::before{transform:rotate(90deg)}
.ix summary:hover{background:var(--celadon-soft)}
.ix summary em{font-style:normal;font-weight:500;font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.ix .l1>summary{font-size:17px;color:var(--celadon);background:var(--celadon-soft)}
.ix .l2>summary{font-size:15px}
.ix .l3>summary{font-size:14px}
.ix .l4>summary{font-size:14px;font-weight:600}
.ix .l5>summary{font-size:13px;font-weight:600;color:var(--gold-ink)}
.ix .kid{margin-left:12px;padding-left:8px;border-left:2px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 10px 8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;min-height:34px;font-size:14px;cursor:pointer;word-break:keep-all}
.chip small{color:var(--muted);font-family:var(--f-han);margin-left:4px}
.chip:hover{border-color:var(--celadon);background:var(--celadon-soft)}
.hit{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 6px;min-height:48px;cursor:pointer}
.hit:hover{background:var(--celadon-soft)}
.hit b{font-size:16px}.hit b small{font-family:var(--f-han);font-weight:500;color:var(--celadon);margin-left:6px}
.hit span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.brand .grades{display:none}.brand h1{font-size:17px}}

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>청자골 아학</h1><span class="tag">교과서 어휘력편</span><span class="grades">초등 3~6학년</span><button class="ixbtn" id="ixBtn" type="button">어휘 찾기</button></div>
    <div class="filters" role="group" aria-label="교재 선택">
      <label for="selGrade">학년<select id="selGrade"></select></label>
      <label for="selSem">학기<select id="selSem"></select></label>
      <label for="selSubject">교과<select id="selSubject"></select></label>
      <label for="selPub">출판사<select id="selPub"></select></label>
      <label for="selUnit">단원<select id="selUnit"></select></label>
    </div>
  </header>
  <main>
    <section class="left" aria-label="단원 어휘">
      <div class="listwrap">
        <div class="listhead"><small id="unitSub"></small><div class="row1"><b id="unitName">단원</b><span id="cnt"></span></div></div>
        <ul id="vocab"></ul>
      </div>
      <div class="bell">
        <div class="t"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a1.6 1.6 0 0 1 1.6 1.6v.5A6.5 6.5 0 0 1 18.5 10.5v3.2l1.7 2.6a1 1 0 0 1-.84 1.55H4.64a1 1 0 0 1-.84-1.55l1.7-2.6v-3.2a6.5 6.5 0 0 1 4.9-6.4v-.5A1.6 1.6 0 0 1 12 2zm-2.2 17h4.4a2.2 2.2 0 0 1-4.4 0z"/></svg>어휘 골든벨</div>
        <p id="bellInfo"></p>
        <button class="btn gold" id="bellBtn" type="button">도전하기</button>
      </div>
    </section>
    <section class="detail" id="detail" aria-live="polite"></section>
  </main>
</div>
<div class="ov" id="ixov" hidden><div class="ix" id="ixp" role="dialog" aria-modal="true" aria-label="전체 어휘 색인">
  <div class="ixhead"><div class="r"><h2>전체 어휘 색인</h2><button class="btn ghost" id="ixClose" type="button" style="min-height:38px">닫기</button></div>
  <input id="ixq" type="search" placeholder="어휘나 한자 검색 (예: 지도, 地)" autocomplete="off"><div class="muted" id="ixsum" style="font-size:12px"></div></div>
  <div class="ixbody" id="ixbody"></div></div></div>
<div class="ov" id="ov" hidden><div class="quiz" id="quiz" role="dialog" aria-modal="true" aria-label="어휘 골든벨"></div></div>
<script src="data.js"></script>
<script>
const DATA=VDATA;
const SUBJ=['국어','수학','사회','과학'];
const $=id=>document.getElementById(id);
const S={g:null,s:null,sub:null,pub:null,unit:null,i:0};
const BELL='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a1.6 1.6 0 0 1 1.6 1.6v.5A6.5 6.5 0 0 1 18.5 10.5v3.2l1.7 2.6a1 1 0 0 1-.84 1.55H4.64a1 1 0 0 1-.84-1.55l1.7-2.6v-3.2a6.5 6.5 0 0 1 4.9-6.4v-.5A1.6 1.6 0 0 1 12 2zm-2.2 17h4.4a2.2 2.2 0 0 1-4.4 0z"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
const keysOf=(o,num)=>{const k=Object.keys(o);return num?k.sort((a,b)=>a-b):k};
function fill(sel,vals,cur,fmt){
  sel.innerHTML=vals.map(v=>`<option value="${esc(v)}">${esc(fmt?fmt(v):v)}</option>`).join('');
  const use=vals.map(String).includes(String(cur))?String(cur):String(vals[0]);
  sel.value=use;return use;
}
function sync(from){
  if(from==='init'){Object.assign(S,store('ja-sel')||{})}
  const gs=keysOf(DATA,1);S.g=fill($('selGrade'),gs,S.g,v=>v+'학년');
  const ss=keysOf(DATA[S.g],1);S.s=fill($('selSem'),ss,S.s,v=>v+'학기');
  const subs=SUBJ.filter(x=>DATA[S.g][S.s][x]);S.sub=fill($('selSubject'),subs,S.sub);
  const pubs=keysOf(DATA[S.g][S.s][S.sub]);S.pub=fill($('selPub'),pubs,S.pub);
  const units=keysOf(book());S.unit=fill($('selUnit'),units,S.unit);
  if(from!=='idx'&&from!=='init')S.i=0;
  if(S.i>=units_items().length)S.i=0;
  store('ja-sel',{g:S.g,s:S.s,sub:S.sub,pub:S.pub,unit:S.unit});
  renderList();renderDetail();renderBell();
}
const book=()=>DATA[S.g][S.s][S.sub][S.pub];
const units_items=()=>book()[S.unit]||[];
function renderList(){
  const it=units_items();
  $('unitName').textContent=S.unit;$('unitSub').textContent=S.g+'학년 '+S.s+'학기 '+S.sub;$('cnt').textContent=it.length+'개';
  $('vocab').innerHTML=it.map((w,i)=>`<li><button type="button" data-i="${i}" aria-current="${i===S.i}"><span class="n">${i+1}</span><span>${esc(w[0])}</span></button></li>`).join('');
  const cur=$('vocab').querySelector('[aria-current="true"]');if(cur)cur.scrollIntoView({block:'nearest'});
}
function renderDetail(){
  const it=units_items(),w=it[S.i],d=$('detail');
  if(!w){d.innerHTML='<p class="empty">왼쪽에서 어휘를 골라 보세요.</p>';return}
  const [word,hz,hun,mean,ex]=w;
  const parts=hun?hun.split('|'):[];
  const wordH=esc(word);
  let h='';
  if(hz){
    if(parts.length===hz.length) h='<div class="hanja">'+[...hz].map((c,i)=>{const tk=parts[i].trim().split(/\s+/),um=tk.pop();return `<div class="hz"><big>${c}</big><small>${esc(tk.join(' '))} <span class="um">${esc(um)}</span></small></div>`}).join('')+'</div>';
    else h=`<div><div class="hzline">${hz}</div><div class="muted" style="font-size:13px">${esc(parts.join(' '))}</div></div>`;
  }else h='<div class="muted" style="font-size:14px">한자 표기가 없는 어휘예요.</div>';
  const exh=ex?esc(ex).split(esc(word)).join(`<mark>${esc(word)}</mark>`):'<span class="muted">교재에 예시 표현이 없어요.</span>';
  d.innerHTML=`<div class="crumb">${S.g}학년 ${S.s}학기 · ${S.sub} · ${esc(S.pub)} · ${esc(S.unit)}</div>
  <h2 class="word">${wordH}</h2>
  <div class="sec"><h3>한자</h3>${h}</div>
  <div class="sec"><h3>뜻</h3><p>${mean?esc(mean):'<span class="muted">교재에 뜻풀이가 없어요.</span>'}</p></div>
  <div class="sec"><h3>예시 표현</h3><p class="ex">${exh}</p></div>
  <div class="nav"><button class="btn ghost" id="prev" type="button" ${S.i===0?'disabled':''}>‹ 이전</button><button class="btn" id="next" type="button" ${S.i>=it.length-1?'disabled':''}>다음 ›</button></div>`;
  d.scrollTop=0;
}
function pick(i){S.i=i;renderList();renderDetail()}
function renderBell(){
  const n=units_items().length,b=store('ja-best')||{};
  const best=b[[S.g,S.s,S.sub,S.pub,S.unit].join('/')];
  $('bellInfo').textContent=n<2?'어휘가 부족해요.':`이 단원 어휘로 ${Math.min(10,n)}문제. 기회는 3번이에요.`+(best!=null?` 최고 ${best}점`:'');
  $('bellBtn').disabled=n<2;
}
['Grade','Sem','Subject','Pub','Unit'].forEach(k=>$('sel'+k).addEventListener('change',e=>{
  const m={Grade:'g',Sem:'s',Subject:'sub',Pub:'pub',Unit:'unit'}[k];S[m]=e.target.value;sync(k==='Unit'?'unit':k)}));
$('vocab').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(+b.dataset.i)});
$('detail').addEventListener('click',e=>{
  if(e.target.id==='prev')pick(S.i-1);if(e.target.id==='next')pick(S.i+1)});
document.addEventListener('keydown',e=>{
  if($('ov').hidden&&!/SELECT|INPUT/.test(document.activeElement.tagName)){
    if(e.key==='ArrowDown'&&S.i<units_items().length-1){pick(S.i+1);e.preventDefault()}
    if(e.key==='ArrowUp'&&S.i>0){pick(S.i-1);e.preventDefault()}}
  if(e.key==='Escape'){closeQuiz();closeIx()}});

/* ---------- 골든벨 ---------- */
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q=null;
function makeQuestions(){
  const items=units_items(),pool=[].concat(...Object.values(book()));
  const uniq=a=>{const s=new Set();return a.filter(x=>!s.has(x)&&s.add(x))};
  const qs=[];
  const lastT=[];
  shuf(items).slice(0,10).forEach(w=>{
    const [word,hz,hun,mean,ex]=w,types=[];
    if(mean)types.push('mean');
    if(hz)types.push('hanja');
    if(ex&&ex.includes(word))types.push('blank');
    if(mean)types.push('rev');
    if(!types.length)types.push('hanja0');
    const pref=types.filter(t=>t!==lastT[lastT.length-1]);
    const t=shuf(pref.length?pref:types)[0];lastT.push(t);
    const near=shuf(items.filter(x=>x[0]!==word)).concat(shuf(pool.filter(x=>x[0]!==word)));
    let ans,opts,prompt,hint='',type;
    if(t==='rev'){
      type='뜻 고르기';prompt=`‘${word}’의 뜻으로 알맞은 것은?`;
      ans=mean;opts=uniq([mean].concat(near.filter(x=>x[3]&&x[3]!==mean).map(x=>x[3]))).slice(0,4);
    }else{
      ans=word;
      opts=uniq([word].concat(near.map(x=>x[0]))).slice(0,4);
      if(t==='mean'){type='뜻풀이';prompt='다음 뜻에 알맞은 어휘는?';hint=mean.split(word).join('○○')}
      else if(t==='blank'){type='빈칸 채우기';prompt='빈칸에 들어갈 알맞은 어휘는?';hint=ex.split(word).join('(　　　)')}
      else{type='한자 어휘';prompt='다음 한자로 이루어진 어휘는?';
        const p=hun?hun.split('|'):[];hint=`<span class="qhz">${hz}</span>`+(p.length?`<div class="muted" style="font-size:13px">${esc(p.join(' · '))}</div>`:'');}
    }
    qs.push({type,prompt,hint,html:t==='hanja'||t==='hanja0',ans,opts:shuf(opts),w});
  });
  return qs;
}
function openQuiz(){
  Q={qs:makeQuestions(),i:0,lives:3,res:[],score:0,done:false,picked:null};
  $('ov').hidden=false;drawQ();$('quiz').scrollTop=0;
}
function closeQuiz(){$('ov').hidden=true;Q=null;renderBell()}
const ladder=()=>'<div class="ladder">'+Q.qs.map((_,i)=>`<span class="${Q.res[i]||(i===Q.i&&!Q.done?'cur':'')}"></span>`).join('')+'</div>';
const lives=()=>'<div class="lives" aria-label="남은 기회 '+Q.lives+'번">기회 '+[0,1,2].map(i=>`<i class="${i<Q.lives?'':'off'}"></i>`).join('')+'</div>';
function drawQ(){
  const q=Q.qs[Q.i],box=$('quiz');
  const hint=q.hint?(q.html?q.hint:`<p class="qtext" style="background:var(--celadon-soft);border-radius:10px;padding:10px 12px">${esc(q.hint)}</p>`):'';
  const L='①②③④';
  box.innerHTML=`<div class="qtop"><h2>${BELL}어휘 골든벨</h2>${lives()}</div>${ladder()}
  <div class="qcard"><div class="qtype">${Q.i+1} / ${Q.qs.length} · ${q.type}</div><p class="qtext">${esc(q.prompt)}</p>${hint}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button type="button" class="opt" data-o="${i}"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="fb"></div>
  <button class="btn ghost" type="button" id="qquit">그만하기</button>`;
}
function answer(oi){
  const q=Q.qs[Q.i];if(Q.picked!==null)return;
  Q.picked=oi;const ok=q.opts[oi]===q.ans;
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;
    if(q.opts[i]===q.ans)b.classList.add('right');else if(i===oi)b.classList.add('wrong')});
  Q.res[Q.i]=ok?'ok':'bad';if(ok)Q.score++;else Q.lives--;
  const [word,hz,hun,mean,ex]=q.w;
  const last=Q.i>=Q.qs.length-1,out=Q.lives<=0;
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><strong>${ok?'정답이에요!':'아쉬워요. 정답은 ‘'+esc(q.type==='뜻 고르기'?word:q.ans)+'’'}</strong>${esc(word)}${hz?' ('+hz+')':''} · ${esc(mean||'')}</div>
  <button class="btn" type="button" id="qnext" style="width:100%;margin-top:8px">${out||last?'결과 보기':'다음 문제'}</button>`;
  document.querySelector('.qtop .lives').outerHTML=lives();
  document.querySelector('.ladder').outerHTML=ladder();
  $('qnext').scrollIntoView({block:'nearest'});$('qnext').focus({preventScroll:true});
}
function nextQ(){
  const out=Q.lives<=0,last=Q.i>=Q.qs.length-1;
  Q.picked=null;
  if(out||last){return result()}
  Q.i++;drawQ();$('quiz').scrollTop=0;
}
function result(){
  Q.done=true;
  const total=Q.qs.length,pts=Math.round(Q.score/total*100),win=Q.lives>0&&Q.res.length===total;
  const key=[S.g,S.s,S.sub,S.pub,S.unit].join('/'),b=store('ja-best')||{};
  if(b[key]==null||pts>b[key]){b[key]=pts;store('ja-best',b)}
  const wrong=Q.qs.filter((_,i)=>Q.res[i]==='bad');
  const skipped=total-Q.res.length;
  $('quiz').innerHTML=`<div class="res ${win?'win':''}">
    <div class="big">${BELL}</div>
    <h2>${win?'골든벨을 울렸어요!':'다음엔 꼭 울려 봐요'}</h2>
    <div class="muted">${Q.score}문제 정답 · ${pts}점${skipped?` · ${skipped}문제 남음`:''}</div>
    ${wrong.length?`<div class="wr"><strong style="font-size:13px" class="muted">다시 볼 어휘</strong>${wrong.map(q=>`<div><b>${esc(q.w[0])}</b>${q.w[1]?' ('+q.w[1]+')':''}<br><span class="muted">${esc(q.w[3]||'')}</span></div>`).join('')}</div>`:''}
    <div class="row"><button class="btn gold" type="button" id="qagain">다시 도전</button><button class="btn ghost" type="button" id="qclose">닫기</button></div></div>`;
  $('quiz').scrollTop=0;
}
$('bellBtn').addEventListener('click',openQuiz);
$('ov').addEventListener('click',e=>{
  if(e.target===$('ov'))return;
  const o=e.target.closest('.opt');if(o)return answer(+o.dataset.o);
  const id=e.target.id;
  if(id==='qnext')nextQ();else if(id==='qagain')openQuiz();else if(id==='qclose'||id==='qquit')closeQuiz();
});

/* ---------- 전체 색인 ---------- */
const ALL=[];
for(const g of keysOf(DATA,1))for(const s of keysOf(DATA[g],1))for(const sub of SUBJ.filter(x=>DATA[g][s][x]))for(const p of keysOf(DATA[g][s][sub]))for(const u of keysOf(DATA[g][s][sub][p]))DATA[g][s][sub][p][u].forEach((w,i)=>ALL.push({g,s,sub,p,u,i,w}));
const cntOf=o=>Object.values(o).reduce((a,v)=>a+(Array.isArray(v)?v.length:cntOf(v)),0);
function treeHTML(){
  let h='';
  for(const g of keysOf(DATA,1)){
    h+=`<details class="l1"><summary>${g}학년<em>${cntOf(DATA[g])}개</em></summary><div class="kid">`;
    for(const s of keysOf(DATA[g],1)){
      h+=`<details class="l2"><summary>${s}학기<em>${cntOf(DATA[g][s])}개</em></summary><div class="kid">`;
      for(const sub of SUBJ.filter(x=>DATA[g][s][x])){
        h+=`<details class="l3"><summary>${sub}<em>${cntOf(DATA[g][s][sub])}개</em></summary><div class="kid">`;
        for(const p of keysOf(DATA[g][s][sub])){
          h+=`<details class="l4"><summary>${esc(p)}<em>${cntOf(DATA[g][s][sub][p])}개</em></summary><div class="kid">`;
          for(const u of keysOf(DATA[g][s][sub][p])){
            h+=`<details class="l5" data-k="${esc([g,s,sub,p,u].join('\u0001'))}"><summary>${esc(u)}<em>${DATA[g][s][sub][p][u].length}개</em></summary><div class="chips"></div></details>`;
          }
          h+='</div></details>';
        }
        h+='</div></details>';
      }
      h+='</div></details>';
    }
    h+='</div></details>';
  }
  return h;
}
let treeDone=false;
function openIx(){
  $('ixov').hidden=false;
  if(!treeDone){$('ixbody').innerHTML=treeHTML();treeDone=true}
  $('ixsum').textContent='전체 '+ALL.length.toLocaleString()+'개 어휘 · 학년 › 학기 › 교과 › 출판사 › 단원';
  $('ixq').focus({preventScroll:true});
}
function closeIx(){$('ixov').hidden=true}
function jump(g,s,sub,p,u,i){
  Object.assign(S,{g:String(g),s:String(s),sub,pub:p,unit:u,i:+i});
  closeIx();sync('idx');
}
$('ixBtn').addEventListener('click',openIx);
$('ixClose').addEventListener('click',closeIx);
$('ixov').addEventListener('click',e=>{if(e.target===$('ixov'))closeIx()});
$('ixbody').addEventListener('toggle',e=>{
  const d=e.target;
  if(d.classList&&d.classList.contains('l5')&&d.open){
    const c=d.querySelector('.chips');
    if(!c.children.length){
      const [g,s,sub,p,u]=d.dataset.k.split('\u0001');
      c.innerHTML=DATA[g][s][sub][p][u].map((w,i)=>`<button type="button" class="chip" data-j="${esc(d.dataset.k)}\u0001${i}">${esc(w[0])}${w[1]?`<small>${w[1]}</small>`:''}</button>`).join('');
    }
  }
},true);
$('ixbody').addEventListener('click',e=>{
  const b=e.target.closest('[data-j]');if(!b)return;
  const [g,s,sub,p,u,i]=b.dataset.j.split('\u0001');jump(g,s,sub,p,u,i);
});
let qt=0;
$('ixq').addEventListener('input',e=>{
  clearTimeout(qt);const q=e.target.value.trim();
  qt=setTimeout(()=>{
    if(!q){$('ixbody').innerHTML=treeHTML();$('ixsum').textContent='전체 '+ALL.length.toLocaleString()+'개 어휘 · 학년 › 학기 › 교과 › 출판사 › 단원';return}
    const r=ALL.filter(x=>x.w[0].includes(q)||x.w[1].includes(q));
    $('ixsum').textContent=`‘${q}’ 검색 결과 ${r.length.toLocaleString()}개`+(r.length>200?' (앞 200개만 표시)':'');
    $('ixbody').innerHTML=r.slice(0,200).map(x=>`<button type="button" class="hit" data-j="${esc([x.g,x.s,x.sub,x.p,x.u,x.i].join('\u0001'))}"><b>${esc(x.w[0])}${x.w[1]?`<small>${x.w[1]}</small>`:''}</b><span>${x.g}학년 ${x.s}학기 · ${x.sub} · ${esc(x.p)} · ${esc(x.u)}</span></button>`).join('')||'<p class="muted" style="text-align:center">검색 결과가 없어요.</p>';
  },150);
});
sync('init');
</script>
<script>
/* PWA: 서비스 워커 등록 — 처음 열 때 전체 자산을 저장해 두고, 그다음부터는 오프라인에서도 열립니다. 새 버전이 올라오면 자동으로 새로고침합니다. */
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load',()=>{
    let had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had){ console.log('[pwa] 새 버전으로 새로고침'); location.reload(); } had=true; });
    navigator.serviceWorker.register('./sw.js').then(reg=>{ console.log('[pwa] service worker 등록 · scope='+reg.scope); }).catch(e=>console.warn('[pwa] 등록 실패',e));
  });
}
</script>
